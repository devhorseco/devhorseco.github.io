<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Raft Amazonia · Reserva tu aventura (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1d24;--muted:#5c6f77;--line:#e1e9ec;--bg:#f2f6f7;--card:#fff;--river:#0b5d73;--river2:#0f8aa6;--deep:#06303c;--raft:#ff6b2c;--raft2:#ffa62b;--jungle:#2e7d4f;--ok:#14996b;--warn:#b86e00;--danger:#d64545;--r:22px;--sh:0 14px 36px -18px rgba(6,48,60,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:40px;overflow-x:hidden}
.disp{font-family:Archivo,Inter,sans-serif;font-stretch:112%;font-weight:900;letter-spacing:-.5px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#04222b;color:#cde6ec;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--raft2);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(242,246,247,.85);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:Archivo,Inter,sans-serif;font-stretch:115%;font-weight:900;font-size:16px;white-space:nowrap;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.seg{position:relative;display:flex;background:#e2eaed;border-radius:999px;padding:3px}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--river)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 10px}.lang{padding:7px 9px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:400px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:var(--deep)}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,34,43,0) 30%,rgba(4,34,43,.9) 100%)}
.hero .in{position:relative;z-index:2;padding:26px 22px 24px;width:100%}
.eyebrow{display:inline-flex;gap:7px;align-items:center;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-weight:700}
.hero h1{font-size:clamp(38px,8.4vw,74px);line-height:.92;margin:14px 0 10px;text-transform:uppercase;max-width:820px}
.hero h1 em{font-style:normal;color:var(--raft2)}
.hero p{max-width:560px;opacity:.92;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--raft2),var(--raft));color:#2a0e00;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;box-shadow:0 10px 22px -8px rgba(255,107,44,.75);transition:.2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--deep),var(--river));color:#fff;box-shadow:0 10px 22px -10px rgba(6,48,60,.8)}
.btn[disabled]{opacity:.45;pointer-events:none}
.wave{animation:wv 7s linear infinite}@keyframes wv{to{transform:translateX(-200px)}}
.splash circle{fill:#fff;animation:sp2 2.4s ease-out infinite;opacity:0}@keyframes sp2{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.trust b{color:var(--ink)}
.stars{color:#f5a623;letter-spacing:1px}
/* tours */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sh h2{font-size:clamp(24px,4.4vw,34px);text-transform:uppercase}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:12px}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:9px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.filters button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:#fff;border:2px solid transparent;border-radius:22px;overflow:hidden;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;transition:.2s;width:100%}
.tc:hover{transform:translateY(-3px)}
.tc.on{border-color:var(--raft)}
.tc .art{height:110px;position:relative}.tc .art svg{display:block;width:100%;height:100%}
.tc .lvl{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.tc .lvl span{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--deep);text-transform:uppercase;letter-spacing:.3px}
.tc .lvl span.hot{background:var(--raft2);color:#2a0e00}
.tc .bd{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.tc h3{font-family:Archivo,Inter,sans-serif;font-stretch:108%;font-weight:800;font-size:18px;line-height:1.12}
.tc p{color:var(--muted);font-size:13px;flex:1}
.tc .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
.tc .ft{display:flex;align-items:end;justify-content:space-between;margin-top:6px}
.tc .pr b{font-family:Archivo,Inter,sans-serif;font-stretch:110%;font-weight:900;font-size:24px}.tc .pr small{color:var(--muted);font-size:12px;margin-left:3px}
.tc .sel{font-size:13px;font-weight:800;color:var(--river);padding:8px 12px;border-radius:12px;background:#e8f4f7}
.tc.on .sel{background:var(--raft);color:#fff}
/* booking */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
.grid>*,.two>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .bar{height:5px;border-radius:5px;background:#e3ebee;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--raft),var(--raft2));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--raft)}
h2.t{font-family:Archivo,Inter,sans-serif;font-stretch:108%;font-weight:900;font-size:24px;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.picked{display:flex;gap:12px;align-items:center;background:#e8f4f7;border-radius:16px;padding:12px;margin-bottom:14px}
.picked .ic{width:44px;height:44px;border-radius:13px;background:var(--deep);display:grid;place-items:center;font-size:22px;flex:none}
.picked b{display:block;font-size:14.5px}.picked small{color:var(--muted);font-size:12.5px}
.picked button{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--river);text-decoration:underline}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal .head b{font-size:15px}
.nav{width:36px;height:36px;border-radius:12px;background:#eaf0f2;font-size:18px;font-weight:700}
.nav[disabled]{opacity:.3;pointer-events:none}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px;font-weight:600}
.day{aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#eaf3f5;color:var(--deep);transition:.15s}
.day small{font-size:8.5px;font-weight:800;margin-top:1px;color:var(--raft)}
.day.grp{background:#fff0e3;color:#8a3a00}
.day.off{background:transparent;color:#c3cdd1;pointer-events:none}
.day.sel{background:linear-gradient(135deg,var(--deep),var(--river));color:#fff;transform:scale(1.06);box-shadow:0 8px 18px -8px var(--deep)}
.day.sel small{color:#ffd7b8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:15px}.row small{color:var(--muted);font-size:12.5px}
.ctr{display:flex;align-items:center;gap:12px}
.ctr button{width:40px;height:40px;border-radius:12px;background:#eaf0f2;font-size:20px;font-weight:700;transition:.15s}
.ctr button:active{transform:scale(.9)}
.ctr button[disabled]{opacity:.35;pointer-events:none}
.ctr span{min-width:22px;text-align:center;font-weight:800;font-size:18px}
.minbar{margin-top:14px;border-radius:16px;padding:14px;background:#eaf3f5}
.minbar .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;background:#fff;border:2px dashed #b6c7cd}
.dots i.me{background:var(--raft);border:0}
.dots i.oth{background:var(--river2);border:0}
.minbar.ok{background:#e6f6ef}.minbar.ok .top{color:var(--ok)}
.minbar.short{background:#fff4e6}.minbar.short .top{color:var(--warn)}
.minbar p{font-size:12.5px;color:var(--muted);margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;background:#fff;font-size:13.5px}
.choice.on{border-color:var(--raft);background:#fff6f0}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #c3cdd1;flex:none;position:relative}
.choice.on .radio{border-color:var(--raft)}.choice.on .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--raft)}
.choice b{display:block}.choice small{color:var(--muted);font-size:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fafcfd;font-size:15px;outline:0;transition:.2s}
.fld input:focus{border-color:var(--river);background:#fff;box-shadow:0 0 0 4px rgba(15,138,166,.12)}
.fld.err input{border-color:var(--danger)}.fld .em{color:var(--danger);font-size:12px;margin-top:4px}
.tog{display:flex;background:#e2eaed;border-radius:14px;padding:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tog button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.link{color:var(--river);font-size:13px;font-weight:700;text-decoration:underline;margin:2px 0 12px;display:inline-block}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}.actions .btn.sec{flex:0 0 auto}
.mock{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#06303c,#0b5d73 55%,#0f8aa6);margin:12px 0;position:relative;overflow:hidden}
.mock:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:18px;letter-spacing:1.5px;margin-top:10px}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;margin-top:8px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sum h3{font-family:Archivo,Inter,sans-serif;font-stretch:108%;font-weight:900;font-size:19px;margin-bottom:10px;text-transform:uppercase}
.sum .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.sum .ln b{color:var(--ink);text-align:right}
.sum .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.sum .tot .ln.big{font-size:15px;color:var(--ink);font-weight:800}
.sum .dep{background:#fff3ea;border-radius:14px;padding:12px;margin-top:10px}.sum .dep .ln{color:#c2410c;font-weight:800;font-size:15px}.sum .dep .ln.s{color:var(--muted);font-weight:600;font-size:13px}
.sum .pol{font-size:12px;color:var(--muted);margin-top:10px}
.sum .flag{font-size:12.5px;border-radius:12px;padding:10px;margin-top:10px;font-weight:600}
.flag.ok{background:#e6f6ef;color:var(--ok)}.flag.short{background:#fff4e6;color:var(--warn)}
/* done */
.okmark{width:76px;height:76px;margin:0 auto 10px;display:block}
.okmark circle{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .7s .1s forwards}.okmark path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:999px;background:#eaf0f2;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--deep);color:#fff}
.phone{background:#e7e2d9;border-radius:26px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#06303c;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--raft),var(--raft2));display:grid;place-items:center;font-weight:900;font-family:Archivo,sans-serif;font-size:13px}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.75;font-size:11.5px}
.chat{padding:12px;min-height:300px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.85);color:#5d6b70;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase;letter-spacing:.4px}
.msg{max-width:86%;padding:8px 11px 6px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg.tk{padding:4px;width:min(290px,86%)}
.ticket{border-radius:12px;overflow:hidden;background:#fff;border:1px solid #e3e8ea}
.ticket .th{background:linear-gradient(135deg,#06303c,#0f8aa6);color:#fff;padding:12px;position:relative}
.ticket .th small{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;opacity:.8;font-weight:700}
.ticket .th b{display:block;font-family:Archivo,Inter,sans-serif;font-stretch:110%;font-weight:900;font-size:17px;line-height:1.1;margin-top:3px;text-transform:uppercase}
.ticket .th .lg{position:absolute;right:10px;top:10px;font-family:Archivo,sans-serif;font-weight:900;font-size:10px;letter-spacing:.5px;background:rgba(255,255,255,.18);padding:3px 7px;border-radius:6px}
.ticket .tb{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;font-size:12px;position:relative}
.ticket .tb:before{content:"";position:absolute;top:0;left:10px;right:10px;border-top:2px dashed #e3e8ea}
.ticket .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 8px}.ticket .kv span{color:#7a8a8f}.ticket .kv b{font-weight:700}
.ticket .code{grid-column:1/-1;text-align:center;font-weight:900;letter-spacing:3px;font-size:14px;color:var(--deep);padding-top:2px}
.ticket .st{grid-column:1/-1;text-align:center;font-size:11px;font-weight:800;border-radius:8px;padding:5px}
.st.ok{background:#e6f6ef;color:var(--ok)}.st.short{background:#fff4e6;color:var(--warn)}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px;display:flex;justify-content:space-between}
/* details */
.details{display:grid;gap:16px;margin-top:16px}@media(min-width:760px){.details{grid-template-columns:1fr 1fr}}
.details h3{font-size:16px;margin-bottom:10px}
.ck{list-style:none}.ck li{font-size:13.5px;padding:4px 0 4px 24px;position:relative}.ck li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}.ck.no li:before{content:"✕";color:var(--danger)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}.kv2 span{color:var(--muted)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-family:Archivo,Inter,sans-serif;font-stretch:108%;font-weight:900;font-size:28px;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.two{grid-template-columns:1.3fr 1fr;align-items:start}}
h3.sec{font-size:16px;margin:2px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}h3.sec small{font-size:12px;color:var(--muted);font-weight:600;text-align:right}

  const v={first,pick,when,tour:tr(L,'n_'+x.id),date:dLong(b.date,L),bal:money(b.bal),m:st.min,n:st.n};
  if(stage===0)return[['sep',dShort(b.bookedAt,L)],['biz',tr(L,'w0',v),'14:02'],['tk',ticketHTML(b,L,st.ok),'14:02'],...(!st.ok?[['biz',tr(L,'w0s',v),'14:02']]:[]),['biz',tr(L,'w0b',v),'14:02'],['usr',tr(L,'u0',v),'14:05']];
  if(stage===1)return[['sep',dShort(key(addD(parse(b.bookedAt),1)),L)],['biz',tr(L,'w1',v),'11:30'],['tk',ticketHTML(b,L,true),'11:30'],['usr',tr(L,'u1',v),'11:41']];
  return[['sep',dShort(key(addD(parse(b.date),-1)),L)],['biz',tr(L,'w2',v),'18:00'],['usr',tr(L,'u2',v),'18:12']];
}
function showChat(mv,b,stage){
  const L=b.lang,tok=++TOK,msgs=script(b,stage);
  mv.innerHTML=`<div class="phone"><div class="wah"><div class="av">RA</div><div><b>Raft Amazonia</b><small>${tr(L,'wahSub')}</small></div></div><div class="chat"></div><div class="wafoot"><span>${tr(L,'wafoot')}</span><span>🎙️</span></div></div>`;
  const body=mv.querySelector('.chat');let i=0;
  const add=m=>{const d=document.createElement('div');
    if(m[0]==='sep'){d.className='dsep';d.textContent=m[1]}
    else if(m[0]==='tk'){d.className='msg biz tk';d.innerHTML=m[1]+`<span class="tm">${m[2]}</span>`}
    else{d.className='msg '+m[0];d.innerHTML=wa(m[1])+`<span class="tm">${m[2]}${m[0]==='usr'?' ✓✓':''}</span>`}
    body.appendChild(d)};
  const next=()=>{if(tok!==TOK||i>=msgs.length)return;const m=msgs[i];
    if(m[0]==='sep'){add(m);i++;return setTimeout(next,200)}
    if(m[0]!=='usr'){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';body.appendChild(ty);setTimeout(()=>{if(tok!==TOK)return;ty.remove();add(m);i++;setTimeout(next,450)},700)}
    else setTimeout(()=>{if(tok!==TOK)return;add(m);i++;setTimeout(next,300)},650)};
  next();
}

/* ===== OPERACIÓN ===== */
function renderAdmin(){
  const wk=addD(d0,8),inWk=b=>parse(b.date)>d0&&parse(b.date)<wk,nw=B.filter(b=>b.isNew).length;
  const groups={};B.forEach(b=>{const k=b.date+'|'+b.tour;(groups[k]=groups[k]||[]).push(b)});
  const G=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
  const short=G.filter(([k,L])=>{const x=TR(L[0].tour);return L.reduce((a,b)=>a+b.ppl+(b.extra||0),0)<x.min}).length;
  $('#kpis').innerHTML=[['kRes',B.length,nw?t('kNew',{n:nw}):''],['kPax',B.filter(inWk).reduce((a,b)=>a+b.ppl,0),''],['kDep',money(B.reduce((a,b)=>a+b.dep,0)),''],['kShort',short,'']].map(k=>`<div class="kpi"><small>${t(k[0])}</small><b>${k[1]}</b><em>${k[2]}</em></div>`).join('');
  $('#deps').innerHTML=G.slice(0,7).map(([k,L])=>{const x=TR(L[0].tour),n=L.reduce((a,b)=>a+b.ppl+(b.extra||0),0),ok=n>=x.min,nwG=L.some(b=>b.isNew);
    return `<div class="dep2 ${nwG?'new':''}"><div class="h"><div><b>${x.ic} ${t('n_'+x.id)}</b><small>${dShort(L[0].date)} · 9:00 · ${n}/${x.min}+</small></div><span class="pill ${ok?'ok':'short'}">${ok?t('confirmed'):t('shortP',{n:x.min-n})}</span></div><div class="pax">${L.map(b=>`<button class="px" onclick="openBk(${b.id})"><b>${esc(b.name)}</b>${b.example?`<span class="tag ex">${t('ex')}</span>`:''}${b.isNew?`<span class="tag nw">${t('nw')}</span>`:''}<small>${pW(b.ppl+(b.extra||0))} · ${money(b.dep)}</small></button>`).join('')}</div></div>`}).join('');
  const tm=key(addD(d0,1));let P=B.filter(b=>b.date===tm);
  if(S.done&&!P.length){P=B.filter(b=>b.date===S.done.date)}
  $('#pickDay').textContent=P.length?dShort(P[0].date):'';
  $('#pick').innerHTML=P.length?P.map(b=>`<li><span class="tm">${b.pk==='hostel'?'8:45':'9:00'}</span><div><b>${esc(b.name)}</b> · ${pW(b.ppl+(b.extra||0))}<small>${b.pk==='hostel'?'🚐 '+esc(b.hostel):'📍 '+t('office')} · ${t('n_'+b.tour)}</small></div></li>`).join(''):`<li>${t('noPick')}</li>`;
}
function openBk(id){const b=B.find(x=>x.id===id);if(!b)return;
  $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><h3 style="font-size:18px">${esc(b.name)} <span style="color:var(--muted);font-weight:600;font-size:13px">${b.code}</span></h3><p class="sub" style="margin:4px 0 8px">${t('n_'+b.tour)} · ${dShort(b.date)} · ${pW(b.ppl)}</p><div id="mm"></div></div></div>`;
  msgView(b,$('#mm'))}
function closeM(){TOK++;$('#modal').innerHTML=''}

applyI18n();renderClient();
