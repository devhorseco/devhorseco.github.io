<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Santa Rita · Pueblo del Cacao y Chocolate (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1a12;--muted:#7a675c;--line:#eadfd4;--bg:#fbf6ef;--card:#fff;--cacao:#4a2516;--cacao2:#7a3b1f;--pod:#c8742c;--gold:#e8b04a;--leaf:#3d7a4a;--leaf2:#5c9a5f;--ok:#2f8a4f;--danger:#c4453a;--r:22px;--sh:0 14px 36px -18px rgba(74,37,22,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:40px;overflow-x:hidden}
h1,h2,h3.serif,.serif{font-family:Fraunces,Georgia,serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#22120b;color:#efd9c4;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(251,246,239,.85);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.seg{position:relative;display:flex;background:#f0e6da;border-radius:999px;padding:3px}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--cacao2)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 10px}.lang{padding:7px 9px}.brand b{font-size:14px}}
@media(max-width:430px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:400px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:#3a1d10}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(34,18,11,0) 25%,rgba(34,18,11,.88) 100%)}
.hero .in{position:relative;z-index:2;padding:26px 22px 24px;width:100%}
.kw{font-family:Fraunces,serif;font-style:italic;font-size:15px;color:#ffd58a;margin-bottom:6px}
.eyebrow{display:inline-flex;gap:7px;align-items:center;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-weight:600}
.hero h1{font-size:clamp(34px,7.4vw,62px);line-height:1;letter-spacing:-1px;margin:12px 0 10px;font-weight:800;max-width:780px}
.hero h1 em{font-style:italic;font-weight:600;color:#ffd58a}
.hero p{max-width:580px;opacity:.92;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.heroRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--pod));color:#2a1300;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;box-shadow:0 10px 22px -8px rgba(200,116,44,.75);transition:.2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;backdrop-filter:blur(6px)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--cacao),var(--cacao2));color:#fff;box-shadow:0 10px 22px -10px rgba(74,37,22,.8)}
.btn[disabled]{opacity:.45;pointer-events:none}
.drip{animation:drip 3.5s ease-in-out infinite}@keyframes drip{50%{transform:translateY(6px)}}
.leafs{animation:sway 6s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes sway{to{transform:rotate(2deg)}}
/* sections */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px}
.sh h2{font-size:clamp(24px,4vw,32px);letter-spacing:-.5px}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.xp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.x{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:.25s}
.x:hover{transform:translateY(-3px)}
.x .art{height:118px;position:relative}
.x .art svg{width:100%;height:100%;display:block}
.x .art .tg{position:absolute;left:12px;top:12px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase}
.tg.star{background:var(--gold);color:#2a1300}.tg.q{background:rgba(255,255,255,.9);color:var(--cacao)}
.x .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.x h3{font-family:Fraunces,serif;font-size:19px;line-height:1.15}
.x p{color:var(--muted);font-size:13.5px;flex:1}
.x ul{list-style:none;font-size:13px;display:grid;gap:3px;margin:4px 0}
.x ul li:before{content:"✓ ";color:var(--ok);font-weight:800}
.x .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.x .pr b{font-size:22px;letter-spacing:-.5px}.x .pr small{color:var(--muted);font-size:12px;margin-left:4px}
.x .pr.q b{font-size:14px;color:var(--muted)}
.mini{padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;background:var(--cacao);color:#fff}
.mini.alt{background:#f3ebe1;color:var(--cacao)}
/* booking */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.two>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.mode{display:flex;background:#f0e6da;border-radius:16px;padding:4px;margin-bottom:18px}
.mode button{flex:1;padding:11px 8px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .bar{height:5px;border-radius:5px;background:#efe5d9;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cacao2),var(--pod));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--cacao2)}
h2.t{font-size:23px;letter-spacing:-.3px;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal .head b{font-size:15px}
.nav{width:36px;height:36px;border-radius:12px;background:#f3ebe1;font-size:18px;font-weight:700}
.nav[disabled]{opacity:.3;pointer-events:none}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px;font-weight:600}
.day{aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#f6efe6;color:var(--cacao);transition:.15s}
.day small{font-size:8.5px;font-weight:700;opacity:.75;margin-top:1px}
.day.grp{background:#fbe7c6;color:#7a4a05}
.day.off{background:transparent;color:#cbbfb3;pointer-events:none}
.day.sel{background:linear-gradient(135deg,var(--cacao),var(--cacao2));color:#fff;transform:scale(1.06);box-shadow:0 8px 18px -8px var(--cacao)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;background:#fff}
.slot.on{border-color:var(--cacao2);background:#fbf1e8;color:var(--cacao)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:15px}.row small{color:var(--muted);font-size:12.5px}
.ctr{display:flex;align-items:center;gap:12px}
.ctr button{width:38px;height:38px;border-radius:12px;background:#f3ebe1;font-size:20px;font-weight:700;transition:.15s}
.ctr button:active{transform:scale(.9)}
.ctr button[disabled]{opacity:.35;pointer-events:none}
.ctr span{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.addon{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;width:100%;text-align:left;background:#fff;transition:.2s}
.addon.on{border-color:var(--cacao2);background:#fbf1e8}
.addon .ic{width:38px;height:38px;border-radius:12px;background:#f3ebe1;display:grid;place-items:center;font-size:19px;flex:none}
.addon .tx{flex:1;min-width:0}.addon b{display:block;font-size:14px}.addon small{color:var(--muted);font-size:12px}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid #d4c4b4;flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.addon.on .cb{background:var(--cacao2);border-color:var(--cacao2)}
.hint{display:flex;gap:10px;align-items:flex-start;background:#fbf1e8;border-radius:14px;padding:12px;font-size:13px;margin-top:10px;color:#6a4a36}
.warn{background:#fff1ef;color:#a3352b;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fffcf8;font-size:15px;outline:0;transition:.2s}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cacao2);background:#fff;box-shadow:0 0 0 4px rgba(122,59,31,.1)}
.fld.err input{border-color:var(--danger)}.fld .em{color:var(--danger);font-size:12px;margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;background:#f0e6da;border-radius:14px;padding:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tog button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:#fff}
.chipsel button.on{background:var(--cacao);border-color:var(--cacao);color:#fff}
.link{color:var(--cacao2);font-size:13px;font-weight:700;text-decoration:underline;margin:2px 0 12px;display:inline-block}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}.actions .btn.sec{flex:0 0 auto}
.mock{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#4a2516,#7a3b1f 55%,#c8742c);margin:12px 0;position:relative;overflow:hidden}
.mock:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:18px;letter-spacing:1.5px;margin-top:10px}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;margin-top:8px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sum h3{font-family:Fraunces,serif;font-size:19px;margin-bottom:10px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.sum .ln b{color:var(--ink);text-align:right}
.sum .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.sum .tot .ln.big{font-size:15px;color:var(--ink);font-weight:800}
.sum .dep{background:#fbf1e8;border-radius:14px;padding:12px;margin-top:10px}.sum .dep .ln{color:var(--cacao2);font-weight:800;font-size:15px}.sum .dep .ln.s{color:var(--muted);font-weight:600;font-size:13px}
.sum .q{font-size:12.5px;color:#7a4a05;background:#fdf3df;border-radius:12px;padding:10px;margin-top:10px}
.sum .imp{display:flex;gap:10px;align-items:center;background:#eef6ef;color:#2c5b36;border-radius:14px;padding:12px;margin-top:12px;font-size:12.5px}
.sum .imp b{font-size:13.5px;display:block}
/* done */
.ok{width:76px;height:76px;margin:0 auto 10px;display:block}
.ok circle{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .7s .1s forwards}.ok path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.center{text-align:center}
.voucher{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#22120b,#7a3b1f);color:#fff;border-radius:20px;padding:16px;margin:16px 0}
.voucher .qr{background:#fff;border-radius:12px;padding:6px;flex:none}
.voucher h4{font-family:Fraunces,serif;font-size:18px}.voucher p{font-size:12.5px;opacity:.9;margin-top:2px}
.voucher .code{display:inline-block;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:8px;font-weight:800;letter-spacing:1.5px;margin-bottom:6px;font-size:13px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:999px;background:#f3ebe1;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--cacao);color:#fff}
.phone{background:#ece3d6;border-radius:26px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#3b1e11;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pod),var(--leaf));display:grid;place-items:center;font-weight:800;font-family:Fraunces,serif}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.75;font-size:11.5px}
.chat{padding:12px;min-height:300px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.85);color:#6b5a50;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase;letter-spacing:.4px}
.msg{max-width:86%;padding:8px 11px 6px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg.loc{padding:4px;width:250px}
.msg.loc .map{height:110px;border-radius:10px;overflow:hidden}
.msg.loc .cap{padding:6px 7px 2px;font-size:13px}.msg.loc .cap b{display:block}.msg.loc .cap small{color:#6b7a75}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px;display:flex;justify-content:space-between}
/* how to get */
.how{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:820px){.how{grid-template-columns:1.1fr 1fr}}
.how .map{border-radius:18px;overflow:hidden;min-height:220px;background:#e7efe3}
.how ol{padding-left:20px;font-size:14px;display:grid;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;margin-top:12px}.kv span{color:var(--muted)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:26px;letter-spacing:-.8px;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.two{grid-template-columns:1.4fr 1fr;align-items:start}}
.bk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);margin-bottom:9px;width:100%;text-align:left;background:#fff;transition:.2s}
.bk:hover{border-color:var(--pod);transform:translateY(-1px)}
.bk.new{background:#fbf1e8;border-color:var(--pod);animation:glow 1.6s 2}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(200,116,44,.2)}}
.av2{width:44px;height:44px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;background:linear-gradient(135deg,var(--cacao),var(--pod));line-height:1}
.av2 b{font-size:17px}.av2 small{font-size:9.5px;color:#ffe2c4;text-transform:uppercase;margin-top:2px}
.av2.g{background:linear-gradient(135deg,var(--leaf),#2c5b36)}
.bk .m{flex:1;min-width:0}.bk .nm{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bk small{color:var(--muted);font-size:12.5px}

const S={lang:'es',view:'client',mode:'v',step:1,date:null,time:'10:00',ppl:4,adds:[],name:'',phone:'',email:'',clang:null,pay:'bank',month:null,done:null,paying:false,errs:{},newCount:0,
  g:{type:0,org:'',name:'',phone:'',size:'',date:'',ints:['choco'],note:'',done:null,err:false}};
const B=[];
const $=s=>document.querySelector(s);
const tr=(l,k,v={})=>{let s=T[l][k]??T.es[k]??k;if(typeof s!=='string')return s;for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const t=(k,v)=>tr(S.lang,k,v);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const d0=new Date();d0.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const loc=l=>(l||S.lang)==='es'?'es-EC':'en-US';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fd=(k,o,l)=>cap(new Intl.DateTimeFormat(loc(l),o).format(parse(k)));
const dLong=(k,l)=>fd(k,{weekday:'long',day:'numeric',month:'long'},l);
const dShort=(k,l)=>fd(k,{weekday:'short',day:'numeric',month:'short'},l);
const maxD=addD(d0,150);
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const xpName=(id,l)=>tr(l||S.lang,'x_'+id);
const pplW=(n,l)=>n+' '+T[l||S.lang].pplW[n===1?0:1];

function renderClient(){
  $('#mode').innerHTML=`<button class="${S.mode==='v'?'on':''}" onclick="S.mode='v';renderClient()">${t('mV')}</button><button class="${S.mode==='g'?'on':''}" onclick="S.mode='g';renderClient()">${t('mG')}</button>`;
  if(S.mode==='g'){$('#stepper').innerHTML='';renderGroup();renderSummary();return}
  if(S.done)$('#stepper').innerHTML='';
  else $('#stepper').innerHTML=[1,2,3,4].map(i=>`<div class="stp ${S.step===i?'on':''} ${S.step>i?'done':''}"><div class="bar"><i></i></div><span>${i}. ${t('st'+i)}</span></div>`).join('');
  const el=$('#stepBody');
  if(S.done)renderDone(el);else el.innerHTML=[null,v1,v2,v3,v4][S.step]();
  renderSummary();
}
function v1(){
  if(!S.month)S.month=new Date(addD(d0,1).getFullYear(),addD(d0,1).getMonth(),1);
  const m=S.month,first=new Date(m.getFullYear(),m.getMonth(),1),off=(first.getDay()+6)%7,nd=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),mon=new Date(2024,0,1);
  const dow=[...Array(7)].map((_,i)=>`<div>${cap(new Intl.DateTimeFormat(loc(),{weekday:'short'}).format(addD(mon,i)))}</div>`).join('');
  let c='';for(let i=0;i<off;i++)c+='<div></div>';
  for(let d=1;d<=nd;d++){const dt=new Date(m.getFullYear(),m.getMonth(),d),k=key(dt);
    if(dt<=d0||dt>maxD){c+=`<div class="day off">${d}</div>`;continue}
    c+=`<button class="day ${grpDay(k)?'grp':''} ${S.date===k?'sel':''}" onclick="S.date='${k}';renderClient()">${d}</button>`}
  const prevOff=m<=new Date(d0.getFullYear(),d0.getMonth(),1),nextOff=m>=new Date(maxD.getFullYear(),maxD.getMonth(),1);
  const H=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00'];
  return `<h2 class="t">${t('dT')}</h2><p class="sub">${t('dS')}</p>
  <div class="cal"><div class="head"><button class="nav" ${prevOff?'disabled':''} onclick="mv(-1)">‹</button><b>${cap(new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(m))}</b><button class="nav" ${nextOff?'disabled':''} onclick="mv(1)">›</button></div><div class="dow">${dow}</div><div class="days">${c}</div></div>
  <div class="legend"><span><i style="background:#f6efe6;border:1px solid #e3d5c5"></i>${t('lgOk')}</span><span><i style="background:#fbe7c6"></i>${t('lgGrp')}</span></div>
  ${S.date?`<span class="lbl">${t('hour')} · ${dLong(S.date)}</span><div class="slots">${H.map(h=>`<button class="slot ${S.time===h?'on':''}" onclick="S.time='${h}';renderClient()">${h}</button>`).join('')}</div>`:''}
  <div class="actions"><button class="btn pri" ${S.date?'':'disabled'} onclick="go(2)">${t('next')} →</button></div>`;
}

  el.innerHTML=`<h2 class="t">${t('gT')}</h2><p class="sub">${t('gS')}</p>
  <div class="fld"><label>${t('gType')}</label><div class="chipsel">${types.map((x,i)=>`<button class="${g.type===i?'on':''}" onclick="S.g.type=${i};renderGroup()">${x}</button>`).join('')}</div></div>
  <div class="fld"><label>${t('gOrg')}</label><input value="${esc(g.org)}" oninput="S.g.org=this.value" placeholder="Ej. Amazonía Viajes"></div>
  <div class="f2"><div class="fld"><label>${t('name')}</label><input value="${esc(g.name)}" oninput="S.g.name=this.value"></div><div class="fld"><label>${t('phone')}</label><input type="tel" value="${esc(g.phone)}" oninput="S.g.phone=this.value" placeholder="+593…"></div></div>
  <div class="f2"><div class="fld"><label>${t('gSize')}</label><input type="number" min="1" value="${esc(g.size)}" oninput="S.g.size=this.value" placeholder="25"></div><div class="fld"><label>${t('gDate')}</label><input type="date" value="${esc(g.date)}" min="${key(addD(d0,1))}" oninput="S.g.date=this.value"></div></div>
  <div class="fld"><label>${t('gInt')}</label><div class="chipsel">${XP.map(x=>`<button class="${g.ints.includes(x.id)?'on':''}" onclick="togInt('${x.id}')">${x.ic} ${xpName(x.id)}</button>`).join('')}</div></div>
  <div class="fld"><label>${t('gNote')}</label><textarea oninput="S.g.note=this.value" placeholder="${t('gNoteP')}">${esc(g.note)}</textarea></div>
  <button class="link" onclick="gFill()">${t('autofill')}</button>
  ${g.err?`<div class="warn">${t('gErr')}</div>`:''}
  <div class="actions"><button class="btn pri" onclick="gSend()">${t('gSend')} →</button></div>`;
}
function togInt(id){const a=S.g.ints,i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);renderGroup()}
function gFill(){Object.assign(S.g,{org:'Amazonía Viajes (ejemplo)',name:'Jorge Tapuy',phone:'+593 98 765 4321',size:'25',date:key(addD(d0,12)),err:false});if(S.g.ints.length<2)S.g.ints=['choco','senderos','danza'];renderGroup()}
function gSend(){const g=S.g;if(!g.name.trim()||!g.org.trim()||g.phone.replace(/\D/g,'').length<7||!(+g.size>0)||!g.date){g.err=true;return renderGroup()}
  g.err=false;const b={id:200+B.length,code:'GR-'+(500+Math.floor(Math.random()*499)),kind:'g',name:g.org.trim(),contact:g.name.trim(),phone:g.phone,date:g.date,time:'—',ppl:+g.size,adds:g.ints.filter(x=>x!=='choco'),lang:S.lang,total:0,dep:0,bal:0,example:false,isNew:true,bookedAt:key(d0),gtype:g.type};
  B.unshift(b);g.done=b;S.newCount++;updateBadge();renderGroup();document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'})}

/* ===== MENSAJES ===== */
let TOK=0;
function msgView(b,mount,stage=0){
  if(b.kind==='g'){mount.innerHTML='<div class="mv"></div>';return showChat(mount.querySelector('.mv'),b,'g')}
  mount.innerHTML=`<div class="tabs"><button class="${stage===0?'on':''}" data-s="0">💬 ${t('j0')}</button><button class="${stage===1?'on':''}" data-s="1">🗺️ ${t('j1')}</button></div><div class="mv"></div>`;
  mount.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>msgView(b,mount,+x.dataset.s));
  showChat(mount.querySelector('.mv'),b,stage);
}
const wa=s=>esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function script(b,stage){
  const L=b.lang,first=b.name.split(/[\s(&]/)[0],list=b.adds.map(a=>xpName(a,L)).join(', ');
  if(stage==='g'){const v={org:b.name,size:b.ppl,date:dLong(b.date,L),list:[xpName('choco',L),...b.adds.map(a=>xpName(a,L))].join(', '),extra:b.adds.length?b.adds.map(a=>xpName(a,L)).join(' · '):tr(L,'g2x')};
    return[['sep',dShort(b.bookedAt,L)],['usr',tr(L,'g0',v),'09:10'],['biz',tr(L,'g1',v),'09:10'],['biz',tr(L,'g2',v),'09:42'],['usr',tr(L,'g3',v),'09:55']]}
  const v={first,code:b.code,date:dLong(b.date,L),time:b.time,ppl:pplW(b.ppl,L),dep:money(b.dep),bal:money(b.bal),list};
  if(stage===0)return[['sep',dShort(b.bookedAt,L)],['biz',tr(L,'w_ok',v),'10:20'],...(b.adds.length?[['biz',tr(L,'w_q',v),'10:20']]:[]),['usr',tr(L,'w_u0',v),'10:31']];
  return[['sep',dShort(key(addD(parse(b.date),-1)),L)],['biz',tr(L,'w_dir',v),'17:00'],['loc','','17:00'],['usr',tr(L,'w_u1',v),'17:15'],['biz',tr(L,'w_b1',v),'17:16']];
}
function showChat(mv,b,stage){
  const L=b.lang,tok=++TOK,msgs=script(b,stage);
  mv.innerHTML=`<div class="phone"><div class="wah"><div class="av">SR</div><div><b>CTC Santa Rita</b><small>${tr(L,'wahSub')}</small></div></div><div class="chat"></div><div class="wafoot"><span>${tr(L,'wafoot')}</span><span>🎙️</span></div></div>`;
  const body=mv.querySelector('.chat');let i=0;
  const add=m=>{const d=document.createElement('div');
    if(m[0]==='sep'){d.className='dsep';d.textContent=m[1]}
    else if(m[0]==='loc'){d.className='msg biz loc';d.innerHTML=`<div class="map"><svg viewBox="0 0 250 110" width="100%" height="100%"><rect width="250" height="110" fill="#e7efe3"/><path d="M40 -5L60 115" stroke="#fff" stroke-width="7"/><path d="M55 60C110 55 150 40 190 30" stroke="#c8742c" stroke-width="3" stroke-dasharray="6 5" fill="none"/><path d="M190 10c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12z" fill="#c4453a"/><circle cx="190" cy="22" r="4" fill="#fff"/></svg></div><div class="cap"><b>📍 ${esc(tr(L,'locT'))}</b><small>${esc(tr(L,'locS'))}</small></div><span class="tm">${m[2]}</span>`}
    else{d.className='msg '+m[0];d.innerHTML=wa(m[1])+`<span class="tm">${m[2]}${m[0]==='usr'?' ✓✓':''}</span>`}
    body.appendChild(d)};
  const next=()=>{if(tok!==TOK||i>=msgs.length)return;const m=msgs[i];
    if(m[0]==='sep'){add(m);i++;return setTimeout(next,200)}
    if(m[0]!=='usr'){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';body.appendChild(ty);setTimeout(()=>{if(tok!==TOK)return;ty.remove();add(m);i++;setTimeout(next,450)},700)}
    else setTimeout(()=>{if(tok!==TOK)return;add(m);i++;setTimeout(next,300)},650)};
  next();
}

/* ===== COMUNIDAD ===== */
function renderAdmin(){
  const wk=addD(d0,8),inWk=b=>parse(b.date)>d0&&parse(b.date)<wk;
  const dep=B.reduce((a,b)=>a+b.dep,0),ppl=B.filter(inWk).reduce((a,b)=>a+b.ppl,0),gq=B.filter(b=>b.kind==='g').length,nw=B.filter(b=>b.isNew).length;
  $('#kpis').innerHTML=[['kRes',B.length,nw?t('kNew',{n:nw}):''],['kPpl',ppl,''],['kDep',money(dep),''],['kGrp',gq,'']].map(k=>`<div class="kpi"><small>${t(k[0])}</small><b>${k[1]}</b><em>${k[2]}</em></div>`).join('');
  const sorted=[...B].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)||a.date.localeCompare(b.date));
  $('#bkList').innerHTML=sorted.map(b=>{const g=b.kind==='g';const ad=b.adds.length?' · + '+b.adds.map(a=>xpName(a)).join(', '):'';
    return `<button class="bk ${b.isNew?'new':''}" onclick="openBk(${b.id})"><div class="av2 ${g?'g':''}"><b>${b.ppl}</b><small>pax</small></div><div class="m"><div class="nm">${esc(b.name)}${g?`<span class="tag ag">${t('ag')}</span>`:''}${b.example?`<span class="tag ex">${t('ex')}</span>`:''}${b.isNew?`<span class="tag nw">${t('nw')}</span>`:''}</div><small>${dShort(b.date)}${b.time!=='—'?' · '+b.time:''}${esc(ad)}</small><br><span class="st ${g?'quote':'paid'}">${g?'⏳ '+t('stQuote'):'✓ '+t('stPaid')}</span></div><div class="am">${g?'':`<b>${money(b.total)}</b><small>${money(b.dep)}</small>`}</div></button>`}).join('');
  const days=[...Array(7)].map((_,i)=>key(addD(d0,i+1)));
  $('#kitchen').innerHTML=days.map(k=>{const L=B.filter(b=>b.date===k);const n=L.reduce((a,b)=>a+b.ppl,0);const d=parse(k);
    return `<li><div class="dt"><b>${d.getDate()}</b><small>${new Intl.DateTimeFormat(loc(),{weekday:'short'}).format(d)}</small></div><div class="m"><b>${L.length?L.map(b=>esc(b.name)).join(', '):'—'}</b><small>${L.length?L.map(b=>b.time!=='—'?b.time:t('ag')).join(' · '):''}</small></div><div class="n">${n}<small>${t('lunches')}</small></div></li>`}).join('');
  $('#eco').innerHTML=`<h3>${t('ecoT')}</h3><div class="big">${money(B.reduce((a,b)=>a+b.total,0))}</div><p>${t('ecoS')}</p>`;
}
function openBk(id){const b=B.find(x=>x.id===id);if(!b)return;
  $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><h3 style="font-size:18px">${esc(b.name)} <span style="color:var(--muted);font-weight:600;font-size:13px">${b.code}</span></h3><p class="sub" style="margin:4px 0 8px">${dShort(b.date)}${b.time!=='—'?' · '+b.time:''} · ${pplW(b.ppl)}${b.total?' · '+money(b.total):''}</p><div id="mm"></div></div></div>`;
  msgView(b,$('#mm'))}
function closeM(){TOK++;$('#modal').innerHTML=''}

applyI18n();renderClient();
</script>
