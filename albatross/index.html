<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hotel Albatross · Reserva directa (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10283a;--muted:#5f7180;--line:#e2e8ec;--bg:#f5f8f9;--card:#fff;--sea:#0a6e8f;--sea2:#1495b8;--sun:#f59e3b;--sun2:#f7b866;--sand:#f4e6cc;--ok:#2e8b57;--danger:#c0392b;--r:22px;--sh:0 16px 36px -20px rgba(10,60,90,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:30px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#0b2233;color:#d4e8f0;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--sun);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(245,248,249,.9);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-family:"Playfair Display",serif;font-weight:700;font-size:19px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{display:flex;background:#e4ebee;border-radius:999px;padding:3px}
.seg button{position:relative;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--sea)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:8px 9px}.lang{padding:7px 8px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:440px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:#0a6e8f}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,35,0) 25%,rgba(5,20,35,.82) 100%)}
.hero .in{position:relative;z-index:2;padding:56px 22px 24px;width:100%}
.phl{position:absolute;top:14px;right:14px;z-index:3;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--muted);text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#ffd79a}
.hero h1{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(36px,7.4vw,62px);line-height:1.02;margin:8px 0 10px;max-width:760px}
.hero p{max-width:560px;font-size:15px;opacity:.95}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(5,10,20,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--sun),var(--sun2));color:#3a2200;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;transition:.2s;text-decoration:none;box-shadow:0 10px 22px -8px rgba(245,158,59,.7)}
.btn:hover{transform:translateY(-2px)}
.btn.sea{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;box-shadow:0 10px 22px -10px rgba(10,110,143,.8)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
@media(max-width:700px){.bld{display:none}}
.swim{animation:sw 9s ease-in-out infinite alternate}@keyframes sw{to{transform:translateX(70px)}}
.perks{margin-top:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.perks div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;gap:11px;align-items:center;font-size:13px}
.perks i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:#e6f3f8;display:grid;place-items:center;flex:none}
.perks b{display:block;font-size:14px}.perks small{color:var(--muted)}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sh h2{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(26px,4.4vw,34px);line-height:1.05}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.two>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.stp .bar{height:5px;border-radius:5px;background:#e6edf0;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--sun));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--sea)}
h2.t{font-family:"Playfair Display",serif;font-weight:700;font-size:26px;line-height:1.1;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .head b{font-size:15px}
.cal .head button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}
.cal .head button[disabled]{opacity:.3}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border-radius:11px;font-size:13.5px;font-weight:700;background:#e6f3f8;color:var(--sea);display:grid;place-items:center}
.day.x{color:#b5c0c6;text-decoration:line-through;background:#f0f3f4;pointer-events:none}
.day.e{background:none;pointer-events:none}
.day.in{background:#fde7cc;color:#a85d0a;border-radius:6px}
.day.s,.day.f{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff}
.range{display:flex;align-items:center;gap:10px;background:#eef4f6;border-radius:16px;padding:12px 14px;font-size:13px;margin-top:12px}
.range b{display:block;font-size:14px}.range small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.range .n{margin-left:auto;font-weight:800}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.cnt b{display:block;font-size:14.5px}.cnt small{color:var(--muted);font-size:12px}
.stepr{display:flex;align-items:center;gap:10px}
.stepr button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;font-weight:700;background:#fff}
.stepr button[disabled]{opacity:.3}
.stepr span{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.rooms{display:grid;gap:9px}
.rm{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:18px;padding:10px;background:#fff;width:100%}
.rm.on{border-color:var(--sea);background:#f1f8fb}
.rm.dis{opacity:.45;pointer-events:none}
.rm .art{width:84px;height:68px;border-radius:12px;overflow:hidden;flex:none}
.rm .art svg{width:100%;height:100%;display:block}
.rm .mid{flex:1;min-width:0}
.rm b{display:block;font-size:14.5px;line-height:1.2}
.rm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rm .pr{text-align:right;flex:none}.rm .pr b{font-size:17px}.rm .pr small{font-size:11px}
.rm .why{color:var(--danger);font-weight:700}
.tag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-top:3px;background:#fff1d6;color:#9a6a00}
.tag.r{background:#e3f3e9;color:var(--ok)}
.tours{display:grid;gap:9px}
.to{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:18px;padding:11px;background:#fff;width:100%}
.to.on{border-color:var(--sun);background:#fff8ee}
.to .ic{font-size:22px;width:44px;height:44px;border-radius:13px;background:#e6f3f8;display:grid;place-items:center;flex:none}
.to b{display:block;font-size:14.5px}.to small{display:block;color:var(--muted);font-size:12.3px}
.to .ck{margin-left:auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;color:#fff}
.to.on .ck{background:var(--sun);border-color:var(--sun)}
.tip{display:flex;gap:9px;align-items:flex-start;background:#fff6e6;border-radius:14px;padding:10px 12px;font-size:12.8px;color:#7a4f06;margin-top:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;width:100%}
.fld input:focus{outline:none;border-color:var(--sea2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.lnk{font-size:12.5px;font-weight:700;color:var(--sea);text-decoration:underline;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 13px;font-size:13.5px;font-weight:700}
.pill.on{border-color:var(--sea);background:#f1f8fb;color:var(--sea)}
.mock{border-radius:16px;padding:14px;color:#fff;background:linear-gradient(135deg,#0b2233,var(--sea2));margin:6px 0}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:16px;letter-spacing:1.5px;margin-top:6px}
.err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:16px;margin-top:4px}
.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.center{text-align:center}
.sum h3{font-family:"Playfair Display",serif;font-weight:700;font-size:23px;margin-bottom:8px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.ln b{color:var(--ink);text-align:right}
.hr{border-top:1px dashed var(--line);margin:8px 0}
.ln.big{font-size:16px;color:var(--ink);font-weight:800}
.dep{background:#e6f3f8;border-radius:14px;padding:11px 12px;margin-top:8px}.dep .ln{color:var(--sea);font-weight:800}.dep .ln.s{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.tabs button{padding:9px 13px;border-radius:999px;background:#e4ebee;font-size:12.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--sea);color:#fff}
.phone{background:#e6ddcf;border-radius:22px;overflow:hidden;border:1px solid var(--line);max-width:430px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#075e54;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.8;font-size:11.5px}
.chat{padding:12px;min-height:280px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.88);color:#667;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase}
.msg{max-width:88%;padding:8px 11px 6px;border-radius:14px;font-size:13.4px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;white-space:pre-wrap;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;white-space:normal}
.msg .act span{font-size:12px;font-weight:700;color:#0a7cff;background:#f2f7ff;border-radius:8px;padding:5px 9px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:25px;font-weight:800;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;border:0}.kpi.hl small{color:#d4eef7}
.ad2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.ad2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.card h3.s{font-family:"Playfair Display",serif;font-weight:700;font-size:21px}
.card .s2{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.occ{overflow-x:auto}
.og{display:grid;grid-template-columns:120px repeat(10,minmax(26px,1fr));gap:3px;min-width:430px;font-size:11px}
.og .h{font-weight:800;color:var(--muted);text-align:center}
.og .rn{font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.og i{height:22px;border-radius:5px;background:#eef3f5}
.og i.b{background:#9cc9da}.og i.n{background:var(--sun)}
.lg2{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.bk{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;border:1px solid var(--line);margin-bottom:8px;background:#fff}
.bk.nw{background:#fff8ee;border-color:var(--sun2);box-shadow:0 0 0 3px #fde7cc}
.bk .d{width:46px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--sea),var(--sea2));line-height:1;flex:none}
.bk .d b{font-size:16px}.bk .d small{font-size:9px;text-transform:uppercase;color:#d4eef7;margin-top:2px}
.bk .m{flex:1;min-width:0}.bk .m b{font-size:14px}.bk .m small{display:block;color:var(--muted);font-size:12px}
.tg2{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-left:5px;vertical-align:1px;background:#e9eef0;color:#6c7c86}
.tg2.n{background:var(--sun);color:#3a2200}
.tg2.t{background:#e6f3f8;color:var(--sea)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 14px 8px;max-width:800px;margin:0 auto}
</style>
</head>
<body>
<div class="demobar"><span class="dot"></span><span data-t="demobar"></span></div>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="12" fill="#0b3954"/><path d="M4 19 Q12 10 19 17 Q26 10 34 19 Q26 15 19 21 Q12 15 4 19Z" fill="#fff"/><path d="M8 28 q4 -3 8 0 t8 0 t8 0" stroke="#5fd3e0" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><b>Hotel Albatross</b><small data-t="brandsub"></small></div>
  </div>
  <div class="seg"><button id="tC" class="on" onclick="view('c')" data-t="tabC"></button><button id="tA" onclick="view('a')"><span data-t="tabA"></span><i class="badge" id="bdg" hidden>1</i></button></div>
  <button class="lang" onclick="toggleLang()"><span id="lEs" class="on">ES</span> · <span id="lEn">EN</span></button>
</header>

<div id="vC">
  <section class="hero">
    <svg class="heroart" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3954"/><stop offset=".6" stop-color="#3f6f8f"/><stop offset="1" stop-color="#f0a868"/></linearGradient><linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd3e0"/><stop offset="1" stop-color="#1495b8"/></linearGradient></defs>
      <rect width="1200" height="500" fill="url(#sk)"/>
      <g fill="#fff" opacity=".8"><circle cx="120" cy="60" r="1.6"/><circle cx="340" cy="40" r="1.3"/><circle cx="560" cy="80" r="1.5"/><circle cx="980" cy="50" r="1.4"/><circle cx="1110" cy="110" r="1.2"/></g>
      <g class="swim"><path d="M700 120 Q730 96 752 114 Q774 96 804 120 Q774 108 752 124 Q730 108 700 120Z" fill="#0b2233" opacity=".8"/></g>
      <g fill="#24435a"><rect x="0" y="250" width="90" height="70"/><rect x="100" y="230" width="70" height="90"/><rect x="980" y="240" width="90" height="80"/><rect x="1080" y="220" width="120" height="100"/></g>
      <g fill="#ffd27a" opacity=".8"><rect x="115" y="250" width="8" height="8"/><rect x="140" y="270" width="8" height="8"/><rect x="1000" y="260" width="8" height="8"/><rect x="1110" y="240" width="8" height="8"/><rect x="1150" y="270" width="8" height="8"/></g>
      <rect x="0" y="320" width="1200" height="180" fill="#e8dccb"/>
      <rect x="0" y="312" width="1200" height="10" fill="#cdbca5"/>
      <rect x="380" y="360" width="520" height="110" rx="12" fill="url(#pl)"/>
      <path d="M410 392 q20 -8 40 0 t40 0 M560 420 q20 -8 40 0 t40 0 M720 395 q20 -8 40 0 t40 0" stroke="#e6fbff" stroke-width="3" fill="none" opacity=".7"/>
      <g fill="#fff"><rect x="120" y="400" width="150" height="16" rx="6"/><rect x="250" y="384" width="24" height="32" rx="6" transform="rotate(-20 262 400)"/><rect x="960" y="400" width="150" height="16" rx="6"/></g>

function quote(){const r=S.room?room(S.room):null;const n=nights();const tot=r&&n?r.price*n*rcount():0;return{tot,dep:Math.round(tot*DEP*100)/100}}
function renderSum(){const r=S.room?room(S.room):null;const q=quote();
 let h=`<h3>${t('sumT')}</h3><div class="ln"><span>${t('sDates')}</span><b>${S.cin?fD(S.cin):t('none')}${S.cout?' → '+fD(S.cout):''}</b></div><div class="ln"><span>${t('sG')}</span><b>${pl(S.g,T[lang].pW)}</b></div><div class="ln"><span>${t('sRoom')}</span><b>${r?rname(r.id,S.g):t('none')}</b></div><div class="ln"><span>${t('sTours')}</span><b>${S.tours.length?S.tours.map(x=>TOURS.find(y=>y.id===x).ic).join(' '):'—'}</b></div>`;
 if(q.tot)h+=`<div class="hr"></div><div class="ln"><span>${t('lnR',{n:nights(),p:money(r.price)})}${rcount()>1?' × '+rcount():''}</span><b>${money(q.tot)}</b></div>${S.tours.length?`<div class="ln"><span>${t('lnT')}</span><b>—</b></div>`:''}<div class="ln big"><span>${t('total')}</span><span>${money(q.tot)}</span></div><div class="dep"><div class="ln"><span>${t('deposit')}</span><span>${money(q.dep)}</span></div><div class="ln s"><span>${t('balance')}</span><span>${money(q.tot-q.dep)}</span></div></div><p class="note">${t('inc')}</p>`;
 $('sum').innerHTML=h}
function renderAll(){renderStatic();renderBody();renderSum();renderAdmin()}
function go(n){S.step=n;renderBody();renderSum();const b=$('book');if(b.getBoundingClientRect().top<0)b.scrollIntoView({behavior:'smooth'})}
function fill(){Object.assign(S,{name:'Lucía Fernández',country:lang==='es'?'España':'Spain',wa:'+34 612 345 678',email:'lucia.f@example.com'});renderBody()}
function submit(){if(!S.name.trim()||!S.wa.trim()){$('err').textContent=t('errF');return}const b=$('payB');b.textContent=t('processing');b.disabled=true;
 setTimeout(()=>{const q=quote();S.newB={name:S.name,country:S.country||'—',room:S.room,cin:S.cin,cout:S.cout,g:S.g,tours:S.tours.slice(),tot:q.tot,dep:q.dep};S.done=true;S.tab='g';$('bdg').hidden=false;renderAll();$('book').scrollIntoView({behavior:'smooth'})},900)}
let TOK=0;
const fmtW=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*(.+?)\*/g,'<b>$1</b>');
const now=()=>new Date().toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
const tl=B=>B.tours.map(x=>t('t_'+x)).join(', ');
function gM(B){const f=B.name.split(' ')[0];const n=t('nights',{n:Math.round((B.cout-B.cin)/864e5)});return [{sep:t('d0')},{biz:1,txt:t('w0',{first:f,room:rname(B.room,B.g),in:fD(B.cin),out:fD(B.cout),n,g:pl(B.g,T[lang].pW),dep:money(B.dep),bal:money(B.tot-B.dep),tours:B.tours.length?t('w0t',{list:tl(B)}):''})},{usr:1,txt:t('u0')},{sep:t('d1')},{biz:1,txt:t('w1',{first:f})}]}
function hM(B){const n=t('nights',{n:Math.round((B.cout-B.cin)/864e5)});return [{sep:t('d0')},{biz:1,act:1,txt:t('wh',{name:B.name,country:B.country,room:rname(B.room,B.g),in:fD(B.cin),out:fD(B.cout),n,g:pl(B.g,T[lang].pW),dep:money(B.dep),tours:B.tours.length?t('whT',{list:tl(B)}):''})}]}
function phone(id,title){return `<div class="phone"><div class="wah"><span class="av"><svg viewBox="0 0 38 38" width="28" height="28"><path d="M3 20 Q12 10 19 18 Q26 10 35 20 Q26 15 19 22 Q12 15 3 20Z" fill="#0b3954"/></svg></span><span><b>${title}</b><small>${t('wa')}</small></span></div><div class="chat" id="${id}"></div><div class="wafoot">✓✓</div></div>`}
async function play(id,list){const tok=++TOK;const box=$(id);if(!box)return;box.innerHTML='';
 for(const m of list){if(tok!==TOK)return;if(m.sep){const d=document.createElement('div');d.className='dsep';d.textContent=m.sep;box.appendChild(d);continue}
  if(m.biz){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';box.appendChild(ty);await new Promise(r=>setTimeout(r,700));if(tok!==TOK)return;ty.remove()}else await new Promise(r=>setTimeout(r,500));
  if(tok!==TOK)return;const e=document.createElement('div');e.className='msg '+(m.biz?'biz':'usr');e.innerHTML=fmtW(m.txt)+(m.act?`<div class="act"><span>✅ ${t('actA')}</span><span>📍 ${t('actB')}</span><span>💬 ${t('actC')}</span></div>`:'')+`<span class="tm">${now()}${m.biz?' ✓✓':''}</span>`;box.appendChild(e)}}
function renderDone(){$('body').innerHTML=`<div class="center"><h2 class="t">${t('done')}</h2><p class="sub">${t('doneS')}</p></div><div class="tabs"><button class="${S.tab==='g'?'on':''}" onclick="S.tab='g';renderDone()">📱 ${t('tg')}</button><button class="${S.tab==='h'?'on':''}" onclick="S.tab='h';renderDone()">🏨 ${t('th')}</button></div>${phone('ch',S.tab==='g'?'Hotel Albatross':'Hotel Albatross · Web')}`;play('ch',S.tab==='g'?gM(S.newB):hM(S.newB))}
const D=k=>new Date(+TODAY+k*864e5);
const SAMPLES=[{name:'Mark & Anna B.',country:'Alemania|Germany',room:'dk',u:'201',cin:D(1),cout:D(4),g:2,tours:['to','lu'],dep:207},{name:'Familia Andrade',country:'Ecuador|Ecuador',room:'tw',u:'203',cin:D(2),cout:D(5),g:4,tours:['tx'],dep:432},{name:'Chloé R.',country:'Francia|France',room:'dk',u:'301',cin:D(3),cout:D(6),g:2,tours:[],dep:207},{name:'Kenji T.',country:'Japón|Japan',room:'tw',u:'302',cin:D(5),cout:D(8),g:2,tours:['to','bk'],dep:216}];
function renderAdmin(){const A=SAMPLES.map(x=>({...x,country:x.country.split('|')[lang==='es'?0:1]}));if(S.newB)A.unshift({...S.newB,nw:true});
 const tq=A.reduce((s,b)=>s+b.tours.length,0);const dep=A.reduce((s,b)=>s+b.dep,0);
 let cells=0,used=0;
 let og=`<span></span>${Array.from({length:10},(_,k)=>`<span class="h">${D(k+1).getDate()}</span>`).join('')}`;
 if(S.newB&&!S.newB.u){const fr=UNITS.find(([u,ty])=>ty===S.newB.room&&!SAMPLES.some(x=>x.u===u&&x.cin<S.newB.cout&&S.newB.cin<x.cout));S.newB.u=fr?fr[0]:UNITS.find(x=>x[1]===S.newB.room)[0];A[0].u=S.newB.u}
 UNITS.forEach(([u,ty],ui)=>{og+=`<span class="rn">${t('hab')} ${u} · ${ty==='dk'?'King':'Twin'}</span>`;for(let k=1;k<=10;k++){const d=D(k);cells++;const b=A.find(x=>x.u===u&&d>=x.cin&&d<x.cout);const fake=!b&&((k*3+ui*5)%7===0);if(b||fake)used++;og+=`<i class="${b?(b.nw?'n':'b'):fake?'b':''}"></i>`}});
 $('og').innerHTML=og;
 $('kpis').innerHTML=`<div class="kpi"><small>${t('kR')}</small><b>${A.length+6}</b>${S.newB?`<em>${t('kNew',{n:1})}</em>`:''}</div><div class="kpi"><small>${t('kT')}</small><b>${tq}</b></div><div class="kpi"><small>${t('kD')}</small><b>${money(dep)}</b></div><div class="kpi hl"><small>${t('kO')}</small><b>${Math.round(used/cells*100)} %</b></div>`;
 $('bks').innerHTML=A.map(b=>`<div class="bk ${b.nw?'nw':''}"><span class="d"><b>${b.cin.getDate()}</b><small>${b.cin.toLocaleDateString(loc(),{month:'short'}).replace('.','')}</small></span><span class="m"><b>${b.name}<span class="tg2 ${b.nw?'n':''}">${b.nw?t('nw'):t('ex')}</span>${b.tours.length?`<span class="tg2 t">➕ ${b.tours.length} ${b.tours.length===1?t('tour1'):t('tours')}</span>`:''}</b><small>${rname(b.room,b.g)} · ${t('nights',{n:Math.round((b.cout-b.cin)/864e5)})} · ${b.country}</small>${b.tours.length?`<small>${b.tours.map(x=>TOURS.find(y=>y.id===x).ic+' '+t('t_'+x)).join(' · ')}</small>`:''}</span></div>`).join('')}
function view(v){$('vC').hidden=v!=='c';$('vA').hidden=v!=='a';$('tC').className=v==='c'?'on':'';$('tA').className=v==='a'?'on':'';if(v==='a'){$('bdg').hidden=true;renderAdmin()}scrollTo({top:0,behavior:'smooth'})}
function toggleLang(){lang=lang==='es'?'en':'es';renderAll()}
renderAll();
</script>
</body>
</html>
