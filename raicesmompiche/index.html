<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Raíces Mompiche · Reserva directa (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17302c;--muted:#5f736e;--line:#e6e2d6;--bg:#faf6ec;--card:#fff;--sea:#127a7a;--sea2:#1fa3a0;--leaf:#4f8a3c;--sand:#e9d7b0;--coral:#ee7b5a;--sun:#f4b740;--ok:#1e9a5b;--danger:#d64545;--r:22px;--sh:0 14px 36px -18px rgba(18,122,122,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:40px;overflow-x:hidden}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#0f2b28;color:#cfe8e3;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--sun);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(250,246,236,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:20px;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{position:relative;display:flex;background:#efe9da;border-radius:999px;padding:3px}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--sea)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 10px}.lang{padding:7px 9px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:420px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:#127a7a}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,43,40,0) 35%,rgba(15,43,40,.85) 100%)}
.hero .in{position:relative;z-index:2;padding:26px 22px 24px;width:100%}
.motto{font-family:"DM Serif Display",serif;font-style:italic;font-size:17px;color:#ffe3a6}
.hero h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(38px,8vw,66px);line-height:1;margin:8px 0 10px;max-width:760px}
.hero p{max-width:560px;opacity:.93;font-size:15px}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(10,40,40,.55)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.heroRow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--sun),var(--coral));color:#2b1200;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;transition:.2s;text-decoration:none;box-shadow:0 10px 22px -8px rgba(238,123,90,.7)}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,#0f5e5c,var(--sea2));color:#fff;box-shadow:0 10px 22px -10px rgba(18,122,122,.8)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.rate{font-size:13px;opacity:.95}.rate b{font-size:15px}
.sway{animation:sw 5s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes sw{to{transform:rotate(2deg)}}
.ripple{animation:rp 6s linear infinite}@keyframes rp{to{transform:translateX(-120px)}}
/* save band */
.save{margin-top:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.save div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;gap:11px;align-items:center;font-size:13px}
.save i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:#e8f5f3;display:grid;place-items:center;flex:none}
.save b{display:block;font-size:14px}.save small{color:var(--muted)}
/* rooms */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sh h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(28px,4.6vw,38px)}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{background:#fff;border:2px solid transparent;border-radius:22px;overflow:hidden;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;transition:.2s;width:100%}
.rc:hover{transform:translateY(-3px)}
.rc.on{border-color:var(--sea2)}
.rc .art{height:150px;position:relative}.rc .art svg{display:block;width:100%;height:100%}
.rc .ph{position:absolute;left:10px;bottom:10px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.rc .tg{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--sun);color:#2b1200;text-transform:uppercase}
.rc .bd{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.rc h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:21px;line-height:1.1}
.rc p{color:var(--muted);font-size:13px;flex:1}
.rc .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);font-weight:600}
.rc .ft{display:flex;align-items:end;justify-content:space-between;margin-top:6px}
.rc .pr b{font-size:22px;font-weight:800}.rc .pr small{color:var(--muted);font-size:12px;margin-left:3px}.rc .pr em{display:block;font-style:normal;font-size:10.5px;color:var(--coral);font-weight:700}
.rc .sel{font-size:13px;font-weight:800;color:var(--sea);padding:8px 12px;border-radius:12px;background:#e8f5f3}
.rc.on .sel{background:var(--sea);color:#fff}
/* booking */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:16px}
.grid>*,.two>*,.details>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.stp .bar{height:5px;border-radius:5px;background:#efe9da;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--sea2));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--sea)}
h2.t{font-family:"DM Serif Display",serif;font-weight:400;font-size:26px;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.picked{display:flex;gap:12px;align-items:center;background:#e8f5f3;border-radius:16px;padding:12px;margin-bottom:14px}
.picked .ic{width:44px;height:44px;border-radius:13px;background:var(--sea);display:grid;place-items:center;font-size:22px;flex:none}
.picked b{display:block;font-size:14.5px}.picked small{color:var(--muted);font-size:12.5px}
.picked button{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sea);text-decoration:underline}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal .head b{font-size:15px}
.nav{width:36px;height:36px;border-radius:12px;background:#efe9da;font-size:18px;font-weight:700}
.nav[disabled]{opacity:.3;pointer-events:none}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px;font-weight:600}
.day{aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#eef6f3;color:#0f5e5c;transition:.12s}
.day.full,.day.off{background:#f1eee6;color:#b9b5aa;text-decoration:line-through;pointer-events:none}
.day.off{background:transparent;text-decoration:none}
.day.in{background:#bfe6df;border-radius:6px}
.day.s,.day.e{background:linear-gradient(135deg,#0f5e5c,var(--sea2));color:#fff;border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.range{display:flex;align-items:center;gap:10px;background:#f5f0e3;border-radius:16px;padding:12px 14px;font-size:13px}
.range b{display:block;font-size:14px}.range small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:15px}.row small{color:var(--muted);font-size:12.5px}
.ctr{display:flex;align-items:center;gap:12px}
.ctr button{width:38px;height:38px;border-radius:12px;background:#efe9da;font-size:20px;font-weight:700}
.ctr button[disabled]{opacity:.35;pointer-events:none}
.ctr span{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fdfbf6;font-size:15px;outline:0}
.fld input:focus{border-color:var(--sea2);background:#fff;box-shadow:0 0 0 4px rgba(31,163,160,.12)}
.fld.err input{border-color:var(--danger)}.fld .em{color:var(--danger);font-size:12px;margin-top:4px}
.tog{display:flex;background:#efe9da;border-radius:14px;padding:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tog button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.link{color:var(--sea);font-size:13px;font-weight:700;text-decoration:underline;margin:2px 0 12px;display:inline-block}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}.actions .btn.sec{flex:0 0 auto}
.mock{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0f5e5c,#1fa3a0 60%,#4f8a3c);margin:12px 0}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:18px;letter-spacing:1.5px;margin-top:10px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sum h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:22px;margin-bottom:10px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.sum .ln b{color:var(--ink);text-align:right}
.sum .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.sum .tot .ln.big{font-size:15px;color:var(--ink);font-weight:800}
.sum .dep{background:#e8f5f3;border-radius:14px;padding:12px;margin-top:10px}.sum .dep .ln{color:#0f5e5c;font-weight:800;font-size:15px}.sum .dep .ln.s{color:var(--muted);font-weight:600;font-size:13px}
.sum .pol{font-size:12px;color:var(--muted);margin-top:10px}
.sum .vs{background:#fff4ec;border-radius:12px;padding:10px;margin-top:10px;font-size:12.5px;color:#a2482b}
.okmark{width:72px;height:72px;margin:0 auto 8px;display:block}
.okmark circle{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .7s .1s forwards}.okmark path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.center{text-align:center}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:999px;background:#efe9da;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#0f5e5c;color:#fff}
.phone{background:#e6ddcf;border-radius:24px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#0f2b28;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--leaf),var(--sea2));display:grid;place-items:center;font-family:"DM Serif Display",serif;font-size:18px}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.75;font-size:11.5px}
.chat{padding:12px;min-height:280px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.85);color:#5f736e;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase}
.msg{max-width:86%;padding:8px 11px 6px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg.loc{padding:4px;width:250px}.msg.loc .map{height:105px;border-radius:10px;overflow:hidden}
.msg.loc .cap{padding:6px 7px 2px;font-size:13px}.msg.loc .cap b{display:block}.msg.loc .cap small{color:#6b7a75}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px}
.details{display:grid;gap:16px;margin-top:16px}@media(min-width:760px){.details{grid-template-columns:1fr 1fr}}
.details h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:22px;margin-bottom:10px}
.ck{list-style:none}.ck li{font-size:13.5px;padding:4px 0 4px 24px;position:relative}.ck li:before{content:"🌿";position:absolute;left:0;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px}.kv span{color:var(--muted)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:26px;font-weight:800;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,#0f5e5c,#1fa3a0);color:#fff;border:0}.kpi.hl small{color:#cfeee9}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.two{grid-template-columns:1.3fr 1fr;align-items:start}}
h3.sec{font-size:16px;margin:2px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}h3.sec small{font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.occ{overflow-x:auto}
.occ table{border-collapse:separate;border-spacing:3px;font-size:11px;min-width:520px}
.occ th{color:var(--muted);font-weight:700;padding:2px;text-align:center}
.occ td.n{font-weight:700;font-size:12px;white-space:nowrap;padding-right:6px;color:var(--ink)}
.occ td.c{width:30px;height:26px;border-radius:7px;background:#f1eee6}
.occ td.c.b{background:#9bd6cd}.occ td.c.bn{background:var(--coral)}.occ td.c.bk{background:#c9c1f0}
.bk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);margin-bottom:9px;width:100%;text-align:left;background:#fff}
.bk.new{background:#fff4ec;border-color:var(--coral);animation:glow 1.6s 2}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(238,123,90,.2)}}
.bk .av2{width:44px;height:44px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;background:linear-gradient(135deg,#0f5e5c,var(--sea2));line-height:1}
.bk .av2 b{font-size:16px}.bk .av2 small{font-size:9px;color:#cfeee9;text-transform:uppercase;margin-top:2px}
.bk .m{flex:1;min-width:0}.bk .nm{font-size:14px;font-weight:700;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bk small{color:var(--muted);font-size:12px}
.bk .am{text-align:right;font-size:13px}.bk .am b{display:block}
.tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.tag.ex{background:#efe9da;color:#7d776a}.tag.nw{background:var(--ok);color:#fff}.tag.bkg{background:#e7e3fb;color:#4b3fa6}
.sync{background:#f5f0e3;border-radius:14px;padding:12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(10,30,28,.55);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;animation:up .3s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;background:#efe9da;font-size:16px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 14px 8px;max-width:760px;margin:0 auto}
</style>
</head>
<body>
<div class="demobar"><span class="dot"></span><span data-i="demobar"></span></div>

    `<rect x="40" y="40" width="240" height="90" rx="10" fill="#fff" opacity=".85"/><rect x="55" y="78" width="150" height="38" rx="8" fill="#e9d7b0"/><rect x="55" y="66" width="150" height="16" rx="6" fill="#fff" stroke="#c99a5b"/><circle cx="245" cy="70" r="22" fill="#4f8a3c"/><g fill="#f4b740"><ellipse cx="238" cy="78" rx="5" ry="7"/><ellipse cx="254" cy="68" rx="5" ry="7"/></g><rect x="242" y="88" width="6" height="34" fill="#6b4a22"/>`,
    `<rect x="30" y="35" width="260" height="100" rx="10" fill="#fff" opacity=".9"/><rect x="45" y="78" width="140" height="42" rx="8" fill="#ee7b5a" opacity=".85"/><rect x="45" y="66" width="140" height="16" rx="6" fill="#fff" stroke="#c99a5b"/><rect x="205" y="60" width="70" height="60" rx="6" fill="#e9d7b0"/><circle cx="225" cy="80" r="6" fill="#9c7238"/><circle cx="250" cy="80" r="6" fill="#9c7238"/><path d="M60 50 q10-12 22 0 q10-12 22 0" stroke="#e2457a" stroke-width="4" fill="none"/>`][i];
  return `<svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ra${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient></defs><rect width="320" height="150" fill="url(#ra${i})"/>${inner}</svg>`;
}

/* ===== VISTAS ===== */
function applyI18n(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#lES').className=S.lang==='es'?'on':'';$('#lEN').className=S.lang==='en'?'on':'';
  $('#eco').innerHTML=t('eco').map(x=>`<li>${esc(x)}</li>`).join('');
  $('#kv').innerHTML=t('kv').map(x=>`<span>${esc(x[0])}</span><b>${esc(x[1])}</b>`).join('');
  renderRooms();
}
function setView(v){S.view=v;$('#vClient').hidden=v!=='client';$('#vAdmin').hidden=v!=='admin';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='admin'){S.newCount=0;renderAdmin()}updateBadge();window.scrollTo({top:0,behavior:'smooth'})}
function updateBadge(){const b=$('#badge');b.hidden=!S.newCount||S.view==='admin';b.textContent=S.newCount}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#langBtn').onclick=()=>{S.lang=S.lang==='es'?'en':'es';applyI18n();renderClient();if(S.view==='admin')renderAdmin()};

function renderRooms(){
  $('#roomList').innerHTML=R.map(r=>`<button class="rc ${S.room===r.id?'on':''}" onclick="pickRoom('${r.id}')"><div class="art">${art(r.art)}${r.star?`<span class="tg">★ ${t('star')}</span>`:''}<span class="ph">📷 ${t('phL')}</span></div><div class="bd"><h3>${r.ic} ${t('n_'+r.id)}</h3><p>${t('d_'+r.id)}</p><div class="meta"><span>👥 ${t('capL',{n:r.cap})}</span><span>📐 ${r.m2} m²</span><span>🚿 ${r.bath==='pv'?t('pvBath'):t('shBath')}</span></div><div class="ft"><div class="pr"><b>$${r.price}</b><small>${t('pn')}</small><em>${r.id==='r1'?t('from'):t('exP')}</em></div><span class="sel">${S.room===r.id?t('chosen'):t('choose')}</span></div></div></button>`).join('');
}
function pickRoom(id){S.room=id;S.done=null;if(S.ci&&S.co&&!rangeFree(id,S.ci,S.co)){S.ci=S.co=null}S.ppl=Math.min(S.ppl,RM(id).cap);S.step=1;renderRooms();renderClient();setTimeout(()=>document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'}),50)}

/* ===== RESERVA ===== */
function renderClient(){
  if(S.done){$('#stepper').innerHTML='';renderDone($('#stepBody'))}
  else{$('#stepper').innerHTML=[1,2,3,4].map(i=>`<div class="stp ${S.step===i?'on':''} ${S.step>i?'done':''}"><div class="bar"><i></i></div>${i}. ${t('st'+i)}</div>`).join('');
    $('#stepBody').innerHTML=!S.room?`<h2 class="t">${t('pick')}</h2><div class="actions"><a class="btn pri" href="#rooms">${t('cta')}</a></div>`:[null,s1,s2,s3,s4][S.step]()}
  renderSummary();
}
const pickedBox=()=>{const r=RM(S.room);return `<div class="picked"><span class="ic">${r.ic}</span><div><b>${t('n_'+r.id)}</b><small>$${r.price} ${t('pn')} · ${t('capL',{n:r.cap})}</small></div><button onclick="document.getElementById('rooms').scrollIntoView({behavior:'smooth'})">${t('change')}</button></div>`};
function s1(){
  if(!S.month)S.month=new Date(addD(d0,1).getFullYear(),addD(d0,1).getMonth(),1);
  const m=S.month,first=new Date(m.getFullYear(),m.getMonth(),1),off=(first.getDay()+6)%7,nd=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),mon=new Date(2024,0,1);
  const dow=[...Array(7)].map((_,i)=>`<div>${cap(new Intl.DateTimeFormat(loc(),{weekday:'short'}).format(addD(mon,i)))}</div>`).join('');
  let c='';for(let i=0;i<off;i++)c+='<div></div>';
  for(let d=1;d<=nd;d++){const dt=new Date(m.getFullYear(),m.getMonth(),d),k=key(dt);
    if(dt<=d0||dt>maxD){c+=`<div class="day off">${d}</div>`;continue}
    const isS=k===S.ci,isE=k===S.co,inR=S.ci&&S.co&&k>S.ci&&k<S.co;
    const full=booked(S.room,k)&&!(S.ci&&!S.co&&k>S.ci&&rangeFree(S.room,S.ci,k));
    c+=`<button class="day ${full&&!isE?'full':''} ${isS?'s':''} ${isE?'e':''} ${inR?'in':''}" onclick="tapDay('${k}')">${d}</button>`}
  const prevOff=m<=new Date(d0.getFullYear(),d0.getMonth(),1),nextOff=m>=new Date(maxD.getFullYear(),maxD.getMonth(),1);
  const rg=S.ci?`<div class="range"><div style="flex:1"><small>${t('arr')}</small><b>${dShort(S.ci)}</b></div><span>→</span><div style="flex:1"><small>${t('dep')}</small><b>${S.co?dShort(S.co):'—'}</b></div>${S.co?`<b>${t('nights',{n:nightsOf(S.ci,S.co)})}</b>`:''}</div>${S.co?`<p class="hint">🕐 ${t('chk')}</p>`:`<p class="hint">👉 ${t('tapOut')}</p>`}`:'';
  return `${pickedBox()}<h2 class="t">${t('dT')}</h2><p class="sub">${t('dS')}</p>
  <div class="cal"><div class="head"><button class="nav" ${prevOff?'disabled':''} onclick="mv(-1)">‹</button><b>${cap(new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(m))}</b><button class="nav" ${nextOff?'disabled':''} onclick="mv(1)">›</button></div><div class="dow">${dow}</div><div class="days">${c}</div></div>
  <div class="legend"><span><i style="background:#eef6f3;border:1px solid #cfe5df"></i>${t('lgOk')}</span><span><i style="background:#f1eee6"></i>${t('lgFull')}</span></div>${rg}
  <div class="actions"><button class="btn pri" ${S.ci&&S.co?'':'disabled'} onclick="go(2)">${t('next')} →</button></div>`;
}
function tapDay(k){
  if(!S.ci||S.co||k<=S.ci){if(booked(S.room,k))return;S.ci=k;S.co=null}
  else{if(rangeFree(S.room,S.ci,k))S.co=k;else{S.ci=booked(S.room,k)?null:k;S.co=null}}
  renderClient();
}
function s2(){const r=RM(S.room);
  return `${pickedBox()}<h2 class="t">${t('gT')}</h2><p class="sub">${dShort(S.ci)} → ${dShort(S.co)} · ${t('nights',{n:nightsOf(S.ci,S.co)})}</p>
  <div class="row" style="border:0"><div><b>${t('ppl')}</b><small>${t('capL',{n:r.cap})}</small></div><div class="ctr"><button ${S.ppl<=1?'disabled':''} onclick="S.ppl--;renderClient()">−</button><span>${S.ppl}</span><button ${S.ppl>=r.cap?'disabled':''} onclick="S.ppl++;renderClient()">+</button></div></div>
  <p class="hint">👶 ${t('kids')}</p>
  <div class="actions"><button class="btn sec" onclick="go(1)">←</button><button class="btn pri" onclick="go(3)">${t('next')} →</button></div>`}
function s3(){if(!S.clang)S.clang=S.lang;
  const f=(id,label,type,ph)=>`<div class="fld ${S.errs[id]?'err':''}"><label>${label}</label><input type="${type}" value="${esc(S[id])}" placeholder="${ph}" oninput="S.${id}=this.value">${S.errs[id]?`<div class="em">${S.errs[id]}</div>`:''}</div>`;
  return `<h2 class="t">${t('yT')}</h2><p class="sub">${t('yS')}</p><button class="link" onclick="S.name='Daniela Mora (ejemplo)';S.phone='+593 99 123 4567';S.email='daniela.ejemplo@correo.com';S.errs={};renderClient()">${t('autofill')}</button>
  ${f('name',t('name'),'text','')}${f('phone',t('phone'),'tel','+593 99 123 4567')}${f('email',t('email'),'email','')}
  <div class="fld"><label>${t('confLang')}</label><div class="tog"><button class="${S.clang==='es'?'on':''}" onclick="S.clang='es';renderClient()">Español</button><button class="${S.clang==='en'?'on':''}" onclick="S.clang='en';renderClient()">English</button></div></div>
  <div class="actions"><button class="btn sec" onclick="go(2)">←</button><button class="btn pri" onclick="val()">${t('next')} →</button></div>`}
function s4(){const c=calc();
  return `<h2 class="t">${t('payT')}</h2><p class="sub">${t('payS')}</p>
  <div class="tog"><button class="${S.pay==='transfer'?'on':''}" onclick="S.pay='transfer';renderClient()">🏦 ${t('transfer')}</button><button class="${S.pay==='paypal'?'on':''}" onclick="S.pay='paypal';renderClient()">🅿️ ${t('paypal')}</button></div>
  <div class="mock"><small>${S.pay==='paypal'?'PayPal':t('transfer')} · demo</small><b>${S.pay==='paypal'?'huesped@email.com':'Raíces Mompiche · •••• 2569'}</b></div><p class="note">🔒 ${t('simNote')}</p>
  <div class="actions"><button class="btn sec" onclick="go(3)" ${S.paying?'disabled':''}>←</button><button class="btn pri" onclick="doPay()" ${S.paying?'disabled':''}>${S.paying?`<span class="spin"></span> ${t('processing')}`:t('pay',{a:money(c.dep)})}</button></div>`}
function calc(){if(!S.room||!S.ci||!S.co)return{n:0,total:0,dep:0,bal:0};const n=nightsOf(S.ci,S.co),total=RM(S.room).price*n;return{n,total,dep:total*DEP,bal:total*(1-DEP)}}
function renderSummary(){const c=calc(),r=S.room&&RM(S.room);
  $('#summary').innerHTML=`<h3>${t('sumT')}</h3><div class="ln"><span>${t('sRoom')}</span><b>${r?t('n_'+r.id):t('none')}</b></div><div class="ln"><span>${t('sDates')}</span><b>${S.ci&&S.co?dShort(S.ci)+' → '+dShort(S.co):t('none')}</b></div><div class="ln"><span>${t('sPpl')}</span><b>${pW(S.ppl)}</b></div>
  <div class="tot">${c.n?`<div class="ln"><span>$${r.price} × ${t('nights',{n:c.n})}</span><b>${money(c.total)}</b></div>`:''}<div class="ln big"><span>${t('total')}</span><span>${money(c.total)}</span></div></div>
  <div class="dep"><div class="ln"><span>${t('deposit')}</span><span>${money(c.dep)}</span></div><div class="ln s"><span>${t('balance')}</span><span>${money(c.bal)}</span></div></div>
  ${c.n?`<div class="vs">💡 ${t('vs',{c:money(c.total*BKG)})}</div>`:''}<p class="pol">✓ ${t('pol')}</p>`}
function mv(d){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+d,1);renderClient()}
function go(n){S.step=n;renderClient();document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'})}
function val(){S.errs={};if(S.name.trim().length<2)S.errs.name=t('errName');if(S.phone.replace(/\D/g,'').length<7)S.errs.phone=t('errPhone');if(Object.keys(S.errs).length)return renderClient();go(4)}
function doPay(){S.paying=true;renderClient();setTimeout(()=>{const c=calc();
  const b={id:100+B.length,code:'RM-'+(500+Math.floor(Math.random()*499)),room:S.room,ci:S.ci,co:S.co,ppl:S.ppl,name:S.name.trim(),lang:S.clang||S.lang,src:'dir',total:c.total,dep:c.dep,bal:c.bal,example:false,isNew:true,bookedAt:key(d0)};
  B.unshift(b);S.done=b;S.paying=false;S.newCount++;updateBadge();renderClient();document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'})},1500)}
function reset(){Object.assign(S,{step:1,ci:null,co:null,ppl:2,name:'',phone:'',email:'',clang:null,done:null,errs:{},month:null});renderClient();document.getElementById('rooms').scrollIntoView({behavior:'smooth'})}
function renderDone(el){const b=S.done;
  el.innerHTML=`<div class="center"><svg class="okmark" viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="35" stroke="#1e9a5b" stroke-width="6"/><path d="M24 41l12 12 21-24" stroke="#1e9a5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 class="t">${t('done')}</h2><p class="sub">${b.code} · ${t('doneS')}</p></div><div id="msgMount"></div>
  <div class="actions" style="flex-wrap:wrap"><button class="btn sec" onclick="reset()">${t('another')}</button><button class="btn pri" onclick="setView('admin')">${t('seeAdmin')}</button></div>`;
  msgView(b,$('#msgMount'))}

/* ===== WHATSAPP ===== */
let TOK=0;
function msgView(b,mount,stage=0){
  mount.innerHTML=`<div class="tabs"><button class="${stage===0?'on':''}" data-s="0">💬 ${t('j0')}</button><button class="${stage===1?'on':''}" data-s="1">🗺️ ${t('j1')}</button></div><div class="mv"></div>`;
  mount.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>msgView(b,mount,+x.dataset.s));
  chat(mount.querySelector('.mv'),b,stage)}
const wa=s=>esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function chat(mv,b,stage){
  const L=b.lang,tok=++TOK,v={first:b.name.split(/[\s(&]/)[0],room:tr(L,'n_'+b.room),in:dShort(b.ci,L),out:dShort(b.co,L),n:tr(L,'nights',{n:nightsOf(b.ci,b.co)}),ppl:pW(b.ppl,L),dep:money(b.dep),bal:money(b.bal)};
  const msgs=stage===0?[['sep',dShort(b.bookedAt,L)],['biz',tr(L,'w0',v),'20:14'],['usr',tr(L,'u0',v),'20:20']]:[['sep',dShort(key(addD(parse(b.ci),-1)),L)],['biz',tr(L,'w1',v),'17:00'],['loc','','17:00'],['usr',tr(L,'u1',v),'17:12'],['biz',tr(L,'b1',v),'17:13']];
  mv.innerHTML=`<div class="phone"><div class="wah"><div class="av">R</div><div><b>Raíces Mompiche</b><small>${tr(L,'wahSub')}</small></div></div><div class="chat"></div><div class="wafoot">${tr(L,'wafoot')}</div></div>`;
  const body=mv.querySelector('.chat');let i=0;
  const add=m=>{const d=document.createElement('div');
    if(m[0]==='sep'){d.className='dsep';d.textContent=m[1]}
    else if(m[0]==='loc'){d.className='msg biz loc';d.innerHTML=`<div class="map"><svg viewBox="0 0 250 105" width="100%" height="100%"><rect width="250" height="105" fill="#e6efe2"/><path d="M-10 70 C50 55 90 85 150 65 S220 50 260 60 V105 H-10Z" fill="#9fd8d2"/><path d="M180 0 L250 0 L250 105 L200 105 C210 70 190 30 180 0Z" fill="#7cc6c9"/><g fill="#4f8a3c"><circle cx="40" cy="62" r="6"/><circle cx="70" cy="66" r="5"/><circle cx="110" cy="58" r="6"/></g><path d="M20 30 H170" stroke="#fff" stroke-width="5"/><path d="M95 10c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12z" fill="#ee7b5a"/><circle cx="95" cy="22" r="4" fill="#fff"/></svg></div><div class="cap"><b>📍 ${esc(tr(L,'locT'))}</b><small>${esc(tr(L,'locS'))}</small></div><span class="tm">${m[2]}</span>`}
    else{d.className='msg '+m[0];d.innerHTML=wa(m[1])+`<span class="tm">${m[2]}${m[0]==='usr'?' ✓✓':''}</span>`}
    body.appendChild(d)};
  const next=()=>{if(tok!==TOK||i>=msgs.length)return;const m=msgs[i];
    if(m[0]==='sep'){add(m);i++;return setTimeout(next,200)}
    if(m[0]!=='usr'){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';body.appendChild(ty);setTimeout(()=>{if(tok!==TOK)return;ty.remove();add(m);i++;setTimeout(next,400)},700)}
    else setTimeout(()=>{if(tok!==TOK)return;add(m);i++;setTimeout(next,300)},600)};
  next()}

/* ===== PANEL ===== */
function renderAdmin(){
  const dir=B.filter(b=>b.src==='dir'),nw=B.filter(b=>b.isNew).length,days=[...Array(14)].map((_,i)=>key(addD(d0,i+1)));
  let occN=0;const cells=R.map(r=>days.map(k=>{const b=B.find(x=>x.room===r.id&&k>=x.ci&&k<x.co);if(b)occN++;return b}));
  $('#kpis').innerHTML=[['kRes',dir.length,nw?t('kNew',{n:nw}):'',''],['kDep',money(dir.reduce((a,b)=>a+b.dep,0)),'',''],['kOcc',Math.round(occN/(R.length*14)*100)+'%','',''],['kSave',money(dir.reduce((a,b)=>a+b.total,0)*BKG),'','hl']].map(k=>`<div class="kpi ${k[3]}"><small>${t(k[0])}</small><b>${k[1]}</b><em>${k[2]}</em></div>`).join('');
  $('#occ').innerHTML=`<table><tr><th></th>${days.map(k=>`<th>${parse(k).getDate()}</th>`).join('')}</tr>${R.map((r,ri)=>`<tr><td class="n">${r.ic} ${t('n_'+r.id).replace(/Habitación |room/gi,'').trim()}</td>${cells[ri].map(b=>`<td class="c ${b?(b.isNew?'bn':b.src==='bkg'?'bk':'b'):''}" title="${b?esc(b.name):''}"></td>`).join('')}</tr>`).join('')}</table>`;
  $('#bkList').innerHTML=[...B].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)||a.ci.localeCompare(b.ci)).map(b=>`<button class="bk ${b.isNew?'new':''}" onclick="openBk(${b.id})"><div class="av2"><b>${nightsOf(b.ci,b.co)}</b><small>${S.lang==='es'?'noches':'nights'}</small></div><div class="m"><div class="nm">${esc(b.name)}${b.src==='bkg'?`<span class="tag bkg">${t('bkg')}</span>`:''}${b.example?`<span class="tag ex">${t('ex')}</span>`:''}${b.isNew?`<span class="tag nw">${t('nw')}</span>`:''}</div><small>${RM(b.room).ic} ${t('n_'+b.room)} · ${dShort(b.ci)} → ${dShort(b.co)}</small></div><div class="am"><b>${money(b.total)}</b><small>${b.src==='dir'?money(b.dep):''}</small></div></button>`).join('');
}
function openBk(id){const b=B.find(x=>x.id===id);if(!b)return;
  $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><h3 style="font-size:18px">${esc(b.name)} <span style="color:var(--muted);font-size:13px">${b.code}</span></h3><p class="sub" style="margin:4px 0 8px">${t('n_'+b.room)} · ${dShort(b.ci)} → ${dShort(b.co)}</p><div id="mm"></div></div></div>`;
  if(b.src==='bkg'){$('#mm').innerHTML=`<p class="sub">Booking.com — ${S.lang==='es'?'reserva sincronizada (ejemplo)':'synced booking (sample)'}</p>`;return}
  msgView(b,$('#mm'))}
function closeM(){TOK++;$('#modal').innerHTML=''}

applyI18n();renderClient();
</script>
</body>
