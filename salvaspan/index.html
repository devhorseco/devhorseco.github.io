<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>El Salvador Spanish Schools · Santa Ana (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2430;--muted:#687385;--line:#e5e2da;--bg:#faf7f0;--card:#fff;--blue:#1d4ea8;--blue2:#3a6fd8;--coffee:#7a4a2b;--leaf:#2f8a57;--sun:#f2b33d;--ok:#2e8b57;--danger:#c0392b;--r:22px;--sh:0 16px 34px -20px rgba(40,50,80,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:30px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#13213f;color:#d9e3f7;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--sun);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(250,247,240,.9);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-family:Fraunces,serif;font-weight:800;font-size:17px;line-height:1.05}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{display:flex;background:#ece8de;border-radius:999px;padding:3px}
.seg button{position:relative;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--blue)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:8px 9px}.lang{padding:7px 8px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:430px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:#2b5a86}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
@media(max-width:700px){.bld{display:none}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,35,0) 25%,rgba(12,20,35,.85) 100%)}
.hero .in{position:relative;z-index:2;padding:56px 22px 24px;width:100%}
.phl{position:absolute;top:14px;right:14px;z-index:3;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--muted);text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#ffd98a}
.hero h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(34px,7vw,58px);line-height:1.02;margin:8px 0 10px;max-width:760px}
.hero p{max-width:580px;font-size:15px;opacity:.95}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(5,10,20,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--sun),#f7c868);color:#3a2800;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;transition:.2s;text-decoration:none;box-shadow:0 10px 22px -8px rgba(242,179,61,.7)}
.btn:hover{transform:translateY(-2px)}
.btn.bl{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 10px 22px -10px rgba(29,78,168,.8)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.facts{margin-top:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.facts div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;gap:11px;align-items:center;font-size:13px}
.facts i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:#eef3fc;display:grid;place-items:center;flex:none}
.facts b{display:block;font-size:14px}.facts small{color:var(--muted)}
/* flow */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px;flex-wrap:wrap}
.sh h2{font-family:Fraunces,serif;font-weight:800;font-size:clamp(26px,4.4vw,34px);line-height:1.05}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.two>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.stp .bar{height:5px;border-radius:5px;background:#eee9df;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sun));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--blue)}
h2.t{font-family:Fraunces,serif;font-weight:800;font-size:25px;line-height:1.1;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px}
.qbar{height:6px;border-radius:5px;background:#eee9df;overflow:hidden;margin-bottom:14px}.qbar i{display:block;height:100%;background:var(--blue2);transition:.3s}
.q{font-size:19px;font-weight:700;margin-bottom:4px;line-height:1.35}
.q em{font-style:normal;background:#fff1cc;border-radius:6px;padding:0 6px}
.qh{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ans{display:grid;gap:8px}
.an{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff;text-align:left;font-size:15px;font-weight:600;transition:.15s;width:100%}
.an:hover{border-color:#c7d4ee}
.an i{font-style:normal;width:26px;height:26px;border-radius:8px;background:#f2efe7;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.an.ok{border-color:var(--ok);background:#effaf3}.an.ok i{background:var(--ok);color:#fff}
.an.no{border-color:var(--danger);background:#fdf0ee}.an.no i{background:var(--danger);color:#fff}
.skip{font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:underline;margin-top:12px}
.lvl{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#eef3fc,#fff8e6);border-radius:18px;padding:16px;margin:4px 0 12px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-size:28px;color:var(--blue)}
.lvl h3{font-family:Fraunces,serif;font-size:22px;line-height:1.1}
.lvl p{font-size:13px;color:var(--muted);margin-top:3px}
.scale{display:flex;gap:4px;margin-top:8px}
.scale span{flex:1;text-align:center;font-size:11px;font-weight:800;padding:4px 0;border-radius:6px;background:#eee9df;color:var(--muted)}
.scale span.on{background:var(--blue);color:#fff}
.lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:16px 0 8px}
.opts{display:grid;gap:9px;grid-template-columns:minmax(0,1fr)}
@media(min-width:560px){.opts.two2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.op{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:16px;padding:13px;background:#fff;text-align:left;width:100%}
.op.on{border-color:var(--blue);background:#f3f7ff}
.op b{font-size:15px}.op small{color:var(--muted);font-size:12.5px}
.op .pr{font-weight:800;color:var(--blue);font-size:14px;margin-top:4px}
.mons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
@media(min-width:560px){.mons{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mo{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 6px;text-align:center;line-height:1.15}
.mo small{display:block;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase}
.mo b{font-size:15px}
.mo i{display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--leaf);margin-top:2px}
.mo.on{border-color:var(--blue);background:var(--blue);color:#fff}.mo.on small,.mo.on i{color:#dfe8fb}
.mo.x{opacity:.4;pointer-events:none}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.cnt b{display:block;font-size:14.5px}.cnt small{color:var(--muted);font-size:12px}
.stepr{display:flex;align-items:center;gap:10px}
.stepr button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;font-weight:700;background:#fff}
.stepr button[disabled]{opacity:.3}
.stepr span{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 13px;font-size:13.5px;font-weight:700;text-align:left}
.pill small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.pill.on{border-color:var(--blue);background:#f3f7ff;color:var(--blue)}.pill.on small{color:var(--blue)}
.sw{display:flex;align-items:center;gap:12px;padding:11px 0;text-align:left;width:100%}
.sw .tg{width:44px;height:26px;border-radius:999px;background:#d8d3c8;position:relative;flex:none;transition:.2s}
.sw .tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on .tg{background:var(--leaf)}.sw.on .tg:after{left:21px}
.sw b{display:block;font-size:14px}.sw small{color:var(--muted);font-size:12px}
.hs{display:flex;gap:12px;align-items:center;background:#f7f3ea;border-radius:16px;padding:12px;margin-top:8px}
.hs svg{width:70px;height:56px;flex:none;border-radius:10px}
.hs b{display:block;font-size:14px}.hs small{color:var(--muted);font-size:12.5px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;width:100%}
.fld input:focus{outline:none;border-color:var(--blue2)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.lnk{font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:underline;margin-bottom:10px}
.mock{border-radius:16px;padding:14px;color:#fff;background:linear-gradient(135deg,#13213f,var(--blue2));margin:6px 0}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:16px;letter-spacing:1.5px;margin-top:6px}
.err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:16px;margin-top:4px}
.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.center{text-align:center}
/* summary */
.sum h3{font-family:Fraunces,serif;font-weight:800;font-size:22px;margin-bottom:8px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.ln b{color:var(--ink);text-align:right}
.hr{border-top:1px dashed var(--line);margin:8px 0}
.ln.big{font-size:16px;color:var(--ink);font-weight:800}
.dep{background:#eef3fc;border-radius:14px;padding:11px 12px;margin-top:8px}.dep .ln{color:var(--blue);font-weight:800}.dep .ln.s{color:var(--muted);font-weight:600}
.ref{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:#e5f4ea;color:var(--leaf);text-transform:uppercase;margin-left:4px;vertical-align:1px}
.exl{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:#fff1d6;color:#9a6a00;text-transform:uppercase;margin-left:4px;vertical-align:1px}
/* chat */
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap;justify-content:center}
.tabs button{padding:9px 13px;border-radius:999px;background:#ece8de;font-size:12.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff}
.phone{background:#e6ddcf;border-radius:22px;overflow:hidden;border:1px solid var(--line);max-width:430px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#075e54;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.8;font-size:11.5px}
.chat{padding:12px;min-height:280px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.88);color:#667;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase}
.msg{max-width:88%;padding:8px 11px 6px;border-radius:14px;font-size:13.4px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;white-space:pre-wrap;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;white-space:normal}
.msg .act span{font-size:12px;font-weight:700;color:#0a7cff;background:#f2f7ff;border-radius:8px;padding:5px 9px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:25px;font-weight:800;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border:0}.kpi.hl small{color:#dfe8fb}
.ad2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.ad2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.card h3.s{font-family:Fraunces,serif;font-weight:800;font-size:20px}
.card .s2{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.st{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.st.nw{background:#fff8e6;border-color:#f2d389;box-shadow:0 0 0 3px #fcedc6}
.st .lv{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.st .m{flex:1;min-width:0}.st .m b{font-size:14px}.st .m small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-left:5px;vertical-align:1px;background:#efebe2;color:#7d776a}
.tag.n{background:var(--sun);color:#3a2800}
.fam{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fam:last-child{border-bottom:0}
.fam b{display:block;font-size:13.5px}.fam small{color:var(--muted);font-size:11.5px}
.fam .bd{margin-left:auto;display:flex;gap:3px}
.fam .bd i{width:14px;height:14px;border-radius:4px;background:#e8e3d8}.fam .bd i.f{background:var(--leaf)}.fam .bd i.n{background:var(--sun)}
.lvbars{display:grid;gap:8px;margin-top:4px}
.lb{display:grid;grid-template-columns:96px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12.5px}
.lb .tr{height:10px;border-radius:6px;background:#eee9df;overflow:hidden}.lb .tr i{display:block;height:100%;border-radius:6px}
.lb b{text-align:right}
.ov{position:fixed;inset:0;background:rgba(12,20,35,.55);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px;animation:up .3s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-weight:800}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 14px 8px;max-width:800px;margin:0 auto}
</style>
</head>
<body>
<div class="demobar"><span class="dot"></span><span data-t="demobar"></span></div>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="12" fill="#1d4ea8"/><path d="M6 28 L15 15 L19 20 L24 12 L32 28Z" fill="#7fb0ff"/><circle cx="27" cy="10" r="3" fill="#f2b33d"/><path d="M9 31 H29" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="19" y="27" text-anchor="middle" font-family="Fraunces,serif" font-weight="800" font-size="9" fill="#fff">ñ</text></svg>
    <div><b>El Salvador Spanish Schools</b><small data-t="brandsub"></small></div>
  </div>
  <div class="seg"><button id="tC" class="on" onclick="view('c')" data-t="tabC"></button><button id="tA" onclick="view('a')"><span data-t="tabA"></span><i class="badge" id="bdg" hidden>1</i></button></div>
  <button class="lang" onclick="toggleLang()"><span id="lEn" class="on">EN</span> · <span id="lEs">ES</span></button>

  h=`<h2 class="t">${t('hT')}</h2><p class="sub">${t('hS')}</p>
  <button class="sw ${S.hs?'on':''}" onclick="S.hs=!S.hs;renderAll()"><span class="tg"></span><span><b>${t('hsOn')}</b><small>${t('hsOnS')} · ${money(PR.hs)} ${t('pw')} <span class="exl">${t('exL')}</span></small></span></button>
  ${S.hs?`<div class="lab">${t('mealsL')}</div><div class="pills">${[0,1,2,3].map(m=>`<button class="pill ${S.meals===m?'on':''}" onclick="S.meals=${m};renderAll()">${T[lang].mealsS[m]}<small>${m?'+'+money(PR.meal[m])+' '+t('pw'):'—'}</small></button>`).join('')}</div>
  <button class="sw ${S.veg?'on':''}" onclick="S.veg=!S.veg;renderAll()"><span class="tg"></span><span><b>🌱 ${t('veg')}</b><small>${t('vegS')}</small></span></button>
  <div class="hs"><svg viewBox="0 0 70 56"><rect width="70" height="56" fill="#f2e3c4"/><rect x="12" y="24" width="46" height="28" fill="#fff"/><path d="M8 26 L35 8 L62 26Z" fill="#b8573a"/><rect x="31" y="36" width="9" height="16" fill="#7a4a2b"/><rect x="17" y="30" width="9" height="8" fill="#9cc3e6"/><rect x="45" y="30" width="9" height="8" fill="#9cc3e6"/></svg><span><b>${t('fam')}</b><small>${t('famS')}</small></span></div>`:''}
  <div class="nav"><button class="btn ghost" onclick="go(3)">←</button><button class="btn bl" onclick="go(5)">${t('next')} →</button></div>`;
 }
 if(S.step===5){const q=quote();
  h=`<h2 class="t">${t('yT')}</h2><p class="sub">${t('yS')}</p><button class="lnk" onclick="fill()">${t('autofill')}</button>
  <div class="two"><div class="fld"><label>${t('name')}</label><input value="${S.name}" oninput="S.name=this.value"></div><div class="fld"><label>${t('country')}</label><input value="${S.country}" oninput="S.country=this.value"></div></div>
  <div class="two"><div class="fld"><label>${t('phone')}</label><input inputmode="tel" value="${S.wa}" oninput="S.wa=this.value"></div><div class="fld"><label>${t('email')}</label><input value="${S.email}" oninput="S.email=this.value"></div></div>
  <div class="mock"><small>${t('cardL')}</small><b>4242 4242 4242 4242</b><small>12/29 · CVC 123</small></div>
  <div class="err" id="err"></div>
  <button class="btn bl" style="width:100%" id="payB" onclick="submit()">🔒 ${t('pay',{a:money(q.dep)})}</button>
  <p class="note center">${t('sim')}</p><div class="nav"><button class="btn ghost" onclick="go(4)">← ${t('back')}</button></div>`;
 }
 $('body').innerHTML=h;
}
function answer(i){if(S.picked!==null)return;S.picked=i;S.ans[S.qi]=i===Q[S.qi].a;renderBody();
 setTimeout(()=>{S.picked=null;if(S.qi<Q.length-1){S.qi++}else{S.lvl=levelFrom();S.step=2}renderAll()},650)}
function skipTest(){S.ans=[];S.lvl=0;S.step=2;renderAll()}
function retake(){Object.assign(S,{qi:0,ans:[],picked:null,lvl:null,step:1});renderAll()}
function quote(){const w=S.weeks;const cp=S.type==='grp'?PR.grp:PR.one;const L=[[t('lnCl',{w,p:money(cp)}),cp*w]];
 if(S.hs){const hp=PR.hs+PR.meal[S.meals];L.push([t('lnHs',{w,p:money(hp)}),hp*w])}
 L.push([t('lnFee'),PR.fee]);const tot=L.reduce((a,x)=>a+x[1],0);
 const dep=PR.fee+cp+(S.hs?PR.hs+PR.meal[S.meals]:0);return{L,tot,dep}}
function renderSum(){
 let h=`<h3>${t('sumT')}</h3>
 <div class="ln"><span>${t('sLvl')}</span><b>${S.lvl!==null?LV[S.lvl].id+' · '+T[lang].res[LV[S.lvl].id][0]:t('none')}</b></div>
 <div class="ln"><span>${t('sType')}</span><b>${S.step>=3?(S.type==='grp'?t('grp'):t('one')):t('none')}</b></div>
 <div class="ln"><span>${t('sStart')}</span><b>${S.start?fL(S.start):t('none')}</b></div>
 <div class="ln"><span>${t('sWeeks')}</span><b>${S.step>=3?S.weeks:t('none')}</b></div>
 <div class="ln"><span>${t('sHs')}</span><b>${S.step>=4?(S.hs?t('yes')+(S.meals?' · '+T[lang].mealsS[S.meals].toLowerCase():'')+(S.veg?' · 🌱':''):t('no')):t('none')}</b></div>`;
 if(S.step>=3){const q=quote();h+=`<div class="hr"></div>`+q.L.map(([a,b])=>`<div class="ln"><span>${a}</span><b>${money(b)}</b></div>`).join('')+`<div class="ln big"><span>${t('total')}</span><span>${money(q.tot)}</span></div><div class="dep"><div class="ln"><span>${t('dep')}</span><span>${money(q.dep)}</span></div><div class="ln s"><span>${t('bal')}</span><span>${money(q.tot-q.dep)}</span></div></div>`}
 $('sum').innerHTML=h;
}
function renderAll(){renderStatic();renderBody();renderSum();renderAdmin()}
function go(n){S.step=n;renderBody();renderSum();const b=$('test');if(b.getBoundingClientRect().top<0)b.scrollIntoView({behavior:'smooth'})}
function fill(){Object.assign(S,{name:'Megan Walsh',country:lang==='es'?'Estados Unidos':'United States',wa:'+1 512 555 0142',email:'megan.w@example.com'});renderBody()}
function submit(){if(!S.name.trim()||!S.wa.trim()){$('err').textContent=t('errF');return}
 const b=$('payB');b.textContent=t('processing');b.disabled=true;
 setTimeout(()=>{const q=quote();S.newS={name:S.name,country:S.country||'—',lvl:S.lvl,score:S.ans.length?S.ans.filter(Boolean).length+'/'+Q.length:'—',start:S.start,weeks:S.weeks,type:S.type,hs:S.hs,meals:S.meals,veg:S.veg,dep:q.dep,tot:q.tot,fam:'Familia Martínez Rivas'};S.done=true;S.tab='g';$('bdg').hidden=false;renderAll();$('test').scrollIntoView({behavior:'smooth'})},900)}
/* chat */
let TOK=0;
const fmtW=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*(.+?)\*/g,'<b>$1</b>');
const now=()=>new Date().toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
function hsTxt(n){return n.hs?(lang==='es'?'Homestay':'Homestay')+(n.meals?' · '+T[lang].mealsS[n.meals].toLowerCase():'')+(n.veg?' · 🌱':''):(lang==='es'?'Sin homestay':'No homestay')}
function gMsgs(n){const f=n.name.split(' ')[0];const L=[{sep:t('d0')},{biz:1,txt:t('w0',{first:f,lvl:LV[n.lvl].id,lname:T[lang].res[LV[n.lvl].id][0],start:fL(n.start),weeks:pl(n.weeks,'wk'),type:n.type==='grp'?t('grp'):t('one'),hs:hsTxt(n),dep:money(n.dep)})},{usr:1,txt:t('u0')},{sep:t('d1')},{biz:1,txt:n.hs?t('w1',{first:f,fam:lang==='es'?'familia Martínez Rivas':'Martínez Rivas family'}):t('w1n',{first:f})},{sep:t('d2')},{biz:1,txt:t('w2',{first:f})}];return L}
function hMsgs(n){return [{sep:t('d0')},{biz:1,act:1,txt:t('wh',{name:n.name,country:n.country,lvl:LV[n.lvl].id,score:n.score,start:fL(n.start),weeks:pl(n.weeks,'wk'),type:n.type==='grp'?t('grp'):t('one'),hs:hsTxt(n),dep:money(n.dep)})}]}
function phone(id,title){return `<div class="phone"><div class="wah"><span class="av"><svg viewBox="0 0 38 38" width="28" height="28"><path d="M6 28 L15 15 L19 20 L24 12 L32 28Z" fill="#1d4ea8"/><circle cx="27" cy="10" r="3" fill="#f2b33d"/></svg></span><span><b>${title}</b><small>${t('wa')}</small></span></div><div class="chat" id="${id}"></div><div class="wafoot">✓✓</div></div>`}
async function play(id,list){const tok=++TOK;const box=$(id);if(!box)return;box.innerHTML='';
 for(const m of list){if(tok!==TOK)return;
  if(m.sep){const d=document.createElement('div');d.className='dsep';d.textContent=m.sep;box.appendChild(d);continue}
  if(m.biz){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';box.appendChild(ty);await new Promise(r=>setTimeout(r,700));if(tok!==TOK)return;ty.remove()}else await new Promise(r=>setTimeout(r,500));
  if(tok!==TOK)return;const e=document.createElement('div');e.className='msg '+(m.biz?'biz':'usr');e.innerHTML=fmtW(m.txt)+(m.act?`<div class="act"><span>👩‍🏫 ${t('actA')}</span><span>🏡 ${t('actB')}</span><span>💬 ${t('actC')}</span></div>`:'')+`<span class="tm">${now()}${m.biz?' ✓✓':''}</span>`;box.appendChild(e)}}
function renderDone(){const n=S.newS;
 $('body').innerHTML=`<div class="center"><h2 class="t">${t('done')}</h2><p class="sub">${t('doneS')}</p></div><div class="tabs"><button class="${S.tab==='g'?'on':''}" onclick="S.tab='g';renderDone()">📱 ${t('tg')}</button><button class="${S.tab==='h'?'on':''}" onclick="S.tab='h';renderDone()">🏫 ${t('th')}</button></div>${phone('ch',S.tab==='g'?'El Salvador Spanish Schools':'SalvaSpan · Web')}`;
 play('ch',S.tab==='g'?gMsgs(n):hMsgs(n))}
/* admin */
const M=mondays();
const SAMPLES=[
 {name:'Jake & Olivia T.',country:'USA',lvl:1,score:'3/8',start:M[0],weeks:3,type:'grp',hs:true,meals:2,dep:310,fam:'Familia Rivas'},
 {name:'Sarah K.',country:'Canada',lvl:2,score:'5/8',start:M[0],weeks:2,type:'one',hs:true,meals:3,dep:370,fam:'Familia Martínez Rivas'},
 {name:'Daniel M.',country:'USA',lvl:0,score:'—',start:M[1],weeks:4,type:'grp',hs:false,meals:0,dep:175},
 {name:'Emily R.',country:'USA',lvl:3,score:'7/8',start:M[2],weeks:2,type:'one',hs:true,meals:1,dep:340,fam:'Familia Guevara'},
 {name:'Thomas B.',country:'Germany',lvl:1,score:'2/8',start:M[3],weeks:6,type:'grp',hs:true,meals:2,dep:315,fam:'Familia Rivas'}
];
function renderAdmin(){
 const A=SAMPLES.slice();if(S.newS)A.unshift({...S.newS,nw:true});
 $('kpis').innerHTML=`<div class="kpi"><small>${t('kS')}</small><b>${A.length}</b>${S.newS?`<em>${t('kNew',{n:1})}</em>`:''}</div><div class="kpi"><small>${t('kH')}</small><b>${A.filter(x=>x.hs).length}</b></div><div class="kpi"><small>${t('kD')}</small><b>${money(A.reduce((s,x)=>s+x.dep,0))}</b></div><div class="kpi hl"><small>${t('kT')}</small><b>${23+(S.newS?1:0)}</b></div>`;
 $('studs').innerHTML=A.sort((a,b)=>(b.nw?1:0)-(a.nw?1:0)||a.start-b.start).map(x=>`<div class="st ${x.nw?'nw':''}"><span class="lv" style="background:${LV[x.lvl].c}">${LV[x.lvl].id}</span><span class="m"><b>${x.name}</b><span class="tag ${x.nw?'n':''}">${x.nw?t('nw'):t('ex')}</span><small>${lang==='es'?'Lun':'Mon'} ${fD(x.start)} · ${pl(x.weeks,'wk')} · ${x.type==='grp'?'👥 '+t('grp'):'👤 '+t('one')}</small><small>${x.hs?'🏡 '+(x.fam||''):'—'} · ${lang==='es'?'prueba':'test'} ${x.score} · ${x.country}</small></span></div>`).join('');
 const cnt=[0,0,0,0,0];A.forEach(x=>cnt[x.lvl]++);const base=[3,6,5,2,1];const tot=cnt.map((c,i)=>c+base[i]);const mx=Math.max(...tot);
 $('lvb').innerHTML=LV.map((L,i)=>`<div class="lb"><span>${L.id} · ${T[lang].res[L.id][0]}</span><span class="tr"><i style="width:${tot[i]/mx*100}%;background:${L.c}"></i></span><b>${tot[i]}</b></div>`).join('');
 const F=[['Familia Rivas',2],['Familia Martínez Rivas',2],['Familia Guevara',1],['Familia Pacas',2]];
 $('fams').innerHTML=F.map(([n,r])=>{const used=A.filter(x=>x.hs&&x.fam===n&&!x.nw).length;const nw=S.newS&&S.newS.hs&&S.newS.fam===n?1:0;return `<div class="fam"><span>🏡</span><span><b>${n} <span class="tag">${t('ex')}</span></b><small>${r} ${lang==='es'?(r>1?'habitaciones':'habitación'):(r>1?'rooms':'room')}</small></span><span class="bd">${Array.from({length:r},(_,i)=>`<i class="${i<used?'f':i<used+nw?'n':''}"></i>`).join('')}</span></div>`}).join('');
}
function view(v){$('vC').hidden=v!=='c';$('vA').hidden=v!=='a';$('tC').className=v==='c'?'on':'';$('tA').className=v==='a'?'on':'';if(v==='a'){$('bdg').hidden=true;renderAdmin()}scrollTo({top:0,behavior:'smooth'})}
function toggleLang(){lang=lang==='en'?'es':'en';renderAll()}
renderAll();
</script>
