<head>

<title>Inkarri Regocijo · Asistente de WhatsApp (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b211c;--muted:#76675d;--line:#ebe2d8;--bg:#f7f2ec;--card:#fff;--wine:#7a2e2a;--wine2:#a3453b;--gold:#c9973f;--stone:#8a7a6b;--wa:#075e54;--wa2:#25d366;--ok:#2e8b57;--danger:#c0392b;--r:22px;--sh:0 16px 36px -20px rgba(90,40,30,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:30px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#2b211c;color:#eee0d2;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(247,242,236,.9);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:21px;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{display:flex;background:#ece3d9;border-radius:999px;padding:3px}
.seg button{position:relative;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--wine)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:8px 10px}.lang{padding:7px 9px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* intro */
.intro{margin:18px 0 6px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:900px){.intro{grid-template-columns:minmax(0,1fr) 420px}}
.intro>*{min-width:0}
.eyebrow{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--wine)}
h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(38px,7.4vw,58px);line-height:1;margin:12px 0 10px}
h1 em{font-style:normal;color:var(--wine)}
.lead{font-size:15px;color:#5a4a40;max-width:560px}
.rule{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:12px 14px;margin:16px 0;font-size:13.5px}
.rule b{display:block}
.how{display:grid;gap:10px;margin-top:6px}
.how div{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.how i{font-style:normal;width:34px;height:34px;border-radius:11px;background:#f4e7dc;display:grid;place-items:center;font-weight:800;color:var(--wine);flex:none}
.how b{display:block;font-size:14px}.how small{color:var(--muted);font-size:12.8px}
.try{font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.tries{display:flex;flex-wrap:wrap;gap:7px}
.tries button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.tries button:hover{border-color:var(--wine2);color:var(--wine)}
/* phone */
.phone{background:#e9e1d6;border-radius:30px;padding:10px;box-shadow:0 30px 60px -28px rgba(60,30,20,.55);position:relative}
@media(min-width:900px){.phone{position:sticky;top:76px}}
.scr{background:#efe7dd;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:min(680px,calc(100vh - 120px));min-height:520px}
.wah{background:var(--wa);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 12px}
.wah .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.wah b{display:block;font-size:14.5px;line-height:1.2}.wah small{font-size:11.5px;opacity:.85}
.wah .vf{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--wa2);color:#fff;font-size:9px;text-align:center;line-height:14px;margin-left:4px;vertical-align:1px}
.ms{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.9);color:#667;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase}
.bm{max-width:86%;padding:7px 10px 5px;border-radius:12px;font-size:13.6px;white-space:pre-wrap;animation:pp .2s;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word}
@keyframes pp{from{opacity:0;transform:translateY(6px)}}
.bm.bot{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.bm.me{align-self:flex-end;background:#d9fdd3;border-top-right-radius:3px}
.bm.adv{align-self:flex-start;background:#fff8e6;border-top-left-radius:3px;border:1px solid #f1d9a2}
.bm .who{display:block;font-size:11.5px;font-weight:800;color:var(--wine);margin-bottom:2px}
.bm .who.a{color:#9a6a00}
.bm .tm{display:block;text-align:right;font-size:10px;color:#8a979c;margin-top:1px}
.bm .card{margin-top:7px;background:#f6efe6;border-radius:10px;padding:9px;font-size:12.8px;white-space:normal}
.bm .card .tt{font-weight:800;color:var(--wine);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.bm .card .r{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0}.bm .card .r span{color:var(--muted)}
.bm .rm{display:block;margin-top:7px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);white-space:normal}
.bm .rm svg{display:block;width:100%;height:90px}
.bm .rm span{display:block;padding:6px 9px;font-size:12.5px}
.bm .rm span b{display:block}
.hand{align-self:center;background:#fff3d6;color:#7a5600;border:1px solid #f1d9a2;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;text-align:center;max-width:92%}
.typ{align-self:flex-start;background:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:4px}
.typ i{width:6px;height:6px;border-radius:50%;background:#9aa59f;animation:ty 1s infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-3px);opacity:.4}}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px 0}
.qr button{border:1px solid #cfe3dc;color:#0a7c6a;background:#fff;border-radius:999px;padding:6px 10px;font-size:12.6px;font-weight:700;animation:pp .2s}
.inp{display:flex;gap:8px;padding:8px 10px 10px}
.inp input{flex:1;min-width:0;border:0;border-radius:999px;padding:11px 14px;background:#fff}
.inp input:focus{outline:2px solid #bfe9d9}
.inp button{width:44px;height:44px;border-radius:50%;background:#00a884;color:#fff;font-size:17px;flex:none}
.pw{font-size:10.5px;color:var(--muted);text-align:center;padding:6px 0 0}
/* needs */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sh h2{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(28px,4.6vw,38px);line-height:1}
.sh p{color:var(--muted);font-size:13.5px;max-width:540px}
.needs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.need{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.need i{font-style:normal;font-size:22px}
.need b{display:block;font-size:14.5px;margin:6px 0 2px}.need small{color:var(--muted);font-size:12.8px}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-top:10px}
.stp{background:linear-gradient(135deg,#fff,#fbf4ec);border:1px solid var(--line);border-radius:18px;padding:14px}
.stp b{display:block;font-size:13px;color:var(--wine);text-transform:uppercase;letter-spacing:.5px}
.stp span{font-size:13.5px}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:25px;font-weight:800;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;border:0}.kpi.hl small{color:#f3d9d2}
.ad2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.ad2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.card2{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card2 h3{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:24px}
.card2 .sub{color:var(--muted);font-size:12.8px;margin:2px 0 10px}
.lead2{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.lead2.nw{background:#fff8e6;border-color:#f1d9a2;box-shadow:0 0 0 3px #fbedc9}
.lead2 .fl{font-size:22px;width:40px;height:40px;border-radius:12px;background:#f4e7dc;display:grid;place-items:center;flex:none}
.lead2 .m{flex:1;min-width:0}.lead2 .m b{font-size:14px}.lead2 .m small{display:block;color:var(--muted);font-size:12px}
.st{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;margin-top:3px;background:#fdf0d5;color:#9a6a00}
.st.ok{background:#e3f3e9;color:var(--ok)}
.tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-left:5px;vertical-align:1px;background:#efe7de;color:#857565}
.tag.n{background:var(--wine);color:#fff}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;border-radius:6px;background:#efe7de;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--wine),var(--gold))}
.bar b{text-align:right}
.ov{position:fixed;inset:0;background:rgba(30,15,10,.55);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px;animation:up .3s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-weight:800}
.ficha{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;font-size:13px}
.ficha .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.ficha .r span{color:var(--muted)}
.conv{background:#efe7dd;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--wine),var(--wine2));color:#fff;font-weight:800;padding:13px 20px;border-radius:14px;font-size:14.5px;width:100%;margin-top:12px}
.btn[disabled]{opacity:.55}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 14px 8px;max-width:760px;margin:0 auto}
</style>
</head>

let busy=Promise.resolve();

 $('ms').innerHTML=S.msgs.map(m=>m.hand?`<div class="hand">${m.hand}</div>`:`<div class="bm ${m.me?'me':m.adv?'adv':'bot'}">${m.adv?`<span class="who a">Milagros · ${S.cl==='en'?'Advisor':'Asesora'}</span>`:''}${fmt(m.txt)}${m.extra||''}<span class="tm">${m.t}${m.me?' ✓✓':''}</span></div>`).join('');

 $('ms').scrollTop=1e6;
}
function say(txt,qr,extra,adv,delay){S.qr=[];renderMsgs();busy=busy.then(()=>new Promise(res=>{const ty=document.createElement('div');ty.className='typ';ty.innerHTML='<i></i><i></i><i></i>';$('ms').appendChild(ty);$('ms').scrollTop=1e6;
 setTimeout(()=>{S.msgs.push({txt,extra,adv,t:now()});S.qr=qr||[];renderMsgs();res()},delay||Math.min(1200,450+txt.length*2.5))}))}
function sysm(h){busy=busy.then(()=>new Promise(res=>{setTimeout(()=>{S.msgs.push({hand:h});renderMsgs();res()},500)}))}
function me(txt){S.msgs.push({me:1,txt,t:now()});S.qr=[];renderMsgs()}
function tapQ(i){handle(S.qr[i])}
function send(e){e.preventDefault();const v=$('inp').value.trim();if(!v)return;$('inp').value='';handle(v)}
function handle(txt){
 if(!S.bk)S.cl=isEN(txt)?'en':(/[a-záéíóúñ¿¡]/i.test(txt)&&!isEN(txt)?'es':S.cl||lang);
 me(txt);const n=norm(txt.replace(/^[^\p{L}\p{N}]+/u,''));
 if(S.bk)return bookStep(txt,n);
 for(const [k,re] of INT){if(re.test(n)){
  if(k==='bk')return startBook(/king|matrimonial/.test(n)?'king':/standard/.test(n)&&!/habitaciones|rooms/.test(n)?'std':null);
  if(k==='rooms'){say(b('rooms'),null,roomCards());return say(b('roomsAfter'),b('moreQ'))}
  if(k==='hi')return say(b('hi'),b('q0'));
  return say(b(k),k==='thx'?[b('q0')[3]]:b('moreQ'));
 }}
 S.unq=(S.unq||[]).concat(txt);
 say(b('fb'),b('moreQ'));
}
function roomCards(){return ['std','king'].map(k=>`<span class="rm">${roomArt(k)}<span><b>${k==='king'?'👑 ':'🛏️ '}${b('r_'+k)}</b>${b('r_'+k+'s')} · <b style="display:inline">${S.cl==='en'?'from':'desde'} ${sol(ROOMS[k].price)}</b> <i style="font-size:10px;color:#9a6a00;font-style:normal;font-weight:800">${S.cl==='en'?'SAMPLE':'EJEMPLO'}</i></span></span>`).join('')}
function startBook(room){S.bk={step:room?1:0,room,lang:S.cl||lang};if(room)say(b('bk1'),b('bkq1'));else say(b('bk0'),b('bkq0'))}
function bookStep(raw,n){const k=S.bk;
 if(k.step===0){k.room=/king|matrimonial/.test(n)?'king':'std';k.step=1;return say(b('bk1'),b('bkq1'))}
 if(k.step===1){if(/otra|another/.test(n)){k.step=11;return say(b('bkpick'))}
  const d=new Date(2026,10,10);if(/manana|tomorrow/.test(n))d.setDate(d.getDate()+1);else if(/viernes|friday/.test(n))d.setDate(d.getDate()+((5-d.getDay()+7)%7||7));
  k.inD=/manana|tomorrow|viernes|friday/.test(n)?cap(d.toLocaleDateString(k.lang==='es'?'es-PE':'en-US',{weekday:'long',day:'numeric',month:'long'})):raw;k.step=2;return say(b('bk2'),b('bkq2'))}
 if(k.step===11){k.inD=raw;k.step=2;return say(b('bk2'),b('bkq2'))}
 if(k.step===2){const m=raw.match(/\d+/);k.n=m?Math.max(1,+m[0]):2;k.step=3;return say(b('bk3'),b('bkq3'))}
 if(k.step===3){const m=raw.match(/\d+/);k.g=m?Math.min(2,Math.max(1,+m[0])):2;k.step=4;return say(b('bk4'))}
 if(k.step===4){k.name=raw;const tot=sol(ROOMS[k.room].price*k.n);
  const card=`<div class="card"><div class="tt">${b('sumT')}</div><div class="r"><span>${b('lR')}</span><b>${b('r_'+k.room)}</b></div><div class="r"><span>${b('lIn')}</span><b>${k.inD}</b></div><div class="r"><span>${b('lN')}</span><b>${k.n}</b></div><div class="r"><span>${b('lG')}</span><b>${b('pax')(k.g)}</b></div><div class="r"><span>${b('lTot')}</span><b>${tot}</b></div></div>`;
  const first=k.name.split(' ')[0];const L=k.lang;
  S.newLead={name:k.name,room:k.room,inD:k.inD,n:k.n,g:k.g,tot,lang:L==='es'?'Español':'English',when:{es:'ahora',en:'just now'}};
  say(b('done').replace('{first}',first),null,card);
  sysm(b('hand'));
  say(B[L].adv1.replace('{first}',first).replace('{room}',B[L]['r_'+k.room]).replace('{in}',k.inD.toLowerCase()).replace('{tot}',tot),null,null,true,2200);
  busy.then(()=>{S.newLead.conv=S.msgs.slice();S.bk=null;$('bdg').hidden=false;renderPanel();S.qr=B[L].moreQ;renderMsgs()});
 }
}
