<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Chachapoyas Expedition · Asistente de viajes (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a24;--muted:#66736c;--line:#e3e2d8;--bg:#f5f3ec;--card:#fff;--forest:#1f4d3a;--forest2:#2e6b50;--stone:#a6683f;--stone2:#c98652;--gold:#d9a640;--mist:#e7efe9;--ok:#2e8b57;--danger:#c0392b;--r:22px;--sh:0 16px 36px -20px rgba(31,77,58,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
.demobar{background:#13281f;color:#d6e6dc;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(245,243,236,.9);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:Fraunces,serif;font-weight:700;font-size:18px;line-height:1.05;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{display:flex;background:#e8e6db;border-radius:999px;padding:3px}
.seg button{position:relative;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--forest)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 10px}.lang{padding:7px 9px}}
@media(max-width:420px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:440px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:var(--forest)}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,18,0) 25%,rgba(10,25,18,.85) 100%)}
.hero .in{position:relative;z-index:2;padding:56px 22px 24px;width:100%}
.phl{position:absolute;top:14px;right:14px;z-index:3;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#f3d38b}
.hero h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(34px,7.2vw,60px);line-height:1.03;margin:8px 0 10px;max-width:760px;letter-spacing:-.5px}
.hero p{max-width:560px;opacity:.95;font-size:15px}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(5,15,10,.55)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--stone),var(--stone2));color:#fff;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;transition:.2s;text-decoration:none;box-shadow:0 10px 22px -8px rgba(166,104,63,.7)}
.btn:hover{transform:translateY(-2px)}
.btn.gr{background:linear-gradient(135deg,var(--forest),var(--forest2));box-shadow:0 10px 22px -10px rgba(31,77,58,.8)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.fall{animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}
/* sections */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sh h2{font-family:Fraunces,serif;font-weight:700;font-size:clamp(26px,4.4vw,34px);letter-spacing:-.3px}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.tc{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left}
.tc .art{height:120px;position:relative}.tc .art svg{display:block;width:100%;height:100%}
.tc .ph{position:absolute;left:8px;bottom:8px;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--muted);text-transform:uppercase}
.tc .dur{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(19,40,31,.8);color:#fff}
.tc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.tc h3{font-family:Fraunces,serif;font-weight:700;font-size:18px;line-height:1.15}
.tc p{color:var(--muted);font-size:12.5px;flex:1}
.tc .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.tc .pr{font-size:12px;color:var(--muted)}.tc .pr b{font-size:17px;color:var(--ink)}
.tc .ask{font-size:12.5px;font-weight:800;color:var(--forest);background:var(--mist);border-radius:11px;padding:7px 10px}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.cats button.on{border-color:var(--forest);background:var(--mist);color:var(--forest)}
.contact{margin-top:22px;background:var(--forest);color:#e7f1ea;border-radius:24px;padding:20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));font-size:13.5px}
.contact b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
/* chat widget */
.fab{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:10px}
.fab .tease{background:#fff;border:1px solid var(--line);box-shadow:var(--sh);border-radius:16px 16px 4px 16px;padding:10px 12px;font-size:13px;max-width:230px;animation:pop .3s;cursor:pointer}
.fab .tease b{display:block}
.fab .ball{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--forest),var(--forest2));color:#fff;display:grid;place-items:center;box-shadow:0 12px 26px -8px rgba(31,77,58,.8);position:relative;flex:none}
.fab .ball:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--forest2);opacity:.5;animation:ring 2s infinite}
@keyframes ring{to{transform:scale(1.25);opacity:0}}
.cw{position:fixed;z-index:60;right:16px;bottom:16px;width:390px;max-width:calc(100vw - 32px);height:min(640px,calc(100vh - 32px));background:#fff;border-radius:24px;box-shadow:0 30px 60px -20px rgba(10,30,20,.5);display:flex;flex-direction:column;overflow:hidden;animation:up .25s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(max-width:520px){.cw{inset:0;right:0;bottom:0;width:100%;max-width:none;height:100%;border-radius:0}}
.cw .hd{background:linear-gradient(135deg,var(--forest),var(--forest2));color:#fff;padding:13px 14px;display:flex;gap:10px;align-items:center}
.cw .av{width:40px;height:40px;border-radius:50%;background:#f3d38b;display:grid;place-items:center;flex:none;position:relative}
.cw .av svg{width:26px;height:26px}
.cw .av:after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#4ade80;border:2px solid var(--forest)}
.cw .hd>span:nth-child(2){min-width:0}.cw .hd b{display:block;font-size:14.5px;line-height:1.2}.cw .hd small{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw .hd .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);font-weight:800}
.cw .ms{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:#f7f6f1}
.bm{max-width:86%;padding:9px 12px;border-radius:16px;font-size:13.8px;white-space:pre-wrap;animation:pop .2s;line-height:1.42}
.bm.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:5px}
.bm.me{align-self:flex-end;background:var(--forest);color:#fff;border-top-right-radius:5px}
.bm b{font-weight:700}
.bm .card{margin-top:8px;background:var(--mist);border-radius:12px;padding:10px;font-size:13px;white-space:normal}
.bm .card .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.bm .card .r span{color:var(--muted)}
.bm .card .tt{font-weight:800;color:var(--forest);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.typ{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 13px;display:flex;gap:4px}
.typ i{width:6px;height:6px;border-radius:50%;background:#9aa59f;animation:ty 1s infinite}
.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-3px);opacity:.4}}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#f7f6f1}
.qr button{border:1.5px solid var(--forest2);color:var(--forest);background:#fff;border-radius:999px;padding:7px 11px;font-size:12.8px;font-weight:700;animation:pop .2s}
.qr button:hover{background:var(--mist)}
.cw form{display:flex;gap:8px;padding:10px 12px 12px;background:#f7f6f1;border-top:1px solid transparent}
.cw form input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:11px 14px;background:#fff}
.cw form input:focus{outline:none;border-color:var(--forest2)}
.cw form button{width:44px;height:44px;border-radius:50%;background:var(--forest);color:#fff;font-size:17px;flex:none}
.cw .pw{font-size:10.5px;color:var(--muted);text-align:center;padding:0 0 8px;background:#f7f6f1}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,var(--forest),var(--forest2));color:#fff;border:0}.kpi.hl small{color:#cfe5d8}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.cardp{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:18px}
.cardp h3{font-family:Fraunces,serif;font-weight:700;font-size:21px}
.cardp .sub{color:var(--muted);font-size:13px;margin:2px 0 8px}
.lead{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:9px;background:#fff;text-align:left;width:100%}
.lead.nw{background:#fbf3ea;border-color:#e9b98f;box-shadow:0 0 0 3px #f7e3d1}
.lead .ic{width:44px;height:44px;border-radius:13px;background:var(--mist);display:grid;place-items:center;font-size:20px;flex:none}
.lead .mid{flex:1;min-width:0}.lead .mid b{font-size:14.5px}
.lead .mid small{display:block;color:var(--muted);font-size:12.5px}
.lead .rt{text-align:right;flex:none;font-size:12px;color:var(--muted)}.lead .rt b{display:block;font-size:15px;color:var(--ink)}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:#ebe9df;color:var(--muted);text-transform:uppercase;margin-left:6px;vertical-align:2px}
.tag.n{background:var(--stone);color:#fff}
.st{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;text-transform:uppercase;margin-top:4px;background:#fdf0d5;color:#9a6a00}
.st.ok{background:#e3f3e9;color:var(--ok)}
.bars{display:grid;gap:9px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;border-radius:6px;background:#eceae0;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--forest),var(--forest2))}
.bar b{text-align:right}
.unq{list-style:none;display:grid;gap:8px;margin-top:8px}
.unq li{display:flex;gap:9px;align-items:flex-start;font-size:13px;background:#faf7ef;border-radius:12px;padding:9px 11px}
.unq li button{margin-left:auto;font-size:12px;font-weight:800;color:var(--forest);flex:none}
.modal{position:fixed;inset:0;background:rgba(10,25,18,.55);z-index:70;display:grid;place-items:end center}
@media(min-width:640px){.modal{place-items:center;padding:20px}}
.modal .box{background:var(--bg);width:100%;max-width:470px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
@media(min-width:640px){.modal .box{border-radius:22px}}
.modal .x{float:right;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-weight:800}
.tabs2{display:flex;gap:6px;margin:10px 0}
.tabs2 button{flex:1;padding:9px;border-radius:12px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;background:#fff}
.tabs2 button.on{border-color:var(--forest);color:var(--forest);background:var(--mist)}
.tr2{background:#f7f6f1;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:7px;border:1px solid var(--line)}
.wa{background:#ece5dd;border-radius:16px;padding:10px;border:1px solid var(--line)}
.wa .b{background:#fff;border-radius:12px;border-top-left-radius:3px;padding:9px 11px;font-size:13px;white-space:pre-wrap;max-width:92%}
.wa .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.wa .act span{font-size:12px;font-weight:700;color:#0a7cff;background:#f2f7ff;border-radius:8px;padding:5px 9px}
footer{max-width:1100px;margin:30px auto 0;padding:0 18px 110px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="demobar"><span class="dot"></span><span data-t="demobar"></span></div>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#1f4d3a"/><path d="M8 28 L20 10 L32 28Z" fill="none" stroke="#f3d38b" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 28 L20 19 L26 28Z" fill="#c98652"/><path d="M8 31h24" stroke="#f3d38b" stroke-width="2" stroke-linecap="round"/></svg>
    <div><b>Chachapoyas Expedition</b><small data-t="brandsub"></small></div>
  </div>
  <div class="seg"><button id="tW" class="on" onclick="view('w')" data-t="tabW"></button><button id="tP" onclick="view('p')"><span data-t="tabP"></span><i class="badge" id="bdg" hidden>1</i></button></div>
  <button class="lang" onclick="toggleLang()"><span id="lEs" class="on">ES</span> · <span id="lEn">EN</span></button>
</header>

<main id="W">
  <section class="hero">
    <svg class="heroart" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb8b0"/><stop offset=".6" stop-color="#d7e4dc"/><stop offset="1" stop-color="#eef0e6"/></linearGradient>
      <pattern id="rh" width="36" height="22" patternUnits="userSpaceOnUse"><rect width="36" height="22" fill="#b8865c"/><path d="M0 11 L9 2 L18 11 L9 20Z M18 11 L27 2 L36 11 L27 20Z" fill="none" stroke="#8a5a36" stroke-width="2.4"/></pattern></defs>
      <rect width="1200" height="520" fill="url(#sk)"/>
      <path d="M0 260 Q150 170 300 230 T600 200 T900 220 T1200 190 V520 H0Z" fill="#6e9b80"/>
      <path d="M760 520 L820 140 Q840 110 870 120 L900 150 L960 520Z" fill="#4c7a60"/>
      <path d="M842 150 Q846 300 836 520" stroke="#fff" stroke-width="10" stroke-dasharray="14 10" class="fall" opacity=".9" fill="none"/>
      <path d="M842 150 Q846 300 836 520" stroke="#e8f4f2" stroke-width="22" opacity=".35" fill="none"/>
      <g fill="#fff" opacity=".7"><ellipse cx="300" cy="160" rx="160" ry="16"/><ellipse cx="1000" cy="130" rx="140" ry="14"/><ellipse cx="700" cy="250" rx="200" ry="14"/></g>
      <path d="M0 330 Q200 290 420 320 T800 330 T1200 320 V520 H0Z" fill="#3f6d52"/>
      <g transform="translate(60 300)"><path d="M0 120 L20 40 L520 30 L540 120Z" fill="#a6683f"/><rect x="40" y="52" width="460" height="22" fill="url(#rh)"/><path d="M20 40 L520 30" stroke="#7a4a2a" stroke-width="4"/>
        <g fill="#7a4a2a"><circle cx="120" cy="20" r="26"/><circle cx="260" cy="16" r="30"/><circle cx="400" cy="20" r="26"/></g>
        <g fill="#2c4a38"><path d="M92 20 L120 -14 L148 20Z"/><path d="M228 16 L260 -24 L292 16Z"/><path d="M372 20 L400 -14 L428 20Z"/></g></g>
      <path d="M0 420 Q300 380 600 410 T1200 400 V520 H0Z" fill="#244a37"/>
    </svg>
    <span class="phl" data-t="phL"></span>
    <div class="in">
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p data-t="heroP"></p>
      <div class="chips"><span class="chip" data-t="c1"></span><span class="chip" data-t="c2"></span><span class="chip" data-t="c3"></span></div>
      <button class="btn" onclick="openChat(true)">💬 <span data-t="cta"></span></button>
    </div>
  </section>

  <div class="wrap">
    <div class="sh"><h2 data-t="tT"></h2><p data-t="tS"></p></div>
    <div class="cats" id="cats"></div>
    <div class="tours" id="tours"></div>
    <div class="contact" id="contact"></div>
  </div>
</main>

<main id="P" hidden>
  <div class="wrap">
    <div class="sh" style="margin-top:20px"><div><h2 data-t="pT"></h2><p data-t="pS" style="margin-top:4px"></p></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="cardp"><h3 data-t="lT"></h3><p class="sub" data-t="lS"></p><div id="leads"></div></div>
      <div style="display:grid;gap:16px">
        <div class="cardp"><h3 data-t="bT"></h3><p class="sub" data-t="bS"></p><div class="bars" id="bars"></div></div>
        <div class="cardp"><h3 data-t="uT"></h3><p class="sub" data-t="uS"></p><ul class="unq" id="unq"></ul></div>
      </div>
    </div>
  </div>
</main>

  `${[30,70,110,150,190,230].map((x,k)=>`<path d="M${x} 100 Q${x+10} ${50+k%3*10} ${x+20} 100Z" fill="${P[2]}"/>`).join('')}`,
  `<path d="M60 100 L140 46 L220 100Z" fill="${P[1]}"/><circle cx="210" cy="36" r="16" fill="${P[2]}"/>`,
  `<g transform="translate(140 52)"><ellipse rx="16" ry="10" fill="${P[2]}"/><circle cx="14" cy="-6" r="7" fill="${P[2]}"/><path d="M20 -6 L40 -8" stroke="#2a2a2a" stroke-width="2.5"/><path d="M-14 4 Q-50 10 -64 -10 M-14 6 Q-46 22 -66 14" stroke="#1d3a2c" stroke-width="2" fill="none"/><circle cx="-66" cy="-10" r="5" fill="#1d6aa0"/><circle cx="-68" cy="14" r="5" fill="#1d6aa0"/></g>`][i];
 return `<svg viewBox="0 0 280 120" preserveAspectRatio="xMidYMid slice"><rect width="280" height="120" fill="${P[0]}"/>${F}<path d="M0 100 Q90 88 180 100 T280 96 V120 H0Z" fill="${P[1]}"/></svg>`;
}

/* ===== WEB ===== */
function renderWeb(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(typeof v==='string')e.textContent=v});
 $('lEs').className=lang==='es'?'on':'';$('lEn').className=lang==='en'?'on':'';
 const C=T[lang].cats;
 $('cats').innerHTML=Object.keys(C).map(k=>`<button class="${S.cat===k?'on':''}" onclick="S.cat='${k}';renderWeb()">${C[k]}</button>`).join('');
 $('tours').innerHTML=TOURS.filter(x=>S.cat==='all'||x.cat===S.cat).map(x=>`<div class="tc"><div class="art">${art(x.art)}<span class="ph">${lang==='es'?'Ilustración':'Illustration'}</span><span class="dur">${x.dur[lang]}</span></div><div class="bd"><h3>${t('n_'+x.id)}</h3><p>${t('d_'+x.id)}</p><div class="ft"><span class="pr">${x.price?`<b>${sol(x.price)}</b> ${t('pp')}`:t('pc')}</span><button class="ask" onclick="askTour('${x.id}')">💬 ${t('ask')}</button></div></div></div>`).join('');
 $('contact').innerHTML=T[lang].contact.map(([a,c])=>`<div><b>${a}</b>${c}</div>`).join('');
 $('tease').innerHTML=t('tease');$('inp').placeholder=t('ph');
}

/* ===== CHAT ===== */
let busy=Promise.resolve();
function openChat(){S.open=true;$('cw').hidden=false;$('fab').hidden=true;if(!S.msgs.length){bot(b('hi'),b('q0'))}else renderMsgs();setTimeout(()=>{if(innerWidth>520)$('inp').focus()},50)}
function closeChat(){S.open=false;$('cw').hidden=true;$('fab').hidden=false;$('tease').hidden=true}
function renderMsgs(){
 $('ms').innerHTML=S.msgs.map(m=>`<div class="bm ${m.me?'me':'bot'}">${fmt(m.txt)}${m.card||''}</div>`).join('');
 $('qr').innerHTML=S.qr.map((q,i)=>`<button onclick="tapQ(${i})">${q}</button>`).join('');
 $('ms').scrollTop=1e6;
}
function bot(txt,qr,card){S.qr=[];renderMsgs();busy=busy.then(()=>new Promise(res=>{const ty=document.createElement('div');ty.className='typ';ty.innerHTML='<i></i><i></i><i></i>';$('ms').appendChild(ty);$('ms').scrollTop=1e6;
 setTimeout(()=>{S.msgs.push({txt,card});S.qr=qr||[];renderMsgs();res()},Math.min(1300,500+txt.length*3))}))}
function me(txt){S.msgs.push({me:1,txt});S.qr=[];renderMsgs()}
function tapQ(i){const q=S.qr[i];handle(q,true)}
function send(e){e.preventDefault();const v=$('inp').value.trim();if(!v)return;$('inp').value='';handle(v,false)}
function askTour(id){S.lastTour=id;openChat();const n=t('n_'+id);me(n);answerTour(id)}
function answerTour(id){S.lastTour=id;const map={ku:'ku',go:'go',ka:'ka',re:'re',av:'av'};if(map[id])bot(b(map[id]),b('moreQ'));else{bot(b('pk'),b('moreQ'))}}
function handle(txt,tapped){
 me(txt);const n=norm(txt.replace(/^[^\p{L}\p{N}]+/u,''));
 if(S.bk)return bookStep(txt,n);
 if(/^📅|reservar este|book this/.test(norm(txt))||/^(📅 )?(quiero reservar|i want to book)/.test(norm(txt))){return startBook(/este|this/.test(norm(txt))?S.lastTour:null)}
 for(const x of TOURS){if(n===norm(t('n_'+x.id))){S.lastTour=x.id;return answerTour(x.id)}}
 for(const [k,re] of INT){if(re.test(n)){
   if(k==='bk')return startBook(S.lastTour&&/este|this/.test(n)?S.lastTour:null);
   if(['ku','go','ka','re','av'].includes(k)){S.lastTour=k;return bot(b(k),b('moreQ'))}
   if(k==='pk'){S.lastTour=null;return bot(b('pk'),[t('n_cl'),t('n_ta'),t('n_vip'),b('q0')[3]])}
   if(k==='hi')return bot(b('hi'),b('q0'));
   return bot(b(k),k==='thx'?[b('q0')[3]]:b('q0'));
 }}
 S.unans.unshift(txt);renderPanel();
 bot(b('fb'),[b('q0')[3],b('q0')[2]]);
}
function startBook(id){S.bk={step:id?1:0,tour:id};if(id)bot(b('bk1'),b('dq'));else bot(b('bk0'),TOURS.map(x=>t('n_'+x.id)))}
function bookStep(raw,n){
 const k=S.bk;
 if(k.step===0){const x=TOURS.find(x=>norm(t('n_'+x.id))===norm(raw))||TOURS.find(x=>n.includes(norm(t('n_'+x.id)).split(' ').slice(-1)[0]))||TOURS.find(x=>INT.find(i=>i[0]===x.id)&&INT.find(i=>i[0]===x.id)[1].test(n));
  if(!x)return bot(b('bk0'),TOURS.map(x=>t('n_'+x.id)));k.tour=x.id;k.step=1;return bot(b('bk1'),b('dq'))}
 if(k.step===1){if(/otra|another/.test(n)){k.step=11;return bot(b('dpick'))}
  let d;const now=new Date();if(/manana|tomorrow/.test(n)){d=new Date(+now+864e5)}else if(/sabado|saturday/.test(n)){d=new Date(now);d.setDate(d.getDate()+((6-d.getDay()+7)%7||7))}
  k.date=d?cap(d.toLocaleDateString(lang==='es'?'es-PE':'en-US',{weekday:'long',day:'numeric',month:'long'})):raw;k.step=2;return bot(b('bk2'),b('pq'))}
 if(k.step===11){k.date=raw;k.step=2;return bot(b('bk2'),b('pq'))}
 if(k.step===2){const m=raw.match(/\d+/);k.pax=m?Math.max(1,+m[0]):2;k.step=3;return bot(b('bk3'))}
 if(k.step===3){k.name=raw;k.step=4;return bot(b('bk4'))}
 if(k.step===4){k.wa=raw;const x=tour(k.tour);const tot=x.price?sol(x.price*k.pax):b('tbd');
  const card=`<div class="card"><div class="tt">${b('sumT')}</div><div class="r"><span>${b('lT')}</span><b>${t('n_'+x.id)}</b></div><div class="r"><span>${b('lD')}</span><b>${k.date}</b></div><div class="r"><span>${b('lP')}</span><b>${b('pax')(k.pax)}</b></div><div class="r"><span>${b('lTot')}</span><b>${tot}</b></div></div>`;
  S.newLead={name:k.name,wa:k.wa,tour:k.tour,date:k.date,pax:k.pax,tot,lang:lang==='es'?'Español':'English',when:new Date(),conv:S.msgs.slice()};
  S.bk=null;$('bdg').hidden=false;
  bot(b('done').replace('{first}',k.name.split(' ')[0]),b('doneQ'),card);
  busy.then(()=>{S.newLead.conv=S.msgs.slice();renderPanel()});return}
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ===== PANEL ===== */
const SAMPLES=[
 {name:'Laura Méndez',wa:'+51 987 ••• 210',tour:'ku',date:{es:'Sáb, 14 nov',en:'Sat, Nov 14'},pax:2,lang:'Español',st:'o',ago:{es:'hace 2 h · 23:40',en:'2 h ago · 11:40 pm'},conv:[['¿Cuánto cuesta Kuélap?','Is Kuélap expensive?'],['ku'],['Quiero reservar para 2 el sábado','I want to book for 2 on Saturday']]},
 {name:'Tom & Ellie R.',wa:'+44 7700 ••• 118',tour:'go',date:{es:'Dom, 15 nov',en:'Sun, Nov 15'},pax:2,lang:'English',st:'n',ago:{es:'hace 5 h · 06:12',en:'5 h ago · 6:12 am'},conv:[['How long is the Gocta hike?','How long is the Gocta hike?'],['go'],['Can we book Sunday?','Can we book Sunday?']]},
 {name:'Familia Quispe',wa:'+51 956 ••• 774',tour:'co',date:{es:'26 – 30 dic',en:'Dec 26 – 30'},pax:5,lang:'Español',st:'n',ago:{es:'ayer · 21:15',en:'yesterday · 9:15 pm'},conv:[['Venimos de Chiclayo con niños','Coming from Chiclayo with kids'],['ni'],['Queremos el paquete completo','We want the complete package']]},
 {name:'Jürgen W.',wa:'+49 151 ••• 902',tour:'av',date:{es:'Julio 2027',en:'July 2027'},pax:1,lang:'English',st:'n',ago:{es:'ayer · 03:20',en:'yesterday · 3:20 am'},conv:[['Where can I see the Marvelous Spatuletail?','Where can I see the Marvelous Spatuletail?'],['av'],['Please quote me 12 days in July','Please quote me 12 days in July']]}
];
const UNQ={es:['¿Aceptan pagos en dólares?','¿Recogen en el aeropuerto de Jaén?','¿Se puede ir a la Laguna de los Cóndores?'],en:['Do you take US dollars?','Do you pick up at Jaén airport?','Can we go to Laguna de los Cóndores?']};
function leads(){const a=SAMPLES.map(x=>({...x,tot:tour(x.tour).price?sol(tour(x.tour).price*x.pax):b('tbd')}));if(S.newLead)a.unshift({...S.newLead,nw:true,st:S.confirmed?'o':'n',ago:{es:'ahora',en:'just now'}});return a}
function renderPanel(){
 const L=leads();const nl=S.newLead?1:0;const conv=(S.msgs.length?1:0);
 $('kpis').innerHTML=`<div class="kpi"><small>${t('kC')}</small><b>${46+conv}</b>${conv?`<em>${t('kNew',{n:1})}</em>`:''}</div><div class="kpi"><small>${t('kL')}</small><b>${L.length}</b>${nl?`<em>${t('kNew',{n:1})}</em>`:''}</div><div class="kpi"><small>${t('kO')}</small><b>41 %</b></div><div class="kpi hl"><small>${t('kE')}</small><b>37 %</b></div>`;
 const ico={ku:'🏛️',go:'💧',ka:'⚱️',re:'🏺',cl:'📦',co:'📦',ta:'📦',vip:'⭐',av:'🐦'};
 $('leads').innerHTML=L.map((x,i)=>`<button class="lead ${x.nw?'nw':''}" onclick="openLead(${i})"><span class="ic">${ico[x.tour]}</span><span class="mid"><b>${x.name}</b><span class="tag ${x.nw?'n':''}">${x.nw?t('nw'):t('ex')}</span><small>${t('n_'+x.tour)} · ${typeof x.date==='string'?x.date:x.date[lang]} · ${b('pax')(x.pax)}</small><span class="st ${x.st==='o'?'ok':''}">${x.st==='o'?t('stO'):t('stN')}</span> <small style="display:inline;margin-left:6px">🕑 ${x.ago[lang]}</small></span><span class="rt"><b>${x.tot}</b></span></button>`).join('');
 const cnt={ku:31,go:27,ka:14,av:9,co:8};if(S.newLead)cnt[S.newLead.tour]=(cnt[S.newLead.tour]||0)+1;
 const top=Object.entries(cnt).sort((a,c)=>c[1]-a[1]).slice(0,5);const mx=top[0][1];
 $('bars').innerHTML=top.map(([k,v])=>`<div class="bar"><span>${SHORT[k]}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><b>${v}</b></div>`).join('');
 $('unq').innerHTML=[...S.unans.map(q=>({q,nw:1})),...UNQ[lang].map(q=>({q}))].map(x=>`<li>❓ <span>${fmt(x.q)}${x.nw?` <span class="tag n">${t('nw')}</span>`:` <span class="tag">${t('ex')}</span>`}</span><button>${t('addA')}</button></li>`).join('');
}
let LT='c';
const SHORT={ku:'Kuélap',go:'Gocta',ka:'Karajía',re:'Revash',av:'Aves',co:'Completo',cl:'Clásico',ta:'Tarapoto',vip:'VIP'};
function openLead(i){const x=leads()[i];LT=LT||'c';
 const conv=x.nw?x.conv.map(m=>`<div class="bm ${m.me?'me':'bot'}">${fmt(m.txt)}${m.card||''}</div>`).join(''):x.conv.map(c=>c.length===1?`<div class="bm bot">${fmt(b(c[0]))}</div>`:`<div class="bm me">${fmt(c[lang==='es'?0:1])}</div>`).join('');
 const wa=t('waH',{name:x.name,wa:x.wa,tour:t('n_'+x.tour),date:typeof x.date==='string'?x.date:x.date[lang],pax:b('pax')(x.pax),tot:x.tot,lang:x.lang});
 $('modB').innerHTML=`<button class="x" onclick="closeM()">✕</button><h3 style="font-family:Fraunces,serif;font-size:21px;margin:4px 0 2px">${x.name}</h3><p style="color:var(--muted);font-size:12.5px">${x.ago[lang]}</p>
 <div class="tabs2"><button class="${LT==='c'?'on':''}" onclick="LT='c';openLead(${i})">💬 ${t('tabConv')}</button><button class="${LT==='w'?'on':''}" onclick="LT='w';openLead(${i})">📱 ${t('tabWa')}</button></div>
 ${LT==='c'?`<div class="tr2">${conv}</div>`:`<div class="wa"><div class="b">${fmt(wa)}<div class="act"><span>✅ ${t('actA')}</span><span>💬 ${t('actB')}</span></div></div></div>`}
 ${x.st==='n'?`<button class="btn gr" style="width:100%;margin-top:12px" onclick="confirmLead(${x.nw?1:0},this)">${t('confirm')}</button>`:''}`;
 $('mod').hidden=false;
}
function confirmLead(isNew,el){if(isNew)S.confirmed=true;el.textContent=t('confirmed');el.disabled=true;renderPanel()}
function closeM(){$('mod').hidden=true}
function view(v){S.v=v;$('W').hidden=v!=='w';$('P').hidden=v!=='p';$('tW').className=v==='w'?'on':'';$('tP').className=v==='p'?'on':'';$('fab').hidden=v!=='w'||S.open;if(v==='p'){$('cw').hidden=true;S.open=false;$('bdg').hidden=true;renderPanel()}scrollTo({top:0,behavior:'smooth'})}
function toggleLang(){lang=lang==='es'?'en':'es';renderWeb();renderPanel();if(S.open&&!S.msgs.length)bot(b('hi'),b('q0'))}
renderWeb();renderPanel();
setTimeout(()=>{if(!S.open){$('tease').hidden=false}},1800);
</script>
