<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ilatoa Lodge · Reserva directa (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2233;--muted:#667085;--line:#e4e1da;--bg:#f6f4ef;--card:#fff;--night:#1d2a4a;--night2:#2f4373;--amber:#e3a447;--amber2:#f0bf6a;--sage:#5f7f6a;--ok:#2e8b57;--danger:#c0392b;--r:22px;--sh:0 16px 36px -20px rgba(29,42,74,.38)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:30px;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.demobar{background:#121a2e;color:#d9def0;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.35}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(246,244,239,.9);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:22px;line-height:1;white-space:nowrap;letter-spacing:.3px}
.brand small{display:block;font-size:11px;color:var(--muted)}
.seg{display:flex;background:#e9e6de;border-radius:999px;padding:3px}
.seg button{position:relative;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--night2)}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 10px}.lang{padding:7px 9px}}
@media(max-width:400px){.brand div{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
/* hero */
.hero{position:relative;margin:14px auto 0;max-width:1100px;border-radius:30px;overflow:hidden;color:#fff;min-height:450px;display:flex;align-items:flex-end;box-shadow:var(--sh);background:var(--night)}
@media(max-width:1128px){.hero{margin:14px 14px 0}}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,18,34,0) 25%,rgba(12,18,34,.86) 100%)}
.hero .in{position:relative;z-index:2;padding:56px 22px 24px;width:100%}
.phl{position:absolute;top:14px;right:14px;z-index:3;font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber2)}
.hero h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(40px,8vw,70px);line-height:.98;margin:8px 0 12px;max-width:760px}
.hero p{max-width:560px;opacity:.95;font-size:15px}
.hero h1,.hero p{text-shadow:0 2px 14px rgba(5,10,20,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.26);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.heroRow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rate{font-size:13px}.rate b{font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#2a1a00;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;transition:.2s;text-decoration:none;box-shadow:0 10px 22px -8px rgba(227,164,71,.7)}
.btn:hover{transform:translateY(-2px)}
.btn.nt{background:linear-gradient(135deg,var(--night),var(--night2));color:#fff;box-shadow:0 10px 22px -10px rgba(29,42,74,.8)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.twinkle{animation:tw 2.4s ease-in-out infinite alternate}@keyframes tw{to{opacity:.35}}
.plane{animation:pl 16s linear infinite}@keyframes pl{from{transform:translate(-120px,40px)}to{transform:translate(1300px,-120px)}}
/* perks */
.perks{margin-top:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.perks div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;gap:11px;align-items:center;font-size:13px}
.perks i{font-style:normal;font-size:20px;width:40px;height:40px;border-radius:12px;background:#eef0f7;display:grid;place-items:center;flex:none}
.perks b{display:block;font-size:14px}.perks small{color:var(--muted)}
/* booking */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sh h2{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(30px,5vw,40px);line-height:1}
.sh p{color:var(--muted);font-size:13.5px;max-width:520px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.two>*{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1fr) 350px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:5px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.stp .bar{height:5px;border-radius:5px;background:#ebe8e0;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--night2),var(--amber));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--night2)}
h2.t{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:30px;line-height:1.05;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .head b{font-size:15px}
.cal .head button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}
.cal .head button[disabled]{opacity:.3}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.day{aspect-ratio:1;border-radius:11px;font-size:13.5px;font-weight:700;background:#eef0f7;color:var(--night2);display:grid;place-items:center}
.day:hover{background:#dfe4f2}
.day.x{color:#b8b5ad;text-decoration:line-through;background:#f1efe9;pointer-events:none}
.day.e{background:none;pointer-events:none}
.day.in{background:#f8e6c6;color:#8a5a10;border-radius:6px}
.day.s,.day.f{background:linear-gradient(135deg,var(--night),var(--night2));color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.range{display:flex;align-items:center;gap:10px;background:#f3f1ea;border-radius:16px;padding:12px 14px;font-size:13px;margin-top:12px}
.range b{display:block;font-size:14px}.range small{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
.range .n{margin-left:auto;font-weight:800}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.cnt b{display:block;font-size:14.5px}.cnt small{color:var(--muted);font-size:12px}
.stepr{display:flex;align-items:center;gap:10px}
.stepr button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;font-weight:700;background:#fff}
.stepr button[disabled]{opacity:.3}
.stepr span{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.rooms{display:grid;gap:9px}
.rm{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:18px;padding:10px;background:#fff;width:100%;transition:.15s}
.rm:hover{border-color:#cdd3e6}
.rm.on{border-color:var(--night2);background:#f4f6fc}
.rm.dis{opacity:.45;pointer-events:none}
.rm .art{width:86px;height:70px;border-radius:12px;overflow:hidden;flex:none;position:relative}
.rm .art svg{width:100%;height:100%;display:block}
.rm .mid{flex:1;min-width:0}
.rm b{display:block;font-size:14.5px;line-height:1.2}
.rm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rm .pr{text-align:right;flex:none}.rm .pr b{font-size:17px}.rm .pr small{font-size:11px}
.rm .why{color:var(--danger);font-weight:700}
.pub{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-top:3px}
.pub.r{background:#e3f3e9;color:var(--ok)}.pub.e{background:#fbf0dc;color:#9a6a00}
/* transfer */
.tx{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;transition:.15s}
.tx.on{border-color:var(--night2);background:#f6f7fc}
.tx .hd{display:flex;gap:12px;align-items:center;cursor:pointer}
.tx .hd i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:13px;background:#eef0f7;display:grid;place-items:center;flex:none}
.tx .hd b{display:block;font-size:14.5px}.tx .hd small{color:var(--muted);font-size:12.5px}
.tg{width:44px;height:26px;border-radius:999px;background:#d8d4ca;position:relative;flex:none;margin-left:auto;transition:.2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tx.on .tg{background:var(--night2)}.tx.on .tg:after{left:21px}
.tx .bd{margin-top:12px;display:grid;gap:10px}
.tx .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--night2)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:700}
.pill.on{border-color:var(--night2);background:#eef0f7;color:var(--night2)}
.calc{background:#fff7e8;border-radius:14px;padding:10px 12px;font-size:13px;color:#7a4e06}
.calc b{color:#5b3a00}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.lnk{font-size:12.5px;font-weight:700;color:var(--night2);text-decoration:underline;margin-bottom:10px}
.err{color:var(--danger);font-size:12.5px;font-weight:600;min-height:16px;margin-top:6px}
.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 auto}
.mock{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--night),var(--night2) 60%,#5a4a7a);margin:4px 0 6px}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:17px;letter-spacing:1.5px;margin-top:8px}
/* summary */
.sum h3{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.ln b{color:var(--ink);text-align:right}
.hr{border-top:1px dashed var(--line);margin:8px 0}
.ln.big{font-size:15.5px;color:var(--ink);font-weight:800}
.dep{background:#eef0f7;border-radius:14px;padding:12px;margin-top:10px}.dep .ln{color:var(--night2);font-weight:800;font-size:15px}.dep .ln.s{color:var(--muted);font-weight:600;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.empty{color:var(--muted);font-size:13.5px}
/* done & chat */
.center{text-align:center}
.okm{width:70px;height:70px;margin:0 auto 6px;display:block}
.okm circle{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .7s .1s forwards}.okm path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{padding:9px 13px;border-radius:999px;background:#ebe8e0;font-size:12.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--night);color:#fff}
.phone{background:#e6ddcf;border-radius:22px;overflow:hidden;border:1px solid var(--line);max-width:430px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#075e54;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:var(--night);display:grid;place-items:center;flex:none}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.8;font-size:11.5px}
.chat{padding:12px;min-height:300px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dsep{align-self:center;background:rgba(255,255,255,.88);color:#667;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin:4px 0;text-transform:uppercase}
.msg{max-width:88%;padding:8px 11px 6px;border-radius:14px;font-size:13.4px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;white-space:pre-wrap;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.msg .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;white-space:normal}
.msg .act span{font-size:12px;font-weight:700;color:#0a7cff;background:#f2f7ff;border-radius:8px;padding:5px 9px}
.drv{display:flex;gap:10px;align-items:center;background:#f3f6ff;border-radius:10px;padding:8px;margin-top:6px;white-space:normal}
.drv .dp{width:38px;height:38px;border-radius:50%;background:var(--night2);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.drv b{display:block;font-size:13px}.drv small{color:#667;font-size:11.5px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px}
.details{display:grid;gap:16px;margin-top:16px}@media(min-width:760px){.details{grid-template-columns:1fr 1fr}}
.details h3{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;margin-bottom:10px}
.ck{list-style:none}.ck li{font-size:13.5px;padding:4px 0 4px 24px;position:relative}.ck li:before{content:"✦";position:absolute;left:2px;color:var(--amber)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13.5px}.kv span{color:var(--muted)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:25px;font-weight:800;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.kpi.hl{background:linear-gradient(135deg,var(--night),var(--night2));color:#fff;border:0}.kpi.hl small{color:#cdd6f0}
.ad2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:920px){.ad2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
h3.sec{font-size:16px;margin:2px 0 4px}
.sec2{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.tl{display:grid;gap:8px}
.tli{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:11px 12px;background:#fff}
.tli.nw{background:#fff7e8;border-color:var(--amber2);box-shadow:0 0 0 3px #fcebcc}
.tli .h{width:62px;flex:none;text-align:center;border-radius:12px;padding:6px 0;background:var(--night);color:#fff;line-height:1.05}
.tli .h b{display:block;font-size:16px}.tli .h small{font-size:10px;opacity:.8;text-transform:uppercase;font-weight:700}
.tli .h.dawn{background:linear-gradient(135deg,#3b2f63,#e3a447)}
.tli .m{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}.tli .m b{display:block;color:var(--ink);font-size:14px}
.tli .dir{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;background:#e3f3e9;color:var(--ok)}
.tli .dir.out{background:#eef0f7;color:var(--night2)}
.bk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);margin-bottom:9px;width:100%;text-align:left;background:#fff}
.bk.nw{background:#fff7e8;border-color:var(--amber2)}
.bk .av2{width:46px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;background:linear-gradient(135deg,var(--night),var(--night2));line-height:1}
.bk .av2 b{font-size:16px}.bk .av2 small{font-size:9px;color:#cdd6f0;text-transform:uppercase;margin-top:2px}
.bk .m{flex:1;min-width:0}.bk .nm{font-size:14px;font-weight:700}.bk small{display:block;color:var(--muted);font-size:12px}
.bk .am{text-align:right;font-size:13px;flex:none}.bk .am b{display:block}
.tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;margin-left:5px;vertical-align:1px}
.tag.ex{background:#ebe8e0;color:#7d776a}.tag.nw{background:var(--amber);color:#2a1a00}
.tag.tr{background:#eef0f7;color:var(--night2)}
.ov{position:fixed;inset:0;background:rgba(12,18,34,.55);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:up .3s}

}

/* ===== RENDER ===== */
function renderStatic(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>{const v=t(e.dataset.i);if(typeof v==='string')e.textContent=v});
 $('lES').className=lang==='es'?'on':'';$('lEN').className=lang==='en'?'on':'';
 $('lk').innerHTML=T[lang].lk.map(x=>`<li>${x}</li>`).join('');
 $('kv').innerHTML=T[lang].kv.map(([a,b])=>`<span>${a}</span><b style="font-weight:600">${b}</b>`).join('');
 const L=$('lights');if(!L.innerHTML){let h='';for(let k=0;k<70;k++){const x=(k*97)%1180+10,y=372+((k*37)%40);h+=`<circle cx="${x}" cy="${y}" r="${1+(k%3)*.5}" fill="#ffd27a" opacity="${.5+(k%4)*.12}"/>`}L.innerHTML=h}
}
function stepper(){$('stepper').innerHTML=['st1','st2','st3','st4'].map((k,i)=>`<div class="stp ${S.step===i+1?'on':S.step>i+1?'done':''}"><div class="bar"><i></i></div>${i+1}. ${t(k)}</div>`).join('')}
function renderBody(){
 stepper();const b=$('body');let h='';
 if(S.done){renderDone();return}
 if(S.step===1){
  h=`<h2 class="t">${t('dT')}</h2><p class="sub">${t('dS')}</p>${calendar()}
  <div class="range"><span><small>${t('arr')}</small><b>${S.cin?fD(S.cin):'—'}</b></span><span>→</span><span><small>${t('dep')}</small><b>${S.cout?fD(S.cout):'—'}</b></span><span class="n">${nights()?t('nights',{n:nights()}):''}</span></div>
  ${S.cin&&!S.cout?`<p class="note">👆 ${t('tapOut')}</p>`:''}
  <div class="cnt" style="margin-top:12px;border:0"><span><b>${t('gL')}</b><small>${t('gS')}</small></span><span class="stepr"><button ${S.g<=1?'disabled':''} onclick="S.g--;if(S.room&&room(S.room).cap<S.g)S.room=null;renderAll()">−</button><span>${S.g}</span><button ${S.g>=4?'disabled':''} onclick="S.g++;if(S.room&&room(S.room).cap<S.g)S.room=null;renderAll()">+</button></span></div>
  <div class="nav"><button class="btn nt" ${nights()?'':'disabled'} onclick="go(2)">${t('next')} →</button></div>`;
 }
 if(S.step===2){
  h=`<h2 class="t">${t('rT')}</h2><p class="sub">${t('rS',{g:pl(S.g,T[lang].pW),n:t('nights',{n:nights()})})}</p><div class="rooms">`+R.map(r=>{const ok=r.cap>=S.g;return `<button class="rm ${S.room===r.id?'on':''} ${ok?'':'dis'}" onclick="S.room='${r.id}';renderAll()"><span class="art">${art(r.art)}</span><span class="mid"><b>${t('n_'+r.id)}${r.star?' ✦':''}</b><small>${t('b_'+r.bed)} · ${t('upTo',{n:r.cap})}${r.m2?' · '+r.m2+' m²':''}</small><small>${ok?t('v_'+r.id):`<span class="why">${t('small')}</span>`}</small></span><span class="pr"><b>${money(r.price)}</b><small>${t('pn')}</small><span class="pub ${r.pub?'r':'e'}">${r.pub?t('pubL'):t('exL')}</span></span></button>`}).join('')+`</div>
  <div class="nav"><button class="btn ghost" onclick="go(1)">←</button><button class="btn nt" ${S.room?'':'disabled'} onclick="go(3)">${t('next')} →</button></div>`;
 }
 if(S.step===3){
  const nIn=isNight(S.tinT),pk=pickT(),nOut=isNight(pk);
  h=`<h2 class="t">${t('xT')}</h2><p class="sub">${t('xS')}</p>
  <div class="tx ${S.tin?'on':''}"><div class="hd" onclick="S.tin=!S.tin;renderAll()"><i>🛬</i><span><b>${t('xIn')}</b><small>${t('xInS')} · ${t('perT',{p:money(txPrice(S.tinT))})}</small></span><span class="tg"></span></div>
   ${S.tin?`<div class="bd"><div class="row2"><div class="fld"><label>${t('fl')}</label><input value="${S.fin}" placeholder="${t('flP')}" oninput="S.fin=this.value;renderSum()"></div><div class="fld"><label>${t('lt')}</label><input type="time" value="${S.tinT}" onchange="S.tinT=this.value;renderAll()"></div></div>
   <div class="pills">${['06:10','14:30','23:40','01:15'].map(x=>`<button class="pill ${S.tinT===x?'on':''}" onclick="S.tinT='${x}';renderAll()">${x}</button>`).join('')}</div>
   ${nIn?`<div class="calc">${t('lateIn')}</div><div class="note" style="margin:0">${t('night')}</div>`:''}</div>`:''}</div>
  <div class="tx ${S.tout?'on':''}"><div class="hd" onclick="S.tout=!S.tout;renderAll()"><i>🛫</i><span><b>${t('xOut')}</b><small>${t('xOutS')} · ${t('perT',{p:money(txPrice(pk))})}</small></span><span class="tg"></span></div>
   ${S.tout?`<div class="bd"><div class="row2"><div class="fld"><label>${t('fl')}</label><input value="${S.fout}" placeholder="${t('flP')}" oninput="S.fout=this.value;renderSum()"></div><div class="fld"><label>${t('dtm')}</label><input type="time" value="${S.toutT}" onchange="S.toutT=this.value;renderAll()"></div></div>
   <div class="pills"><button class="pill ${S.kout==='i'?'on':''}" onclick="S.kout='i';renderAll()">✈️ ${t('intl')}</button><button class="pill ${S.kout==='n'?'on':''}" onclick="S.kout='n';renderAll()">🇪🇨 ${t('nat')}</button></div>
   <div class="calc">${t('pick',{t:pk,h:S.kout==='i'?'3½':'2½',k:S.kout==='i'?t('intl').toLowerCase():t('nat').toLowerCase()})}</div>${nOut?`<div class="note" style="margin:0">${t('night')}</div>`:''}</div>`:''}</div>
  <div class="nav"><button class="btn ghost" onclick="go(2)">←</button><button class="btn nt" onclick="go(4)">${S.tin||S.tout?t('next')+' →':t('skip')}</button></div>`;
 }
 if(S.step===4){
  const q=quote();
  h=`<h2 class="t">${t('yT')}</h2><p class="sub">${t('yS')}</p><button class="lnk" onclick="fill()">${t('autofill')}</button>
  <div class="two"><div class="fld"><label>${t('name')}</label><input id="fN" value="${S.name}" oninput="S.name=this.value"></div><div class="fld"><label>${t('country')}</label><input value="${S.country}" oninput="S.country=this.value"></div></div>
  <div class="two" style="margin-top:10px"><div class="fld"><label>${t('phone')}</label><input id="fW" inputmode="tel" value="${S.wa}" oninput="S.wa=this.value"></div><div class="fld"><label>${t('email')}</label><input value="${S.email}" oninput="S.email=this.value"></div></div>
  <div class="pills" style="margin:14px 0 8px"><button class="pill ${S.pay==='card'?'on':''}" onclick="S.pay='card';renderBody()">💳 ${t('card')}</button><button class="pill ${S.pay==='transfer'?'on':''}" onclick="S.pay='transfer';renderBody()">🏦 ${t('transfer')}</button></div>
  ${S.pay==='card'?`<div class="mock"><small>${t('cardL')}</small><b>4242 4242 4242 4242</b><small>12/29 · CVC 123</small></div>`:''}
  <div class="err" id="err"></div>
  <button class="btn" style="width:100%" id="payB" onclick="submit()">🔒 ${t('pay',{a:money(q.dep)})}</button>
  <p class="note center">${t('sim')}</p>
  <div class="nav"><button class="btn ghost" onclick="go(3)">← ${t('back')}</button></div>`;
 }
 b.innerHTML=h;
}
function calendar(){
 const [y,m]=S.mon;const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const n=new Date(y,m+1,0).getDate();
 const dow=lang==='es'?['Lu','Ma','Mi','Ju','Vi','Sá','Do']:['Mo','Tu','We','Th','Fr','Sa','Su'];
 let d='';for(let i=0;i<off;i++)d+='<span class="day e"></span>';
 for(let i=1;i<=n;i++){const dt=new Date(y,m,i);let c='';
  if(dt<=TODAY||(full(dt)&&!(S.cin&&!S.cout&&dt>S.cin&&free(S.cin,dt))))c='x';
  if(S.cin&&+dt===+S.cin)c='s';else if(S.cout&&+dt===+S.cout)c='f';else if(S.cin&&S.cout&&dt>S.cin&&dt<S.cout)c='in';
  d+=`<button class="day ${c}" onclick="tap(${y},${m},${i})">${i}</button>`}
 const lbl=cap(first.toLocaleDateString(loc(),{month:'long',year:'numeric'}));
 return `<div class="cal"><div class="head"><button ${y===2026&&m===10?'disabled':''} onclick="mv(-1)">‹</button><b>${lbl}</b><button ${y===2027&&m===5?'disabled':''} onclick="mv(1)">›</button></div><div class="dow">${dow.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${d}</div><div class="legend"><span><i style="background:#eef0f7;border:1px solid #d8ddeb"></i>${t('lgOk')}</span><span><i style="background:#f1efe9"></i>${t('lgFull')}</span></div></div>`;
}
function free(a,b){for(let d=new Date(+a+864e5);d<b;d=new Date(+d+864e5))if(full(d))return false;return true}
function tap(y,m,i){const d=new Date(y,m,i);if(!S.cin||S.cout||d<=S.cin){S.cin=d;S.cout=null}else if(free(S.cin,d))S.cout=d;else{S.cin=d;S.cout=null}renderAll()}
function mv(k){let [y,m]=S.mon;m+=k;if(m<0){m=11;y--}if(m>11){m=0;y++}S.mon=[y,m];renderBody()}
function quote(){
 const r=S.room?room(S.room):null;const n=nights();const L=[];
 if(r&&n)L.push([t('lnR',{n,p:money(r.price)}),r.price*n]);
 const ti=S.tin&&S.step>=3?txPrice(S.tinT):0,to=S.tout&&S.step>=3?txPrice(pickT()):0;
 if(ti)L.push([t('lnTi')+(isNight(S.tinT)?' 🌙':''),ti]);if(to)L.push([t('lnTo')+(isNight(pickT())?' 🌙':''),to]);
 const base=r&&n?r.price*n:0;const iva=base*IVA;if(iva)L.push([t('lnIva'),iva]);
 const tot=L.reduce((s,x)=>s+x[1],0);return{L,tot,dep:Math.round(tot*DEP*100)/100,ti,to};
}
function renderSum(){
 const r=S.room?room(S.room):null;const q=quote();
 let h=`<h3>${t('sumT')}</h3><div class="ln"><span>${t('sDates')}</span><b>${S.cin?fD(S.cin):t('none')}${S.cout?' → '+fD(S.cout):''}</b></div><div class="ln"><span>${t('sG')}</span><b>${pl(S.g,T[lang].pW)}</b></div><div class="ln"><span>${t('sRoom')}</span><b>${r?t('n_'+r.id):t('none')}</b></div>`;
 if(q.L.length){h+=`<div class="hr"></div>`+q.L.map(([a,b])=>`<div class="ln"><span>${a}</span><b>${money(b)}</b></div>`).join('')+`<div class="ln big"><span>${t('total')}</span><span>${money(q.tot)}</span></div><div class="dep"><div class="ln"><span>${t('deposit')}</span><span>${money(q.dep)}</span></div><div class="ln s"><span>${t('balance')}</span><span>${money(q.tot-q.dep)}</span></div></div><p class="note">${t('inc')}</p>`}
 $('sum').innerHTML=h;
}
function renderAll(){renderStatic();renderBody();renderSum();renderAdmin()}
function go(n){S.step=n;renderBody();renderSum();const b=$('book');if(b.getBoundingClientRect().top<0)b.scrollIntoView({behavior:'smooth'})}
function fill(){Object.assign(S,{name:'Claire Dubois',country:lang==='es'?'Francia':'France',wa:'+33 6 12 45 78 90',email:'claire.d@example.com'});renderBody()}
function submit(){
 if(!S.name.trim()||!S.wa.trim()){$('err').textContent=t('errF');return}
 const b=$('payB');b.textContent=t('processing');b.disabled=true;
 setTimeout(()=>{const q=quote();S.newB={name:S.name,country:S.country||'—',room:S.room,cin:S.cin,cout:S.cout,g:S.g,tin:S.tin?{t:S.tinT,fl:S.fin}:null,tout:S.tout?{t:pickT(),fl:S.fout}:null,tot:q.tot,dep:q.dep};S.done=true;S.tab='g';$('bdg').hidden=false;renderAll();$('book').scrollIntoView({behavior:'smooth'})},900);
}
/* chat */
let TOK=0;
const fmtW=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*(.+?)\*/g,'<b>$1</b>');
const now=()=>new Date().toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
function guestMsgs(B){const first=B.name.split(' ')[0];let tx='';if(B.tin)tx+=t('w0tx',{fl:B.tin.fl,t:B.tin.t});if(B.tout)tx+=t('w0to',{t:B.tout.t});
 const L=[{sep:t('d0')},{biz:1,txt:t('w0',{first,room:t('n_'+B.room),in:fD(B.cin),out:fD(B.cout),n:t('nights',{n:Math.round((B.cout-B.cin)/864e5)}),g:pl(B.g,T[lang].pW),tx,dep:money(B.dep),bal:money(B.tot-B.dep)})},{usr:1,txt:t('u0')},{sep:t('d1')}];
 if(B.tin)L.push({biz:1,txt:t('w1',{first}),drv:1});else L.push({biz:1,txt:t('w1n',{first})});
 L.push({usr:1,txt:t('u1')});return L}
function hostMsgs(B){let tx='';if(B.tin)tx+=t('whTx',{t:B.tin.t,fl:B.tin.fl});if(B.tout)tx+=t('whTo',{t:B.tout.t});
 return [{sep:t('d0')},{biz:1,act:1,txt:t('wh',{name:B.name,country:B.country,room:t('n_'+B.room),in:fD(B.cin),out:fD(B.cout),n:t('nights',{n:Math.round((B.cout-B.cin)/864e5)}),g:pl(B.g,T[lang].pW),tx,dep:money(B.dep)})}]}
function phone(id,title){return `<div class="phone"><div class="wah"><span class="av"><svg viewBox="0 0 36 36" width="26" height="26"><path d="M5 27 L15 13 L19 18 L23 12 L31 27Z" fill="#5f7f6a"/><circle cx="25" cy="9" r="3.2" fill="#f0bf6a"/></svg></span><span><b>${title}</b><small>${t('bizSub')}</small></span></div><div class="chat" id="${id}"></div><div class="wafoot">${t('wafoot')}</div></div>`}
async function play(id,list){const tok=++TOK;const box=$(id);if(!box)return;box.innerHTML='';
 for(const m of list){if(tok!==TOK)return;
  if(m.sep){const d=document.createElement('div');d.className='dsep';d.textContent=m.sep;box.appendChild(d);continue}
  if(m.biz){const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';box.appendChild(ty);await new Promise(r=>setTimeout(r,750));if(tok!==TOK)return;ty.remove()}else await new Promise(r=>setTimeout(r,550));
  if(tok!==TOK)return;const e=document.createElement('div');e.className='msg '+(m.biz?'biz':'usr');
  e.innerHTML=fmtW(m.txt)+(m.drv?`<div class="drv"><span class="dp">JM</span><span><b>${t('drv')}: Jorge M.</b><small>${t('drvS')}</small></span></div>`:'')+(m.act?`<div class="act"><span>🚐 ${t('actA')}</span><span>💬 ${t('actB')}</span></div>`:'')+`<span class="tm">${now()}${m.biz?' ✓✓':''}</span>`;box.appendChild(e)}}
function renderDone(){const B=S.newB;
 $('body').innerHTML=`<div class="center"><svg class="okm" viewBox="0 0 72 72"><circle cx="36" cy="36" r="33" fill="none" stroke="#2e8b57" stroke-width="4"/><path d="M22 37 l10 10 l18 -20" fill="none" stroke="#2e8b57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2 class="t">${t('done')}</h2><p class="sub">${t('doneS')}</p></div>
 <div class="tabs"><button class="${S.tab==='g'?'on':''}" onclick="S.tab='g';renderDone()">📱 ${t('tg')}</button><button class="${S.tab==='h'?'on':''}" onclick="S.tab='h';renderDone()">🏡 ${t('th')}</button></div>
 ${phone('ch',S.tab==='g'?'Ilatoa Lodge':'Ilatoa · Web')}
 <div class="nav"><button class="btn ghost" onclick="reset()">${t('another')}</button><button class="btn nt" onclick="view('a')">${t('seeA')}</button></div>`;
 play('ch',S.tab==='g'?guestMsgs(B):hostMsgs(B));
}
function reset(){Object.assign(S,{step:1,cin:null,cout:null,room:null,tin:false,tout:false,done:false});TOK++;renderAll()}

/* ===== ADMIN ===== */
const SAMPLES=[
 {name:'Mark & Julia S.',country:'Canadá|Canada',room:'db',cin:new Date(2026,10,6),cout:new Date(2026,10,8),g:2,tin:{t:'23:55',fl:'AA 1531'},tout:null,tot:205.3,dep:61.59},
 {name:'Familia Andrade',country:'Ecuador|Ecuador',room:'cp',cin:new Date(2026,10,7),cout:new Date(2026,10,9),g:4,tin:null,tout:null,tot:266.8,dep:80.04},
 {name:'Hiroshi T.',country:'Japón|Japan',room:'dj',cin:new Date(2026,10,8),cout:new Date(2026,10,9),g:1,tin:{t:'14:20',fl:'CM 448'},tout:{t:'03:10',fl:'IB 6458'},tot:119.4,dep:35.82},
 {name:'Ana & Pablo',country:'España|Spain',room:'su',cin:new Date(2026,10,10),cout:new Date(2026,10,13),g:2,tin:{t:'06:35',fl:'UX 51'},tout:{t:'15:30',fl:'UX 52'},tot:538,dep:161.4}
];
function allB(){const a=SAMPLES.map(x=>({...x,country:x.country.split('|')[lang==='es'?0:1]}));if(S.newB)a.unshift({...S.newB,nw:true});return a}
function renderAdmin(){
 const A=allB();const tr=[];
 A.forEach((b,k)=>{if(b.tin)tr.push({d:b.cin,t:b.tin.t,fl:b.tin.fl,dir:'in',b,k});if(b.tout)tr.push({d:b.cout,t:b.tout.t,fl:b.tout.fl,dir:'out',b,k})});
 tr.sort((x,y)=>(x.d-y.d)||(toMin(x.t)-toMin(y.t)));
 const dep=A.reduce((s,b)=>s+b.dep,0);
 $('kpis').innerHTML=`<div class="kpi"><small>${t('kR')}</small><b>${A.length+7}</b>${S.newB?`<em>${t('kNew',{n:1})}</em>`:''}</div><div class="kpi"><small>${t('kT')}</small><b>${tr.length}</b>${S.newB&&(S.newB.tin||S.newB.tout)?`<em>${t('kNew',{n:(S.newB.tin?1:0)+(S.newB.tout?1:0)})}</em>`:''}</div><div class="kpi"><small>${t('kD')}</small><b>${money(dep)}</b></div><div class="kpi hl"><small>${t('kO')}</small><b>${S.newB?'64':'61'} %</b></div>`;
 $('tl').innerHTML=tr.map(x=>`<div class="tli ${x.b.nw?'nw':''}"><span class="h ${isNight(x.t)?'dawn':''}"><b>${x.t}</b><small>${fD(x.d)}</small></span><span class="m"><b>${x.b.name}${x.b.nw?` <span class="tag nw">${t('nw')}</span>`:` <span class="tag ex">${t('ex')}</span>`}</b>${x.dir==='in'?'✈️ '+x.fl+' → Ilatoa':'Ilatoa → ✈️ '+x.fl} · ${pl(x.b.g,T[lang].pW)}</span><span class="dir ${x.dir==='out'?'out':''}">${x.dir==='in'?t('inL'):t('outL')}</span></div>`).join('');
 $('bks').innerHTML=A.map((b,k)=>`<button class="bk ${b.nw?'nw':''}" onclick="openB(${k})"><span class="av2"><b>${b.cin.getDate()}</b><small>${b.cin.toLocaleDateString(loc(),{month:'short'}).replace('.','')}</small></span><span class="m"><span class="nm">${b.name}<span class="tag ${b.nw?'nw':'ex'}">${b.nw?t('nw'):t('ex')}</span>${b.tin||b.tout?`<span class="tag tr">🚐 ${t('trTag')}</span>`:''}</span><small>${t('n_'+b.room)} · ${t('nights',{n:Math.round((b.cout-b.cin)/864e5)})}</small></span><span class="am"><b>${money(b.tot)}</b><small>${money(b.dep)}</small></span></button>`).join('');
}
function openB(k){const b=allB()[k];$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><h2 class="t" style="font-size:26px;margin-bottom:12px">${b.name}</h2>${phone('cm','Ilatoa · Web')}</div></div>`;play('cm',hostMsgs(b))}
function closeM(){$('modal').innerHTML='';TOK++}
function view(v){S.v=v;$('vC').hidden=v!=='c';$('vA').hidden=v!=='a';$('tC').className=v==='c'?'on':'';$('tA').className=v==='a'?'on':'';if(v==='a'){$('bdg').hidden=true;renderAdmin()}scrollTo({top:0,behavior:'smooth'})}
function toggleLang(){lang=lang==='es'?'en':'es';renderAll()}
renderAll();
</script>
