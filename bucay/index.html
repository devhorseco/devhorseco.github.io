<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo de reservas · Bucay Adventures</title>
<style>
:root{--ink:#0b1f2a;--muted:#5d7079;--line:#e2eae7;--bg:#f2f6f4;--card:#fff;--deep:#06323a;--pri:#0e7c66;--pri2:#14a085;--acc:#ffb020;--blue:#2a7de1;--danger:#e5484d;--ok:#12a36b;--r:22px;--sh:0 10px 30px -12px rgba(6,50,58,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding-bottom:40px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.demobar{background:#0b1f2a;color:#cfe4dd;font-size:11.5px;padding:7px 14px;text-align:center;display:flex;gap:8px;justify-content:center;align-items:center;line-height:1.3}
.demobar .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
header.top{position:sticky;top:0;z-index:30;background:rgba(242,246,244,.82);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}
.seg{position:relative;display:flex;background:#e3ebe8;border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge{position:absolute;top:-5px;right:-4px;background:var(--danger);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.lang{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;letter-spacing:.3px}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--pri)}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.hero{position:relative;margin:14px auto 0;max-width:1080px;border-radius:28px;overflow:hidden;color:#fff;min-height:330px;display:flex;align-items:flex-end;box-shadow:var(--sh)}
.heroart{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,50,58,0) 25%,rgba(6,50,58,.82) 100%)}
.hero .in{position:relative;z-index:2;padding:26px 22px 24px;width:100%}
.eyebrow{display:inline-block;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-weight:600}
.hero h1{font-size:clamp(30px,7vw,52px);line-height:1.02;letter-spacing:-1.4px;margin:12px 0 8px}
.hero p{max-width:560px;opacity:.92;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:6px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.heroRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.price small{display:block;font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.price b{font-size:34px;letter-spacing:-1px}.price span{opacity:.85;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--acc),#ff8a3d);color:#1c1200;font-weight:800;padding:14px 22px;border-radius:16px;font-size:15px;box-shadow:0 10px 22px -8px rgba(255,138,61,.7);transition:.2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid var(--line)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 10px 22px -10px rgba(14,124,102,.8)}
.btn[disabled]{opacity:.45;pointer-events:none}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.trust i{font-style:normal;color:var(--ok);font-weight:800;margin-right:5px}
.grid{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr)}
.grid>*,.two>*,.details>*{min-width:0}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.sticky{position:sticky;top:76px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:20px}
.stepper{display:flex;gap:6px;margin-bottom:18px}
.stp{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted)}
.stp .bar{height:5px;border-radius:5px;background:#e3ebe8;overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.4s}
.stp.on{color:var(--ink)}.stp.on .bar i,.stp.done .bar i{width:100%}.stp.done{color:var(--pri)}
h2.t{font-size:21px;letter-spacing:-.5px;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal .head b{font-size:15px}
@media(max-width:520px){.brand small{display:none}.seg button{padding:7px 11px}.lang{padding:7px 10px}header.top{flex-wrap:nowrap}.brand b{font-size:14px}}
.nav{width:36px;height:36px;border-radius:12px;background:#eef3f1;font-size:18px;font-weight:700}
.nav[disabled]{opacity:.3;pointer-events:none}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--muted);text-align:center;margin-bottom:5px;text-transform:capitalize;font-weight:600}
.day{aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:#eef6f3;color:var(--deep);position:relative;transition:.15s}
.day small{font-size:9px;font-weight:600;opacity:.7;margin-top:1px}
.day.low{background:#fff4dc;color:#8a5a00}
.day.full,.day.off{background:#f3f4f4;color:#b5bcbf;text-decoration:line-through;pointer-events:none}
.day.off{background:transparent;text-decoration:none}
.day.sel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;transform:scale(1.06);box-shadow:0 8px 18px -8px var(--pri)}
.day:not(.full):not(.off):hover{transform:scale(1.05)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row b{display:block;font-size:15px}.row small{color:var(--muted);font-size:12.5px}
.ctr{display:flex;align-items:center;gap:12px}
.ctr button{width:38px;height:38px;border-radius:12px;background:#eef3f1;font-size:20px;font-weight:700;transition:.15s}
.ctr button:active{transform:scale(.9)}
.ctr span{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.opt{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:10px;transition:.2s;width:100%;text-align:left}
.opt.on{border-color:var(--pri);background:#eefaf6}
.opt .ic{width:40px;height:40px;border-radius:12px;background:#eef3f1;display:grid;place-items:center;font-size:20px;flex:none}
.opt .tx{flex:1}.opt b{display:block;font-size:14.5px}.opt small{color:var(--muted);font-size:12.5px}
.sw{width:42px;height:24px;border-radius:12px;background:#d4dedb;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.opt.on .sw{background:var(--pri)}.opt.on .sw:after{left:21px}
.warn{background:#fff1f1;color:#b4232a;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fafcfb;font-size:15px;outline:0;transition:.2s}
.fld input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(20,160,133,.12)}
.fld.err input{border-color:var(--danger)}.fld .em{color:var(--danger);font-size:12px;margin-top:4px}
.tog{display:flex;background:#eef3f1;border-radius:14px;padding:4px}
.tog button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tog button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.link{color:var(--blue);font-size:13px;font-weight:700;text-decoration:underline;margin:2px 0 12px;display:inline-block}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}.actions .btn.sec{flex:0 0 auto}
.mock{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0b3b46,#14a085 60%,#2a7de1);margin:12px 0;position:relative;overflow:hidden}
.mock:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.mock small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}.mock b{display:block;font-size:19px;letter-spacing:2px;margin-top:10px}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;margin-top:8px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sum h3{font-size:16px;margin-bottom:10px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:var(--muted)}.sum .ln b{color:var(--ink)}
.sum .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.sum .tot .ln{font-size:15px;color:var(--ink);font-weight:800}
.sum .dep{background:#eefaf6;border-radius:14px;padding:12px;margin-top:10px}.sum .dep .ln{color:var(--pri);font-weight:800;font-size:15px}.sum .dep .ln.s{color:var(--muted);font-weight:600;font-size:13px}
.ok{width:76px;height:76px;margin:0 auto 10px;display:block}
.ok circle{stroke-dasharray:220;stroke-dashoffset:220;animation:dr .7s .1s forwards}.ok path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .6s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.center{text-align:center}
.voucher{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#06323a,#0e7c66);color:#fff;border-radius:20px;padding:16px;margin:16px 0;position:relative}
.voucher .qr{background:#fff;border-radius:12px;padding:6px;flex:none}
.voucher h4{font-size:17px;letter-spacing:-.3px}.voucher p{font-size:12.5px;opacity:.9;margin-top:2px}
.voucher .code{display:inline-block;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:8px;font-weight:800;letter-spacing:1.5px;margin-bottom:6px;font-size:13px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;overflow:auto}
.tabs button{padding:9px 14px;border-radius:999px;background:#eef3f1;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--deep);color:#fff}
.phone{background:#e8ddd0;border-radius:24px;overflow:hidden;border:1px solid var(--line);max-width:420px;margin:0 auto;box-shadow:var(--sh)}
.wah{background:#0b3b46;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.wah .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--blue));display:grid;place-items:center;font-weight:800}
.wah b{font-size:14.5px;display:block}.wah small{opacity:.75;font-size:11.5px}
.chat{padding:14px 12px;min-height:290px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.msg{max-width:86%;padding:8px 11px 6px;border-radius:14px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.1);animation:in .35s;word-wrap:break-word}
.msg.biz{background:#fff;border-top-left-radius:4px;align-self:flex-start}
.msg.usr{background:#d9fdd3;border-top-right-radius:4px;align-self:flex-end}
.msg .tm{display:block;text-align:right;font-size:10.5px;color:#7a8a8f;margin-top:2px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:10px 13px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9aa;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}}
.wafoot{background:#f0f0f0;padding:9px 12px;color:#8a979c;font-size:12.5px;display:flex;justify-content:space-between}
.mail{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;max-width:560px;margin:0 auto;box-shadow:var(--sh)}
.mail .mh{padding:12px 16px;background:#f7faf9;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}.mail .mh b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.mail .mb{padding:18px 18px 8px;font-size:14px}.mail .mb h3{font-size:19px;letter-spacing:-.4px;margin-bottom:8px}
.mail table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}.mail td{padding:8px 0;border-bottom:1px solid var(--line)}.mail td:last-child{text-align:right;font-weight:700}
.mail .cta{display:block;text-align:center;background:var(--pri);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin:14px 0}
.mail .ft{font-size:11.5px;color:var(--muted);padding:0 18px 16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}.kpi b{display:block;font-size:26px;letter-spacing:-.8px;margin-top:3px}.kpi em{font-style:normal;font-size:11.5px;color:var(--ok);font-weight:700}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:900px){.two{grid-template-columns:1.5fr 1fr;align-items:start}}
.bk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);margin-bottom:9px;width:100%;text-align:left;background:#fff;transition:.2s}
.bk:hover{border-color:var(--pri2);transform:translateY(-1px)}
.bk.new{background:#f1fbf7;border-color:var(--pri2);animation:glow 1.6s 2}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(20,160,133,.2)}}
.av2{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background:linear-gradient(135deg,var(--pri),var(--blue))}
.bk .m{flex:1;min-width:0}.bk b{font-size:14.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bk small{color:var(--muted);font-size:12.5px}
.bk .am{text-align:right;font-size:13px}.bk .am b{display:block;justify-content:flex-end}
.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;letter-spacing:.4px;text-transform:uppercase}
.tag.ex{background:#eef1f3;color:#6a7a82}.tag.nw{background:var(--ok);color:#fff}
.st{display:inline-block;font-size:11px;font-weight:700;color:var(--ok);background:#e6f7ef;padding:2px 8px;border-radius:8px;margin-top:2px}
.occ{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:9px 0}.occ span:first-child{width:62px;color:var(--muted);text-transform:capitalize}
.occ .tr{flex:1;height:10px;border-radius:6px;background:#e9efed;overflow:hidden}.occ .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pri2),var(--blue));transition:.6s}.occ .tr i.hot{background:linear-gradient(90deg,var(--acc),#ff6a3d)}
.occ b{width:44px;text-align:right}
.log{list-style:none}.log li{display:flex;gap:10px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}.log li:last-child{border:0}.log .ic{width:28px;height:28px;border-radius:9px;background:#eef6f3;display:grid;place-items:center;flex:none;font-size:14px}.log small{color:var(--muted);display:block;font-size:11.5px}
h3.sec{font-size:16px;margin:2px 0 12px;display:flex;justify-content:space-between;align-items:center}h3.sec small{font-size:12px;color:var(--muted);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(6,20,26,.6);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px;animation:up .3s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;background:#eef3f1;font-size:16px}
.details{display:grid;gap:16px;margin-top:16px}@media(min-width:760px){.details{grid-template-columns:1fr 1fr}}
.details h3{font-size:16px;margin-bottom:10px}
.tl{list-style:none;position:relative;padding-left:20px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--pri2),var(--blue));border-radius:2px}
.tl li{position:relative;padding:0 0 12px;font-size:13.5px}.tl li:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--pri2)}.tl b{color:var(--pri);margin-right:6px}
.ck{list-style:none}.ck li{font-size:13.5px;padding:4px 0 4px 24px;position:relative}.ck li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}.ck.no li:before{content:"✕";color:var(--danger)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:22px 14px 8px}
[hidden]{display:none!important}
.fall line{stroke:#fff;stroke-width:2;stroke-dasharray:14 22;animation:fl 1.1s linear infinite;opacity:.85}@keyframes fl{to{stroke-dashoffset:-36}}
</style>
</head>
<body>
<div class="demobar"><span class="dot"></span><span data-i="demobar"></span></div>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14a085"/><stop offset="1" stop-color="#2a7de1"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#lg)"/><path d="M16 6c-3 5-6 8-6 12a6 6 0 0012 0c0-4-3-7-6-12z" fill="#fff" opacity=".95"/></svg>
    <div><b>Bucay Adventures</b><small data-i="brandsub"></small></div>
  </div>
  <div class="seg"><button data-view="client" class="on" data-i="tabC"></button><button data-view="admin" data-i="tabA"></button><i class="badge" id="badge" hidden></i></div>
  <button class="lang" id="langBtn"><span id="lES">ES</span> · <span id="lEN">EN</span></button>
</header>

<!-- ========== CLIENTE ========== -->
<div id="vClient">
  <section class="hero">
    <svg class="heroart" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

const t=(k,v={})=>{let s=(T[S.lang][k]??T.es[k]??k);if(typeof s!=='string')return s;for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);

/* fechas */
const d0=new Date();d0.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const loc=l=>(l||S.lang)==='es'?'es-EC':'en-US';
const fd=(k,o,l)=>new Intl.DateTimeFormat(loc(l),o).format(parse(k));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dLong=(k,l)=>cap(fd(k,{weekday:'long',day:'numeric',month:'long'},l));
const maxD=addD(d0,120);

/* disponibilidad de ejemplo */
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const baseUsed=k=>{const h=hash(k)%13;return h>=11?12:h>=8?h-3:h%6};
const used=k=>baseUsed(k)+B.filter(b=>b.date===k).reduce((a,b)=>a+b.adults+b.kids,0);
const left=k=>Math.max(0,CAP-used(k));

/* precios */
function calc(o){
  const n=o.adults+o.kids;
  const lines=[];
  lines.push([t('liA',{n:o.adults}),o.adults*PRICE]);
  if(o.kids)lines.push([t('liK',{n:o.kids}),o.kids*PRICE*KID]);
  if(o.bf)lines.push([t('liBf',{n}),n*BF]);
  if(o.caps)lines.push([t('liCap',{n:o.caps}),o.caps*CAPP]);
  if(o.trans)lines.push([t('liTr'),TRANS]);
  const total=lines.reduce((a,l)=>a+l[1],0);
  const dep=Math.round(total/2*100)/100;
  return{n,lines,total,dep,bal:Math.round((total-dep)*100)/100};
}
const pplText=(b,l)=>{const w=T[l||S.lang];let s=b.adults+' '+w.adultW[b.adults===1?0:1];if(b.kids)s+=' + '+b.kids+' '+w.kidW[b.kids===1?0:1];return s};

  rows.forEach((r,i)=>{
    let off=r[3];let k=key(addD(d0,off));while(baseUsed(k)>=9){off++;k=key(addD(d0,off))}
    const o={adults:r[4],kids:r[5],bf:r[7],caps:r[8],trans:false};

    B.push({id:i,code:'BA-'+(2810+i*37),name:r[0],email:r[1],phone:r[2],date:k,adults:o.adults,kids:o.kids,bf:o.bf,caps:o.caps,trans:false,total:c.total,dep:c.dep,bal:c.bal,lang:r[6],example:true});

  $('#lES').className=S.lang==='es'?'on':'';$('#lEN').className=S.lang==='en'?'on':'';
  $('#itin').innerHTML=t('it').map(x=>`<li><b>${x[0]}</b>${esc(x[1])}</li>`).join('');
  $('#incl').innerHTML=t('inc').map(x=>`<li>${esc(x)}</li>`).join('');
  $('#notIncl').innerHTML=t('noinc').map(x=>`<li>${esc(x)}</li>`).join('');
  $('#bring').textContent=t('bringT');
}
function setView(v){
  S.view=v;$('#vClient').hidden=v!=='client';$('#vAdmin').hidden=v!=='admin';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));

}

/* ============ CLIENTE ============ */
function renderClient(){renderStepper();renderBody();renderSummary()}
function renderStepper(){
  if(S.done){$('#stepper').innerHTML='';return}
  $('#stepper').innerHTML=[1,2,3,4].map(i=>`<div class="stp ${S.step===i?'on':''} ${S.step>i?'done':''}"><div class="bar"><i></i></div>${i}. ${t('st'+i)}</div>`).join('');
}
function renderBody(){
  const el=$('#stepBody');
  if(S.done){renderDone(el);return}
  if(S.step===1)el.innerHTML=step1();
  if(S.step===2)el.innerHTML=step2();
  if(S.step===3)el.innerHTML=step3();
  if(S.step===4)el.innerHTML=step4();
}
function step1(){
  if(!S.month)S.month=new Date(addD(d0,1).getFullYear(),addD(d0,1).getMonth(),1);
  const m=S.month,first=new Date(m.getFullYear(),m.getMonth(),1),off=(first.getDay()+6)%7,nd=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const mon=new Date(2024,0,1);
  const dow=[...Array(7)].map((_,i)=>`<div>${new Intl.DateTimeFormat(loc(),{weekday:'short'}).format(addD(mon,i))}</div>`).join('');
  let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
  for(let d=1;d<=nd;d++){
    const dt=new Date(m.getFullYear(),m.getMonth(),d),k=key(dt);
    if(dt<=d0||dt>maxD){cells+=`<div class="day off">${d}</div>`;continue}
    const l=left(k),cls=l<=0?'full':l<=4?'low':'';
    cells+=`<button class="day ${cls} ${S.date===k?'sel':''}" onclick="pickDate('${k}')">${d}${l>0&&l<=4?`<small>${l}</small>`:''}</button>`;
  }
  const prevOff=m<=new Date(d0.getFullYear(),d0.getMonth(),1),nextOff=m>=new Date(maxD.getFullYear(),maxD.getMonth(),1);
  const sel=S.date?`<div class="note" style="font-size:13.5px;color:var(--ink);margin-top:6px">📅 <b>${dLong(S.date)}</b> · ${t('leftN',{n:left(S.date)})}</div>`:'';
  return `<h2 class="t">${t('pickDate')}</h2><p class="sub">${t('pickSub')}</p>
  <div class="cal"><div class="head"><button class="nav" ${prevOff?'disabled':''} onclick="moveMonth(-1)">‹</button><b>${cap(new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(m))}</b><button class="nav" ${nextOff?'disabled':''} onclick="moveMonth(1)">›</button></div>
  <div class="dow">${dow}</div><div class="days">${cells}</div></div>
  <div class="legend"><span><i style="background:#cdebe2"></i>${t('lgOk')}</span><span><i style="background:#ffe3a3"></i>${t('lgLow')}</span><span><i style="background:#dfe4e4"></i>${t('lgFull')}</span></div>${sel}
  <div class="actions"><button class="btn pri" ${S.date?'':'disabled'} onclick="go(2)">${t('next')} →</button></div>`;
}
function step2(){
  const l=left(S.date),n=S.adults+S.kids;
  let w='';if(n<2)w=t('minP');else if(n>l)w=t('maxP',{n:l});
  const ctr=(k,v)=>`<div class="ctr"><button onclick="chg('${k}',-1)">−</button><span>${v}</span><button onclick="chg('${k}',1)">+</button></div>`;
  return `<h2 class="t">${t('who')}</h2><p class="sub">${t('leftN',{n:l})} · <span>${dLong(S.date)}</span></p>
  <div class="row"><div><b>${t('adults')}</b><small>${t('adultsS')} · ${money(PRICE)}</small></div>${ctr('adults',S.adults)}</div>
  <div class="row"><div><b>${t('kids')}</b><small>${t('kidsS')}</small></div>${ctr('kids',S.kids)}</div>
  <h3 style="margin:18px 0 10px;font-size:15px">${t('extras')}</h3>
  <button class="opt ${S.bf?'on':''}" onclick="tg('bf')"><span class="ic">🍳</span><span class="tx"><b>${t('bf')}</b><small>${t('bfS',{p:money(BF)})}</small></span><span class="sw"></span></button>
  <button class="opt ${S.trans?'on':''}" onclick="tg('trans')"><span class="ic">🚐</span><span class="tx"><b>${t('trans')}</b><small>${t('transS',{p:money(TRANS)})}</small></span><span class="sw"></span></button>
  <div class="opt" style="cursor:default"><span class="ic">🧢</span><span class="tx"><b>${t('caps')}</b><small>${t('capsS',{p:money(CAPP)})}</small></span>${ctr('caps',S.caps)}</div>
  ${w?`<div class="warn">${w}</div>`:''}
  <div class="actions"><button class="btn sec" onclick="go(1)">←</button><button class="btn pri" ${w?'disabled':''} onclick="go(3)">${t('next')} →</button></div>`;
}
function step3(){
  if(!S.clang)S.clang=S.lang;
  const f=(id,label,type,ph,val)=>`<div class="fld ${S.errs[id]?'err':''}"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(val)}" placeholder="${ph}" oninput="S.${id}=this.value" autocomplete="off">${S.errs[id]?`<div class="em">${S.errs[id]}</div>`:''}</div>`;
  return `<h2 class="t">${t('yourData')}</h2><p class="sub">${t('yourDataS')}</p>
  <button class="link" onclick="autofill()">${t('autofill')}</button>
  ${f('name',t('name'),'text','Ej. Laura Gómez',S.name)}${f('email',t('email'),'email','nombre@correo.com',S.email)}${f('phone',t('phone'),'tel','+593 99 123 4567',S.phone)}
  <div class="fld"><label>${t('confLang')}</label><div class="tog"><button class="${S.clang==='es'?'on':''}" onclick="S.clang='es';renderBody()">Español</button><button class="${S.clang==='en'?'on':''}" onclick="S.clang='en';renderBody()">English</button></div></div>
  <div class="actions"><button class="btn sec" onclick="go(2)">←</button><button class="btn pri" onclick="validate()">${t('next')} →</button></div>`;
}
function step4(){
  const c=calc(S);
  return `<h2 class="t">${t('payT')}</h2><p class="sub">${t('payS')}</p>
  <div class="tog" style="margin-bottom:6px"><button class="${S.pay==='card'?'on':''}" onclick="S.pay='card';renderBody()">💳 ${t('card')}</button><button class="${S.pay==='bank'?'on':''}" onclick="S.pay='bank';renderBody()">🏦 ${t('transfer')}</button></div>
  <div class="mock"><small>${S.pay==='card'?t('card'):t('transfer')} · demo</small><b>•••• •••• •••• 4242</b></div>
  <div class="note">🔒 ${t('simNote')}</div>
  <div class="actions"><button class="btn sec" onclick="go(3)" ${S.paying?'disabled':''}>←</button><button class="btn pri" onclick="doPay()" ${S.paying?'disabled':''}>${S.paying?`<span class="spin"></span> ${t('processing')}`:t('pay',{a:money(c.dep)})}</button></div>`;
}
function renderSummary(){
  const c=calc(S),has=!!S.date;
  $('#summary').innerHTML=`<h3>${t('sumT')}</h3>
  <div class="ln"><span>${t('sumTour')}</span></div>
  <div class="ln"><span>${t('sumDate')}</span><b>${has?dLong(S.date):t('none')}</b></div>
  <div class="ln"><span>${t('sumPeople')}</span><b>${pplText(S)}</b></div>
  ${c.lines.map(l=>`<div class="ln"><span>${l[0]}</span><b>${money(l[1])}</b></div>`).join('')}
  <div class="tot"><div class="ln"><span>${t('total')}</span><span>${money(c.total)}</span></div></div>
  <div class="dep"><div class="ln"><span>${t('deposit')}</span><span>${money(c.dep)}</span></div><div class="ln s"><span>${t('balance')}</span><span>${money(c.bal)}</span></div></div>`;
}
/* acciones cliente */
function pickDate(k){S.date=k;const n=S.adults+S.kids;renderClient()}
function moveMonth(d){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+d,1);renderBody()}
function go(n){S.step=n;renderClient();document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'})}
function chg(k,d){
  const min=k==='adults'?1:0;S[k]=Math.max(min,S[k]+d);
  if(k==='caps')S.caps=Math.min(S.caps,20);renderClient();
}
function tg(k){S[k]=!S[k];renderClient()}
function autofill(){S.name='Laura Gómez (ejemplo)';S.email='laura.ejemplo@correo.com';S.phone='+593 99 123 4567';S.errs={};renderBody()}
function validate(){
  S.errs={};
  if(S.name.trim().length<2)S.errs.name=t('errName');
  if(!/^\S+@\S+\.\S+$/.test(S.email.trim()))S.errs.email=t('errEmail');
  if(S.phone.replace(/\D/g,'').length<7)S.errs.phone=t('errPhone');
  if(Object.keys(S.errs).length){renderBody();return}
  go(4);
}
function doPay(){
  S.paying=true;renderBody();
  setTimeout(()=>{
    const c=calc(S),b={id:B.length+10,code:'BA-'+(3000+Math.floor(Math.random()*6999)),name:S.name.trim(),email:S.email.trim(),phone:S.phone.trim(),date:S.date,adults:S.adults,kids:S.kids,bf:S.bf,caps:S.caps,trans:S.trans,total:c.total,dep:c.dep,bal:c.bal,lang:S.clang||S.lang,example:false,isNew:true,method:S.pay};
    B.unshift(b);LOG.unshift({k:'pay',b},{k:'wa',b},{k:'mail',b},{k:'rem',b});
    S.done=b;S.paying=false;S.newCount++;updateBadge();renderClient();
    document.getElementById('book').scrollIntoView({behavior:'smooth',block:'start'});
  },1600);
}
function reset(){Object.assign(S,{step:1,date:null,adults:2,kids:0,bf:false,caps:0,trans:false,name:'',email:'',phone:'',clang:null,done:null,errs:{},month:null});renderClient();document.getElementById('book').scrollIntoView({behavior:'smooth'})}

/* ============ CONFIRMACIÓN ============ */
function renderDone(el){
  const b=S.done;
  el.innerHTML=`<div class="center"><svg class="ok" viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="35" stroke="#12a36b" stroke-width="6"/><path d="M24 41l12 12 21-24" stroke="#12a36b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2 class="t">${t('done')}</h2><p class="sub">${t('doneS')}</p></div>
  <div class="voucher"><div class="qr">${qr(b.code)}</div><div><span class="code">${b.code}</span><h4>${t('vTour')}</h4><p>${dLong(b.date,S.lang)} · 10:00</p><p>${pplText(b,S.lang)}</p></div></div>
  <div id="msgMount"></div>
  <div class="actions" style="flex-wrap:wrap"><button class="btn sec" onclick="reset()">${t('another')}</button><button class="btn pri" onclick="setView('admin')">${t('seeAdmin')}</button></div>`;
  msgTabs(b,$('#msgMount'));
}
function qr(code){
  let h=hash(code),s='';const n=9,u=5;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const fin=(x<3&&y<3)||(x>5&&y<3)||(x<3&&y>5);
    h=(h*1103515245+12345)>>>0;
    if(fin||(h>>16)%2)s+=`<rect x="${x*u}" y="${y*u}" width="${u}" height="${u}" rx="1"/>`;
  }
  return `<svg width="64" height="64" viewBox="0 0 45 45" fill="#06323a">${s}</svg>`;
}

/* ============ MENSAJES (WhatsApp / correo / recordatorio) ============ */
let TOK=0;
function msgTabs(b,mount,tab='wa'){
  const L=b.lang;
  mount.innerHTML=`<div class="tabs"><button class="${tab==='wa'?'on':''}" data-t="wa">💬 ${T[S.lang].tWa}</button><button class="${tab==='mail'?'on':''}" data-t="mail">✉️ ${T[S.lang].tMail}</button><button class="${tab==='rem'?'on':''}" data-t="rem">⏰ ${T[S.lang].tRem}</button></div><div class="mv"></div>`;
  mount.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>msgTabs(b,mount,x.dataset.t));
  const mv=mount.querySelector('.mv');
  if(tab==='mail')mv.innerHTML=emailHTML(b);else showChat(mv,b,tab);
}
const tl=(l,k,v)=>{let s=T[l][k];for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
function vars(b){const first=b.name.split(/[\s(]/)[0];return{first,code:b.code,date:dLong(b.date,b.lang),ppl:pplText(b,b.lang),dep:money(b.dep),bal:money(b.bal)}}
const wa=s=>esc(s).replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function showChat(mv,b,tab){
  const L=b.lang,v=vars(b),tok=++TOK;
  const now=new Date(),hm=d=>d.toLocaleTimeString(loc(L),{hour:'2-digit',minute:'2-digit'});
  const msgs=tab==='wa'?[['biz',tl(L,'wa1',v),hm(now)],['biz',tl(L,'wa2',v),hm(now)],['usr',tl(L,'wa3',v),hm(addD(now,0))]]
                       :[['biz',tl(L,'r1',v),'09:00'],['usr',tl(L,'r2',v),'09:14'],['biz',tl(L,'r3',v),'09:14']];
  mv.innerHTML=`<div class="phone"><div class="wah"><div class="av">B</div><div><b>Bucay Adventures</b><small>${T[L].wahSub}</small></div></div><div class="chat" id="chatBody"></div><div class="wafoot"><span>${T[L].wafoot}</span><span>🎙️</span></div></div>`;
  const body=mv.querySelector('#chatBody');let i=0;
  const next=()=>{
    if(tok!==TOK||i>=msgs.length)return;
    const m=msgs[i];
    if(m[0]==='biz'){
      const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';body.appendChild(ty);
      setTimeout(()=>{if(tok!==TOK)return;ty.remove();add(m);i++;setTimeout(next,450)},750);
    }else{setTimeout(()=>{if(tok!==TOK)return;add(m);i++;setTimeout(next,300)},600)}
  };
  const add=m=>{const d=document.createElement('div');d.className='msg '+m[0];d.innerHTML=wa(m[1])+`<span class="tm">${m[2]}${m[0]==='usr'?' ✓✓':''}</span>`;body.appendChild(d)};
  next();
}
function emailHTML(b){
  const L=b.lang,v=vars(b),w=T[L];
  return `<div class="mail"><div class="mh"><b>${esc(tl(L,'mSubj',v))}</b>${w.mFrom}: Bucay Adventures · ${w.mTo}: ${esc(b.email)}</div>
  <div class="mb"><h3>${esc(tl(L,'mH',v))}</h3><p>${esc(w.mP)}</p>
  <table><tr><td>${w.mTour}</td><td>${esc(w.vTour)}</td></tr><tr><td>${w.mDate}</td><td>${esc(tl(L,'dt',{d:dLong(b.date,L)}))}</td></tr><tr><td>${w.mPpl}</td><td>${esc(pplText(b,L))}</td></tr><tr><td>${w.mDep}</td><td>${money(b.dep)}</td></tr><tr><td>${w.mBal}</td><td>${money(b.bal)}</td></tr></table>
  <div style="display:flex;justify-content:center;margin:6px 0">${qr(b.code)}</div><p style="text-align:center;font-weight:800;letter-spacing:2px">${b.code}</p>
  <span class="cta">${w.mBtn}</span></div><div class="ft">${esc(w.mFt)}</div></div>`;
}

/* ============ NEGOCIO ============ */
function renderAdmin(){
  const dep=B.reduce((a,b)=>a+b.dep,0),bal=B.reduce((a,b)=>a+b.bal,0),ppl=B.reduce((a,b)=>a+b.adults+b.kids,0),nw=B.filter(b=>b.isNew).length;
  $('#kpis').innerHTML=[['kRes',B.length,nw?t('kNew',{n:nw}):''],['kDep',money(dep),''],['kBal',money(bal),''],['kPpl',ppl,'']].map(k=>`<div class="kpi"><small>${t(k[0])}</small><b>${k[1]}</b><em>${k[2]}</em></div>`).join('');
  const sorted=[...B].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)||a.date.localeCompare(b.date));
  $('#bkList').innerHTML=sorted.map(b=>`<button class="bk ${b.isNew?'new':''}" onclick="openBk(${b.id})"><div class="av2">${esc(b.name[0])}</div><div class="m"><b>${esc(b.name)}${b.example?`<span class="tag ex">${t('ex')}</span>`:''}${b.isNew?`<span class="tag nw">${t('nw')}</span>`:''}</b><small>${fd(b.date,{weekday:'short',day:'numeric',month:'short'})} · ${pplText(b)}</small><br><span class="st">✓ ${t('stPaid')}</span></div><div class="am"><b>${money(b.total)}</b><small>${money(b.bal)} ${t('bal')}</small></div></button>`).join('');
  const days=[...Array(7)].map((_,i)=>key(addD(d0,i+1)));
  $('#occ').innerHTML=days.map(k=>{const u=Math.min(CAP,used(k)),p=Math.round(u/CAP*100);return `<div class="occ"><span>${fd(k,{weekday:'short',day:'numeric'})}</span><div class="tr"><i class="${p>=75?'hot':''}" style="width:${p}%"></i></div><b>${u}/${CAP}</b></div>`}).join('');
  const ic={pay:'💳',wa:'💬',mail:'✉️',rem:'⏰'};
  $('#log').innerHTML=LOG.slice(0,8).map(e=>{const txt=e.k==='pay'?t('lgPay',{a:money(e.b.dep),c:e.b.code}):e.k==='wa'?t('lgWa',{n:esc(e.b.name)}):e.k==='mail'?t('lgMail',{n:esc(e.b.email)}):t('lgRem',{n:esc(e.b.name)});return `<li><span class="ic">${ic[e.k]}</span><div>${txt}<small>${e.b.example?t('ex'):t('nw')} · ${e.b.code}</small></div></li>`}).join('');
}
function openBk(id){
  const b=B.find(x=>x.id===id);if(!b)return;
  $('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet"><button class="x" onclick="closeM()">✕</button><h3 style="font-size:18px">${esc(b.name)} <span style="color:var(--muted);font-weight:600;font-size:13px">${b.code}</span></h3><p class="sub" style="text-transform:capitalize;margin:4px 0 8px">${dLong(b.date)} · 10:00 · ${pplText(b)} · ${money(b.total)}</p><div id="mm"></div></div></div>`;
  msgTabs(b,$('#mm'));
}
function closeM(){TOK++;$('#modal').innerHTML=''}

/* ============ INICIO ============ */
applyI18n();renderClient();
</script>
</body>
</html>
